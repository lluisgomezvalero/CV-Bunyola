name: Publish simplified game plan visuals

on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-visual-simplify-20260814.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh page cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text()
          text=text.replace('20260814e','20260814f')
          p.write_text(text)
          PY
      - name: Validate JavaScript
        run: |
          node --check game-plan-visual-simplify-20260814.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish game plan visual simplification"
            git push origin main
          fi
      - name: Remove workflow
        run: |
          git pull --rebase origin main
          git rm .github/workflows/publish-game-plan-visual-simplify-20260814.yml
          git commit -m "Remove temporary game plan visual workflow"
          git push origin main
