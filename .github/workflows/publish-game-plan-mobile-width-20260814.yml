name: Publish game plan mobile width fix

on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-mobile-width-20260814.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh game plan cache version
        run: |
          python - <<'PY'
          from pathlib import Path

          cfg = Path('supabase-config.js')
          text = cfg.read_text()
          text = text.replace("window.VOLLEY_ASSET_VERSION = '20260814l';", "window.VOLLEY_ASSET_VERSION = '20260814m';")
          needle = "'game-plan-coach-top-compact-20260814.js?v=20260814l'];scripts.forEach"
          repl = "'game-plan-coach-top-compact-20260814.js?v=20260814l','game-plan-mobile-width-fix-20260814.js?v=20260814m'];scripts.forEach"
          if needle not in text:
              raise SystemExit('Could not find script-list insertion point')
          text = text.replace(needle, repl, 1)
          cfg.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          for name in ('supabase-config.js','supabase-client.js','data.js','app.js'):
              html = html.replace(f'{name}?v=20260814l', f'{name}?v=20260814m')
          index.write_text(html)
          PY

      - name: Validate JavaScript
        run: |
          node --check game-plan-mobile-width-fix-20260814.js
          node --check supabase-config.js

      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Publish wider mobile game plan layout" || true
          git push

      - name: Remove workflow
        run: |
          git rm .github/workflows/publish-game-plan-mobile-width-20260814.yml
          git commit -m "Remove temporary mobile width publish workflow"
          git push
