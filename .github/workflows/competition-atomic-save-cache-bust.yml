name: Refresh competition atomic save

on:
  push:
    paths:
      - '.github/workflows/competition-atomic-save-cache-bust.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh competition atomic save assets
        run: |
          sed -i "s/window.VOLLEY_ASSET_VERSION = '20260820g'/window.VOLLEY_ASSET_VERSION = '20260820h'/g" supabase-config.js
          sed -i "s/competition-logo-display-sync-20260820.js?v=20260820a/competition-logo-display-sync-20260820.js?v=20260820b/g" supabase-config.js
          sed -i 's/supabase-config.js?v=20260820safe20/supabase-config.js?v=20260820safe21/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          if git diff --cached --quiet; then
            echo "No cache change needed"
          else
            git commit -m "Refresh competition atomic save assets"
            git push
          fi
