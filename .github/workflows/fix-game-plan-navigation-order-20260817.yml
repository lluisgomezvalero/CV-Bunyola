name: Fix game plan navigation order
on:
  push:
    paths:
      - '.github/workflows/fix-game-plan-navigation-order-20260817.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Queue authoritative refreshes instead of dropping them while a tick is active.
          p=Path('game-plan-authoritative-20260809.js')
          t=p.read_text()
          t=t.replace("let ticking=false;\nlet rendering=false;", "let ticking=false;\nlet rerunRequested=false;\nlet rendering=false;")
          t=t.replace("async function tick(){\n  if(ticking||document.hidden)return;", "async function tick(){\n  if(document.hidden)return;\n  if(ticking){rerunRequested=true;return;}")
          t=t.replace("  finally{ticking=false;}\n}", "  finally{\n    ticking=false;\n    if(rerunRequested){\n      rerunRequested=false;\n      setTimeout(()=>{void tick();},0);\n    }\n  }\n}")
          p.write_text(t)

          # 2) Expose the already existing tab refresh function.
          p=Path('game-plan-coach-attack-tabs-20260816.js')
          t=p.read_text()
          marker="function bindRoot(){"
          if "window.refreshCoachAttackTabs" not in t:
            t=t.replace(marker, "window.refreshCoachAttackTabs=schedule;\n"+marker)
          p.write_text(t)

          # 3) Ask tabs to reapply after temporal navigation decoration.
          p=Path('game-plan-navigation-20260817.js')
          t=p.read_text()
          old="function afterRender(){\n  decorateHeader();\n  if(mode==='current'&&!currentWeekMatch())emptyCurrentState();\n  try{window.lucide?.createIcons?.();}catch(_){}\n}"
          new="function afterRender(){\n  decorateHeader();\n  if(mode==='current'&&!currentWeekMatch())emptyCurrentState();\n  try{window.refreshCoachAttackTabs?.();}catch(_){}\n  try{window.lucide?.createIcons?.();}catch(_){}\n}"
          if old not in t:
            raise SystemExit('afterRender marker not found')
          t=t.replace(old,new)
          p.write_text(t)

          # 4) Load temporal navigation LAST so every game-plan renderer is already installed.
          p=Path('supabase-config.js')
          t=p.read_text()
          t=t.replace("window.VOLLEY_ASSET_VERSION = '20260817a';", "window.VOLLEY_ASSET_VERSION = '20260817b';")
          nav="  'game-plan-navigation-20260817.js?v=20260817a',\n"
          if nav not in t:
            raise SystemExit('navigation loader line not found')
          t=t.replace(nav,'')
          anchor="  'game-plan-player-rival-serve-20260816.js?v=20260816p',\n"
          if anchor not in t:
            raise SystemExit('loader anchor not found')
          t=t.replace(anchor, anchor+"  'game-plan-navigation-20260817.js?v=20260817b',\n")
          t=t.replace("'game-plan-authoritative-20260809.js?v=20260817a'", "'game-plan-authoritative-20260809.js?v=20260817b'")
          t=t.replace("'game-plan-coach-attack-tabs-20260816.js?v=20260816q'", "'game-plan-coach-attack-tabs-20260816.js?v=20260817b'")
          p.write_text(t)

          # 5) Force the browser to fetch the new config.
          p=Path('index.html')
          t=p.read_text()
          import re
          t,n=re.subn(r'supabase-config\.js\?v=[A-Za-z0-9]+','supabase-config.js?v=20260817b',t,count=1)
          if n!=1:
            raise SystemExit('supabase-config script tag not found')
          p.write_text(t)
          PY
      - name: Validate
        run: |
          node --check game-plan-authoritative-20260809.js
          node --check game-plan-coach-attack-tabs-20260816.js
          node --check game-plan-navigation-20260817.js
          grep -q "window.VOLLEY_ASSET_VERSION = '20260817b'" supabase-config.js
          grep -q "game-plan-authoritative-20260809.js?v=20260817b" supabase-config.js
          grep -q "game-plan-coach-attack-tabs-20260816.js?v=20260817b" supabase-config.js
          grep -q "game-plan-navigation-20260817.js?v=20260817b" supabase-config.js
          python - <<'PY'
          from pathlib import Path
          t=Path('supabase-config.js').read_text()
          assert t.count('game-plan-navigation-20260817.js') == 1
          assert t.index('game-plan-navigation-20260817.js') > t.index('game-plan-player-rival-serve-20260816.js')
          assert 'supabase-config.js?v=20260817b' in Path('index.html').read_text()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-plan-authoritative-20260809.js game-plan-coach-attack-tabs-20260816.js game-plan-navigation-20260817.js supabase-config.js index.html
          git commit -m "Fix game plan navigation render order and read refresh"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/fix-game-plan-navigation-order-20260817.yml
          git commit -m "Remove temporary navigation order workflow"
          git push
