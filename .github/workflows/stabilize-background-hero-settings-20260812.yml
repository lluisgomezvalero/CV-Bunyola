name: Stabilize background hero settings

on:
  push:
    paths:
      - '.github/workflows/stabilize-background-hero-settings-20260812.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          s = app.read_text(encoding='utf-8')
          needle = '    root.querySelector(".dashboard-hero"),\n'
          if needle not in s:
              raise SystemExit('dashboard hero animation marker not found')
          s = s.replace(needle, '', 1)
          app.write_text(s, encoding='utf-8')

          p = Path('app-shell-polish-20260812.js')
          js = p.read_text(encoding='utf-8')

          if 'let settingsTransaction=null;' not in js:
              js = js.replace('let loadBusy=false;', 'let loadBusy=false;\nlet settingsTransaction=null;\nlet settingsTransactionBusy=false;', 1)

          # Fondo: evita que Chrome Android recalcule el encuadre al cambiar la barra del navegador.
          js, count = re.subn(
              r'body::before\{content:"";position:fixed;z-index:-2;inset:0;pointer-events:none;background:(.*?)background-size:cover;background-position:center;transform:translateZ\(0\)\}',
              r'body::before{content:"";position:fixed;z-index:-2;left:0;right:0;top:0;bottom:auto;width:100%;height:100vh;height:100lvh;pointer-events:none;background:\1background-size:cover;background-position:center top;background-repeat:no-repeat;transform:none!important;will-change:auto}',
              js, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('background before marker not found')
          old_after = 'body::after{content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(248,250,252,.18))}'
          new_after = 'body::after{content:"";position:fixed;z-index:-1;left:0;right:0;top:0;bottom:auto;width:100%;height:100vh;height:100lvh;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(248,250,252,.18));transform:none!important}'
          if old_after not in js:
              raise SystemExit('background after marker not found')
          js = js.replace(old_after, new_after, 1)
          js = js.replace('background-position:center center;background-repeat:no-repeat}', 'background-position:center top;background-repeat:no-repeat}', 1)

          # Cabecera fuera de capas GPU problemáticas.
          hero_marker = '    #dashboard-hero,#dashboard-hero .dashboard-hero-content'
          if hero_marker not in js:
              raise SystemExit('hero css marker not found')
          hero_prefix = '''    #dashboard-hero{transform:none!important;filter:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;will-change:auto!important;contain:none!important;isolation:isolate}\n    #dashboard-hero .dashboard-hero-overlay{z-index:0!important;pointer-events:none!important}\n    #dashboard-hero .dashboard-hero-content{position:relative!important;z-index:2!important;display:flex!important}\n'''
          js = js.replace(hero_marker, hero_prefix + hero_marker, 1)

          old_upload = '    if(oldPath&&oldPath!==newPath){try{await c.storage.from(BUCKET).remove([oldPath]);}catch(_){} }'
          if old_upload not in js:
              raise SystemExit('upload cleanup marker not found')
          js = js.replace(old_upload, '    if(settingsTransaction){settingsTransaction.tempPaths.add(newPath);}', 1)

          old_reset = '    if(oldPath){try{await client()?.storage.from(BUCKET).remove([oldPath]);}catch(_){} }'
          if old_reset not in js:
              raise SystemExit('reset cleanup marker not found')
          js = js.replace(old_reset, '    // La foto anterior se conserva hasta Guardar Ajustes para permitir Cancelar.', 1)

          transaction = r'''
          function cloneBackground(value){
            return {mode:value?.mode==='photo'?'photo':'default',path:value?.path||null};
          }
          async function applyBackgroundDescriptor(background){
            const bg=cloneBackground(background);
            if(bg.mode==='photo'&&bg.path){
              const url=await signedUrlFor(bg.path);
              if(url){applyPhotoBackground(url,bg.path);return;}
            }
            applyDefaultBackground();
          }
          function beginSettingsTransaction(){
            if(settingsTransactionBusy) return;
            settingsTransaction={original:cloneBackground(activeBackground),tempPaths:new Set(),committed:false};
            setStatus('');
          }
          async function cleanupTransactionFiles(transaction,keepPath=null){
            const c=client();
            if(!c||!transaction) return;
            const paths=[...transaction.tempPaths].filter(path=>path&&path!==keepPath);
            if(paths.length){try{await c.storage.from(BUCKET).remove(paths);}catch(error){console.warn('[SharedBackground] cleanup temp',error);}}
          }
          async function commitSettingsTransaction(){
            const transaction=settingsTransaction;
            if(!transaction||settingsTransactionBusy) return;
            settingsTransactionBusy=true;
            try{
              const current=cloneBackground(activeBackground);
              const keepPath=current.mode==='photo'?current.path:null;
              await cleanupTransactionFiles(transaction,keepPath);
              const oldPath=transaction.original.mode==='photo'?transaction.original.path:null;
              if(oldPath&&oldPath!==keepPath){try{await client()?.storage.from(BUCKET).remove([oldPath]);}catch(error){console.warn('[SharedBackground] cleanup previous',error);}}
              transaction.committed=true;
              settingsTransaction=null;
            }finally{settingsTransactionBusy=false;}
          }
          async function rollbackSettingsTransaction(){
            const transaction=settingsTransaction;
            if(!transaction||transaction.committed||settingsTransactionBusy) return;
            settingsTransactionBusy=true;
            try{
              const original=cloneBackground(transaction.original);
              await saveBackgroundSetting(original);
              await applyBackgroundDescriptor(original);
              await cleanupTransactionFiles(transaction,original.mode==='photo'?original.path:null);
              settingsTransaction=null;
            }catch(error){
              console.error('[SharedBackground] rollback',error);
              toast('No se pudo restaurar el fondo anterior.','error');
            }finally{settingsTransactionBusy=false;}
          }
          function installSettingsTransaction(){
            const openButton=document.getElementById('btn-club-settings');
            const modal=document.getElementById('modal-club-settings');
            const form=document.getElementById('form-club-settings');
            if(openButton&&openButton.dataset.bgTransactionBound!=='1'){
              openButton.dataset.bgTransactionBound='1';
              openButton.addEventListener('click',()=>beginSettingsTransaction(),true);
            }
            if(form&&form.dataset.bgTransactionBound!=='1'){
              form.dataset.bgTransactionBound='1';
              form.addEventListener('submit',()=>{void commitSettingsTransaction();},false);
            }
            if(modal&&modal.dataset.bgTransactionBound!=='1'){
              modal.dataset.bgTransactionBound='1';
              modal.addEventListener('click',event=>{
                const cancel=event.target.closest('.modal-close-btn,.modal-close');
                const backdrop=event.target===modal;
                if((!cancel&&!backdrop)||!settingsTransaction) return;
                event.preventDefault();
                event.stopImmediatePropagation();
                void rollbackSettingsTransaction().finally(()=>{
                  modal.classList.remove('active');
                  document.body.classList.remove('modal-open');
                });
              },true);
            }
          }

          '''
          marker = 'function installBackgroundControls(){'
          if marker not in js:
              raise SystemExit('background controls marker not found')
          js = js.replace(marker, transaction + marker, 1)
          js = js.replace('Solo el administrador puede cambiar el fondo global.', 'Solo el cuerpo técnico puede cambiar el fondo global.')

          old_init = '''  buildBottomNav();\n  observeNavigation();\n  installBackgroundControls();\n  waitForAuthenticatedClient();'''
          new_init = '''  buildBottomNav();\n  observeNavigation();\n  installBackgroundControls();\n  installSettingsTransaction();\n  const hero=document.getElementById('dashboard-hero');\n  if(hero){hero.classList.remove('dashboard-motion-ready','dashboard-motion-visible');hero.style.removeProperty('--motion-order');}\n  waitForAuthenticatedClient();'''
          if old_init not in js:
              raise SystemExit('shell init marker not found')
          js = js.replace(old_init, new_init, 1)

          old_timeout = '''  setTimeout(installBackgroundControls,700);\n  setTimeout(()=>{syncBottomActive();syncSettingsUi();},1200);'''
          new_timeout = '''  setTimeout(()=>{installBackgroundControls();installSettingsTransaction();},700);\n  setTimeout(()=>{syncBottomActive();syncSettingsUi();installSettingsTransaction();},1200);'''
          if old_timeout not in js:
              raise SystemExit('shell timeout marker not found')
          js = js.replace(old_timeout, new_timeout, 1)
          p.write_text(js, encoding='utf-8')

          cfg = Path('supabase-config.js')
          c = cfg.read_text(encoding='utf-8')
          if "window.VOLLEY_ASSET_VERSION = '20260812m';" not in c:
              raise SystemExit('root cache m not found')
          c = c.replace("window.VOLLEY_ASSET_VERSION = '20260812m';", "window.VOLLEY_ASSET_VERSION = '20260812n';", 1)
          if 'app-shell-polish-20260812.js?v=20260812m' not in c:
              raise SystemExit('shell cache m not found')
          c = c.replace('app-shell-polish-20260812.js?v=20260812m', 'app-shell-polish-20260812.js?v=20260812n', 1)
          cfg.write_text(c, encoding='utf-8')

          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          for name in ['styles.css','supabase-config.js','supabase-client.js','data.js','app.js']:
              html = html.replace(f'{name}?v=20260812m', f'{name}?v=20260812n')
          idx.write_text(html, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check app.js
          node --check app-shell-polish-20260812.js
          grep -q 'height:100lvh' app-shell-polish-20260812.js
          grep -q 'beginSettingsTransaction' app-shell-polish-20260812.js
          grep -q 'rollbackSettingsTransaction' app-shell-polish-20260812.js
          ! grep -q 'root.querySelector(".dashboard-hero"),' app.js
          grep -q "VOLLEY_ASSET_VERSION = '20260812n'" supabase-config.js
          grep -q 'app-shell-polish-20260812.js?v=20260812n' supabase-config.js
          grep -q 'app.js?v=20260812n' index.html

      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stabilize-background-hero-settings-20260812.yml
          git add app.js app-shell-polish-20260812.js supabase-config.js index.html
          git commit -m "Stabilize mobile background and settings cancel"
          git push
