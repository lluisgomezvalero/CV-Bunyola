name: Refresh league standings assets

on:
  push:
    paths:
      - '.github/workflows/league-standings-cache-bust.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh shared standings assets
        run: |
          sed -i 's/supabase-config.js?v=20260819safe8/supabase-config.js?v=20260819safe9/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No cache change needed"
          else
            git commit -m "Refresh shared league standings assets"
            git push
          fi
