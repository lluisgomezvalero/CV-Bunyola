name: Publish final game plan label fix
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-final-label-fix-20260814.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh page cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('supabase-config.js?v=20260814h','supabase-config.js?v=20260814i')
          s=s.replace('supabase-client.js?v=20260814h','supabase-client.js?v=20260814i')
          s=s.replace('data.js?v=20260814h','data.js?v=20260814i')
          s=s.replace('app.js?v=20260814h','app.js?v=20260814i')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: node --check game-plan-final-label-fix-20260814.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh cache for game plan label fix"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-final-label-fix-20260814.yml
          git commit -m "Remove temporary game plan label workflow"
          git push