name: Fix wellness initial render

on:
  push:
    paths:
      - '.github/workflows/fix-wellness-initial-render-20260821.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retry unified wellness render until user role is ready
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('wellness-unified-mobile-20260820.js')
          text = js.read_text()
          old = """function decorate(){if(rendering)return;const root=document.getElementById('view-wellness');if(!root)return;if(!unifiedViewport()){markWellnessReady();return;}rendering=true;try{ensureStyles();closePlayerDetailIfOpen();mainCard(root);if(coach())decorateCoach(root);else if(player())decoratePlayer(root);else markWellnessReady();}finally{rendering=false;}}\nfunction schedule(){clearTimeout(schedule.t);cancelAnimationFrame(schedule.raf||0);schedule.raf=requestAnimationFrame(decorate);}\nfunction install(){ensureStyles();decorate();requestAnimationFrame(decorate);setTimeout(decorate,80);setTimeout(decorate,240);const root=document.getElementById('view-wellness');if(root&&!root.dataset.wellnessUnifiedObserved){root.dataset.wellnessUnifiedObserved='1';let wasActive=root.classList.contains('active');if(!wasActive)markWellnessPending();new MutationObserver(()=>{const active=root.classList.contains('active');if(active!==wasActive){wasActive=active;markWellnessPending();if(active){closePlayerDetailIfOpen();schedule();}return;}if(active)schedule();}).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});}}\n"""
          new = """function decorate(){if(rendering)return;const root=document.getElementById('view-wellness');if(!root)return;if(!unifiedViewport()){markWellnessReady();return;}rendering=true;try{ensureStyles();closePlayerDetailIfOpen();mainCard(root);if(coach())decorateCoach(root);else if(player())decoratePlayer(root);}finally{rendering=false;}}\nfunction hasUnifiedView(root){return !!root?.querySelector(':scope > .wellness-team-quick, :scope > .player-wellness-app');}\nfunction bootUntilRendered(attempt=0){const root=document.getElementById('view-wellness');if(!root||!unifiedViewport())return;decorate();if(hasUnifiedView(root)||attempt>=80)return;clearTimeout(bootUntilRendered.t);bootUntilRendered.t=setTimeout(()=>bootUntilRendered(attempt+1),125);}\nfunction schedule(){clearTimeout(schedule.t);cancelAnimationFrame(schedule.raf||0);schedule.raf=requestAnimationFrame(decorate);}\nfunction install(){ensureStyles();bootUntilRendered();const root=document.getElementById('view-wellness');if(root&&!root.dataset.wellnessUnifiedObserved){root.dataset.wellnessUnifiedObserved='1';let wasActive=root.classList.contains('active');if(!wasActive)markWellnessPending();new MutationObserver(()=>{const active=root.classList.contains('active');if(active!==wasActive){wasActive=active;markWellnessPending();if(active){closePlayerDetailIfOpen();bootUntilRendered();}return;}if(active)schedule();}).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});}}\n"""
          if old not in text:
              raise SystemExit('Expected wellness bootstrap block not found')
          js.write_text(text.replace(old, new))

          cfg = Path('supabase-config.js')
          c = cfg.read_text()
          c = c.replace("window.VOLLEY_ASSET_VERSION = '20260820zi';", "window.VOLLEY_ASSET_VERSION = '20260821a';")
          c = c.replace("wellness-unified-mobile-20260820.js?v=20260820e", "wellness-unified-mobile-20260820.js?v=20260821a")
          cfg.write_text(c)

          idx = Path('index.html')
          h = idx.read_text()
          h = h.replace('supabase-config.js?v=20260820safe50', 'supabase-config.js?v=20260821safe51')
          idx.write_text(h)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wellness-unified-mobile-20260820.js supabase-config.js index.html
          git commit -m "Render unified wellness on initial app load"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/fix-wellness-initial-render-20260821.yml
          git commit -m "Remove one-time wellness initial render workflow"
          git push
