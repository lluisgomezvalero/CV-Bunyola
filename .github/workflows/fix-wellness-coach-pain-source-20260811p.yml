name: Fix wellness coach pain source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-wellness-coach-pain-source-20260811p.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wellness source and cache versions
        shell: python
        run: |
          from pathlib import Path

          app = Path('app-corrections-20260809.js')
          text = app.read_text(encoding='utf-8')

          replacements = [
            (
              "select('id,player_id,entry_date,general_state,fatigue,soreness,stress,sleep,sleep_hours,notes,created_at,updated_at,players(id,legacy_id,profile_id)')",
              "select('id,player_id,entry_date,general_state,fatigue,soreness,stress,sleep,sleep_hours,pain_score,notes,created_at,updated_at,players(id,legacy_id,profile_id)')"
            ),
            (
              "sleepHours:row.sleep_hours==null?null:Number(row.sleep_hours),notes:row.notes||''",
              "sleepHours:row.sleep_hours==null?null:Number(row.sleep_hours),painScore:row.pain_score==null?null:Number(row.pain_score),notes:row.notes||''"
            ),
            (
              '<th>Fecha</th><th>Estado</th><th>Fatiga</th><th>Sueño del día</th><th>Horas</th><th>Notas</th>',
              '<th>Fecha</th><th>Estado</th><th>Fatiga</th><th>Sueño del día</th><th>Dolor</th><th>Notas</th>'
            ),
            (
              "<td>${l.sleepHours??'—'}</td><td>${esc(l.notes||'')}</td>",
              "<td>${l.painScore==null?'—':`${l.painScore}/10`}</td><td>${esc(l.notes||'')}</td>"
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one occurrence, got {count}: {old[:90]}')
            text = text.replace(old, new, 1)

          app.write_text(text, encoding='utf-8')

          cfg = Path('supabase-config.js')
          c = cfg.read_text(encoding='utf-8')
          c = c.replace("window.VOLLEY_ASSET_VERSION = '20260811o';", "window.VOLLEY_ASSET_VERSION = '20260811p';")
          c = c.replace("'app-corrections-20260809.js?v=20260810n'", "'app-corrections-20260809.js?v=20260811p'")
          c = c.replace(",\'wellness-coach-pain-20260811.js?v=20260811o\'", "")
          cfg.write_text(c, encoding='utf-8')

          index = Path('index.html')
          i = index.read_text(encoding='utf-8')
          if i.count('20260811o') < 4:
            raise SystemExit('Root cache version 20260811o not found four times')
          i = i.replace('20260811o', '20260811p')
          index.write_text(i, encoding='utf-8')

          redundant = Path('wellness-coach-pain-20260811.js')
          if redundant.exists():
            redundant.unlink()

          workflow = Path('.github/workflows/fix-wellness-coach-pain-source-20260811p.yml')
          if workflow.exists():
            workflow.unlink()
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix coach wellness pain column at source"
          git push
