name: Publish mobile roster app polish

on:
  push:
    paths:
      - '.github/workflows/roster-mobile-app-cache-bust.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load roster polish and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          needle="  'roster-context-layout-20260813.js?v=20260813g',\n"
          line="  'roster-mobile-app-ux-20260820.js?v=20260820a',\n"
          if line not in s:
              s=s.replace(needle, needle+line)
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260820q'", "window.VOLLEY_ASSET_VERSION = '20260820r'")
          p.write_text(s)
          PY
          sed -i 's/supabase-config.js?v=20260820safe32/supabase-config.js?v=20260820safe33/g' index.html
          rm -f .github/workflows/roster-mobile-app-cache-bust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html .github/workflows/roster-mobile-app-cache-bust.yml
          git commit -m "Publish mobile roster app polish"
          git push
