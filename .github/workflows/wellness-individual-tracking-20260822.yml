name: Wellness individual tracking

on:
  push:
    paths:
      - '.github/workflows/wellness-individual-tracking-20260822.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load individual tracking UI
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path('supabase-config.js')
          s = config.read_text()
          old_version = "window.VOLLEY_ASSET_VERSION = '20260822e';"
          new_version = "window.VOLLEY_ASSET_VERSION = '20260822f';"
          if old_version not in s:
              raise SystemExit('Expected asset version not found')
          s = s.replace(old_version, new_version, 1)
          anchor = "  'app-corrections-20260809.js?v=20260822b',"
          addition = anchor + "\n  'wellness-individual-tracking-20260822.js?v=20260822a',"
          if anchor not in s:
              raise SystemExit('Expected app-corrections anchor not found')
          s = s.replace(anchor, addition, 1)
          config.write_text(s)

          index = Path('index.html')
          s = index.read_text()
          old_cache = 'supabase-config.js?v=20260822safe60'
          new_cache = 'supabase-config.js?v=20260822safe61'
          if old_cache not in s:
              raise SystemExit('Expected index cache key not found')
          index.write_text(s.replace(old_cache, new_cache, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Load individual wellness tracking"
          git push

          git rm .github/workflows/wellness-individual-tracking-20260822.yml
          git commit -m "Remove one-time individual tracking workflow"
          git push
