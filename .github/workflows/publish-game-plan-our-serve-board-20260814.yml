name: Publish mobile our-serve tactical board
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-game-plan-our-serve-board-20260814.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh app cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          for f in ['supabase-config.js','supabase-client.js','data.js','app.js']:
              import re
              s=re.sub(rf'{re.escape(f)}\?v=[A-Za-z0-9._-]+', f+'?v=20260814t', s)
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check game-plan-our-serve-board-20260814.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh cache for our-serve tactical board"
            git push
          fi
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-our-serve-board-20260814.yml
          git commit -m "Remove temporary our-serve publish workflow"
          git push
