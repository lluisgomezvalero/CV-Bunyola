name: Statistics priority UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stats-priority-ux-20260818.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable statistics priority UX
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260817j';", "window.VOLLEY_ASSET_VERSION = '20260818a';")
          marker="  'match-statistics-authoritative-20260817.js?v=20260817j',"
          line="  'match-statistics-priority-ux-20260818.js?v=20260818a',"
          if line not in s:
              if marker not in s: raise SystemExit('match statistics loader marker missing')
              s=s.replace(marker, marker+'\n'+line)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          import re
          s,n=re.subn(r'supabase-config\.js\?v=[A-Za-z0-9_-]+','supabase-config.js?v=20260818a',s)
          if n!=1: raise SystemExit(f'expected one config reference, got {n}')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          set -euo pipefail
          node --check match-statistics-authoritative-20260817.js
          node --check match-statistics-priority-ux-20260818.js
          node --check game-plan-canonical-20260817.js
          grep -F "match-statistics-authoritative-20260817.js?v=20260817j" supabase-config.js
          grep -F "match-statistics-priority-ux-20260818.js?v=20260818a" supabase-config.js
          grep -F "game-plan-canonical-20260817.js?v=20260817g" supabase-config.js
          grep -F "supabase-config.js?v=20260818a" index.html
      - name: Commit change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html match-statistics-priority-ux-20260818.js
          git commit -m "Prioritize key match statistics" || true
          git push
      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git pull --rebase
          git rm .github/workflows/stats-priority-ux-20260818.yml
          git commit -m "Remove temporary statistics UX workflow"
          git push
