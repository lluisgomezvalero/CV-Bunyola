name: Publish player attack tabs
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-player-attack-tabs-20260816.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load player attack tabs and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260816c';", "window.VOLLEY_ASSET_VERSION = '20260816d';")
          old="'game-plan-player-relevance-20260815.js?v=20260815d'];"
          new="'game-plan-player-relevance-20260815.js?v=20260815d','game-plan-player-attack-tabs-20260816.js?v=20260816d'];"
          if old not in s:
              raise SystemExit('Expected patch tail not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text().replace('20260816c','20260816d')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check game-plan-player-attack-tabs-20260816.js
          node --check supabase-config.js
          grep -q "VOLLEY_ASSET_VERSION = '20260816d'" supabase-config.js
          grep -q "game-plan-player-attack-tabs-20260816.js?v=20260816d" supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Publish player attack tabs"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-player-attack-tabs-20260816.yml
          git commit -m "Remove temporary player attack tabs workflow"
          git push
