name: Load wellness individual modal polish

on:
  push:
    paths:
      - '.github/workflows/load-wellness-individual-modal-polish-20260822.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load polish script and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path

          config=Path('supabase-config.js')
          s=config.read_text()
          old="window.VOLLEY_ASSET_VERSION = '20260822g';"
          new="window.VOLLEY_ASSET_VERSION = '20260822h';"
          if old not in s: raise SystemExit('Asset version anchor missing')
          s=s.replace(old,new,1)
          anchor="  'wellness-individual-tracking-20260822.js?v=20260822b',"
          addition=anchor+"\n  'wellness-individual-modal-polish-20260822.js?v=20260822a',"
          if anchor not in s: raise SystemExit('Individual tracking anchor missing')
          s=s.replace(anchor,addition,1)
          config.write_text(s)

          index=Path('index.html')
          s=index.read_text()
          old='supabase-config.js?v=20260822safe62'
          new='supabase-config.js?v=20260822safe63'
          if old not in s: raise SystemExit('Index cache anchor missing')
          index.write_text(s.replace(old,new,1))
          PY

          node --check wellness-individual-modal-polish-20260822.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Load individual wellness modal polish"
          git push
