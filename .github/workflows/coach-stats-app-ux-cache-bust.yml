name: Refresh coach stats app UX

on:
  push:
    paths:
      - '.github/workflows/coach-stats-app-ux-cache-bust.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh coach stats assets
        run: |
          sed -i "s/window.VOLLEY_ASSET_VERSION = '20260819k'/window.VOLLEY_ASSET_VERSION = '20260819l'/g" supabase-config.js
          sed -i "/match-statistics-extended-fields-20260818.js?v=20260818b/a\\  'match-statistics-coach-app-ux-20260819.js?v=20260819a'," supabase-config.js
          sed -i 's/supabase-config.js?v=20260819safe9/supabase-config.js?v=20260819safe10/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          if git diff --cached --quiet; then
            echo "No cache change needed"
          else
            git commit -m "Refresh coach statistics app UX assets"
            git push
          fi
