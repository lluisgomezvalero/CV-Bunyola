name: Publish player wellness summary
on:
  push:
    paths:
      - 'player-wellness-summary-20260813.js'
      - '.github/workflows/publish-player-wellness-summary-20260813.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loader and cache
        run: |
          python - <<'PY'
          from pathlib import Path
          cfg=Path('supabase-config.js')
          text=cfg.read_text()
          text=text.replace("window.VOLLEY_ASSET_VERSION = '20260813d';","window.VOLLEY_ASSET_VERSION = '20260813e';")
          needle="'player-passport-priority-20260813.js?v=20260813d'"
          repl=needle+",'player-wellness-summary-20260813.js?v=20260813e'"
          if 'player-wellness-summary-20260813.js' not in text:
              text=text.replace(needle,repl)
          cfg.write_text(text)
          idx=Path('index.html')
          html=idx.read_text()
          html=html.replace('?v=20260813d','?v=20260813e')
          idx.write_text(html)
          PY
      - name: Validate
        run: |
          node --check player-wellness-summary-20260813.js
          node --check supabase-config.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m 'Publish player wellness summary fix'
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/publish-player-wellness-summary-20260813.yml
          git commit -m 'Remove player wellness summary workflow'
          git push
