name: Publish match callup
on:
  push:
    paths:
      - '.github/workflows/publish-match-callup-20260813.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loader and cache
        run: |
          python - <<'PY'
          from pathlib import Path
          cfg=Path('supabase-config.js')
          s=cfg.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260813n';", "window.VOLLEY_ASSET_VERSION = '20260813o';")
          s=s.replace("'match-attendance-20260813.js?v=20260813l',", "")
          needle="'match-attendance-mobile-opponent-fix-20260813.js?v=20260813n'"
          add="'match-callup-20260813.js?v=20260813o'"
          if add not in s:
              s=s.replace(needle, needle+','+add)
          cfg.write_text(s)
          idx=Path('index.html')
          t=idx.read_text().replace('20260813n','20260813o')
          idx.write_text(t)
          PY
      - name: Validate
        run: |
          node --check match-callup-20260813.js
          node --check supabase-config.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html match-callup-20260813.js
          git diff --cached --quiet || git commit -m "Enable match callups and retire match attendance"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-match-callup-20260813.yml
          git commit -m "Remove match callup publish workflow"
          git push
