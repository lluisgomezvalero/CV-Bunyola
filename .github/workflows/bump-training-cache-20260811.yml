name: Bump training cache
on:
  push:
    paths:
      - '.github/workflows/bump-training-cache-20260811.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump root assets
        run: sed -i 's/20260811p/20260811q/g' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bump-training-cache-20260811.yml
          git add index.html
          git diff --cached --check
          git commit -m 'chore: refresh training architecture assets'
          git push
