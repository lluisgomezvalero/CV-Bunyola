name: Cleanup player game plan layers
on:
  push:
    paths:
      - '.github/workflows/cleanup-player-game-plan-20260816.yml'
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Simplify player plan runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          cfg = Path('supabase-config.js')
          text = cfg.read_text()
          old_serve = "'game-plan-player-our-serve-view-20260815.js?v=20260815a',"
          if old_serve not in text:
              raise SystemExit('legacy player serve loader entry not found')
          text = text.replace(old_serve, '', 1)
          text = text.replace(
              "game-plan-player-attack-authoritative-20260816.js?v=20260816j",
              "game-plan-player-attack-authoritative-20260816.js?v=20260816m",
              1,
          )
          text = re.sub(r"window\.VOLLEY_ASSET_VERSION = '[^']+';", "window.VOLLEY_ASSET_VERSION = '20260816m';", text, count=1)
          cfg.write_text(text)

          idx = Path('index.html')
          html = idx.read_text()
          old_css = '  <link rel="stylesheet" href="game-plan-player-attack-safe-20260816.css?v=20260816g">\n'
          new_css = '  <link rel="stylesheet" href="game-plan-player-serve-20260816.css?v=20260816m">\n'
          if old_css not in html:
              raise SystemExit('legacy player attack css link not found')
          html = html.replace(old_css, new_css, 1)
          for name in ['supabase-config.js','supabase-client.js','data.js','app.js']:
              html = re.sub(re.escape(name) + r'\?v=[^"\']+', name + '?v=20260816m', html)
          idx.write_text(html)

          attack = Path('game-plan-player-attack-authoritative-20260816.js')
          js = attack.read_text()
          start = js.find('  // Comprobación de recuperación muy ligera:')
          end_marker = "  },1100);\n"
          if start < 0:
              raise SystemExit('player attack recovery polling block not found')
          end = js.find(end_marker, start)
          if end < 0:
              raise SystemExit('player attack recovery polling end not found')
          js = js[:start] + js[end + len(end_marker):]
          attack.write_text(js)
          PY
          git rm game-plan-player-our-serve-view-20260815.js
          git rm game-plan-player-attack-safe-20260816.css
      - name: Validate simplified player plan
        run: |
          node --check game-plan-player-attack-authoritative-20260816.js
          node --check game-plan-player-preview-bridge-20260815.js
          node --check supabase-config.js
          grep -q "VOLLEY_ASSET_VERSION = '20260816m'" supabase-config.js
          grep -q "game-plan-player-attack-authoritative-20260816.js?v=20260816m" supabase-config.js
          ! grep -q "game-plan-player-our-serve-view-20260815.js" supabase-config.js
          ! grep -q "setInterval.*1100" game-plan-player-attack-authoritative-20260816.js
          grep -q "game-plan-player-serve-20260816.css?v=20260816m" index.html
          ! grep -q "game-plan-player-attack-safe-20260816.css" index.html
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Simplify player game plan runtime"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/cleanup-player-game-plan-20260816.yml
          git commit -m "Remove temporary player game plan cleanup workflow"
          git push
