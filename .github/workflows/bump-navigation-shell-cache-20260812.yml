name: Bump navigation shell cache
on:
  push:
    paths:
      - '.github/workflows/bump-navigation-shell-cache-20260812.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump root assets and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if '20260812a' not in text:
              raise SystemExit('Expected cache token 20260812a in index.html')
          path.write_text(text.replace('20260812a', '20260812b'), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/bump-navigation-shell-cache-20260812.yml
          git commit -m "chore: publish navigation shell 20260812b"
          git push
