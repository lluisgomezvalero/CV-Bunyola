name: Bump root cache 20260811l
on:
  push:
    paths:
      - '.github/workflows/bump-root-cache-l.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Update root cache and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for name in ('supabase-config.js','supabase-client.js','data.js','app.js'):
              import re
              s=re.sub(rf'{re.escape(name)}\?v=[^"\']+', f'{name}?v=20260811l', s)
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/bump-root-cache-l.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/bump-root-cache-l.yml
          git commit -m "Bump root cache to 20260811l"
          git push
