name: Cache bust player stats safe2

on:
  push:
    paths:
      - '.github/workflows/cache-bust-player-stats-safe2.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh app config URL
        run: |
          sed -i 's/supabase-config.js?v=20260819safe1/supabase-config.js?v=20260819safe2/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No cache key change needed"
          else
            git commit -m "Load safe player stats scroll fix"
            git push
          fi
