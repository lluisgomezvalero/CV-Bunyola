name: Wellness clarity refresh
on:
  push:
    paths:
      - '.github/workflows/wellness-clarity-refresh-20260820.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate wellness clarity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260820z';", "window.VOLLEY_ASSET_VERSION = '20260820za';")
          marker="  'wellness-mobile-app-ux-20260820.js?v=20260820a',"
          addition="  'wellness-coach-clarity-20260820.js?v=20260820a',"
          if addition not in s:
              s=s.replace(marker, marker+'\n'+addition)
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text().replace('supabase-config.js?v=20260820safe41','supabase-config.js?v=20260820safe42')
          p.write_text(s)
          PY
      - name: Commit refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m 'Publish clearer wellness coach view'
          git push
