name: Publish compact coach game plan UX
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-coach-compact-20260814.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh page cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('supabase-config.js?v=20260814k','supabase-config.js?v=20260814l')
          s=s.replace('supabase-client.js?v=20260814k','supabase-client.js?v=20260814l')
          s=s.replace('data.js?v=20260814k','data.js?v=20260814l')
          s=s.replace('app.js?v=20260814k','app.js?v=20260814l')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check game-plan-coach-top-compact-20260814.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish compact coach game plan UX"
            git push
          fi
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-coach-compact-20260814.yml
          git commit -m "Remove temporary compact game plan workflow"
          git push
