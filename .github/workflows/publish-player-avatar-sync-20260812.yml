name: Publish player avatar sync
on:
  push:
    paths:
      - '.github/workflows/publish-player-avatar-sync-20260812.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate avatar sync
        run: |
          node --check player-avatar-authoritative-20260812.js
          grep -q "player-avatar-authoritative-20260812.js?v=20260812s" supabase-config.js
          grep -q "VOLLEY_ASSET_VERSION = '20260812s'" supabase-config.js
      - name: Bump page assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text()
          if '20260812r' not in text:
              raise SystemExit('Expected 20260812r cache token not found in index.html')
          p.write_text(text.replace('20260812r','20260812s'))
          PY
          grep -q "supabase-config.js?v=20260812s" index.html
      - name: Commit validated publish
        run: |
          rm .github/workflows/publish-player-avatar-sync-20260812.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/publish-player-avatar-sync-20260812.yml
          git commit -m "Publish synchronized player avatars"
          git push
