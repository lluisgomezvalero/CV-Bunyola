name: Unified wellness refresh
on:
  push:
    paths:
      - '.github/workflows/wellness-unified-refresh-20260820.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate unified wellness view
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260820zb';", "window.VOLLEY_ASSET_VERSION = '20260820zc';")
          s=s.replace("  'wellness-mobile-app-ux-20260820.js?v=20260820a',\n", "")
          s=s.replace("  'wellness-coach-clarity-20260820.js?v=20260820b',\n", "")
          marker="  'wellness-v2-20260811.js?v=20260811n',"
          addition="  'wellness-unified-mobile-20260820.js?v=20260820a',"
          if addition not in s:
              s=s.replace(marker, marker+'\n'+addition)
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text().replace('supabase-config.js?v=20260820safe43','supabase-config.js?v=20260820safe44')
          p.write_text(s)
          PY
      - name: Commit refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m 'Publish unified wellness mobile view'
          git push
