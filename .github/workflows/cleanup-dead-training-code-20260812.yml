name: Cleanup dead training code

on:
  push:
    paths:
      - '.github/workflows/cleanup-dead-training-code-20260812.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove dead training and duplicate RPE code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def remove_function(src, name, async_ok=True):
              patterns = [f'function {name}(']
              if async_ok:
                  patterns.insert(0, f'async function {name}(')
              positions = [(src.find(p), p) for p in patterns if src.find(p) >= 0]
              if not positions:
                  raise SystemExit(f'Function not found: {name}')
              start, token = min(positions, key=lambda x: x[0])
              brace = src.find('{', start + len(token))
              if brace < 0:
                  raise SystemExit(f'Opening brace not found: {name}')
              i = brace
              depth = 0
              state = 'code'
              quote = None
              while i < len(src):
                  ch = src[i]
                  nxt = src[i+1] if i+1 < len(src) else ''
                  if state == 'code':
                      if ch in ('\'', '"', '`'):
                          state = 'string'; quote = ch
                      elif ch == '/' and nxt == '/':
                          state = 'line_comment'; i += 1
                      elif ch == '/' and nxt == '*':
                          state = 'block_comment'; i += 1
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              while end < len(src) and src[end] in ' \t':
                                  end += 1
                              if end < len(src) and src[end] == ';':
                                  end += 1
                              while end < len(src) and src[end] in '\r\n':
                                  end += 1
                              return src[:start] + src[end:]
                  elif state == 'string':
                      if ch == '\\':
                          i += 1
                      elif ch == quote:
                          state = 'code'; quote = None
                  elif state == 'line_comment':
                      if ch == '\n': state = 'code'
                  elif state == 'block_comment':
                      if ch == '*' and nxt == '/':
                          state = 'code'; i += 1
                  i += 1
              raise SystemExit(f'Closing brace not found: {name}')

          app = Path('app.js')
          js = app.read_text(encoding='utf-8')

          # Canonical training UI no longer calls these legacy renderers.
          for fn in ['renderTrainingCard','renderTrainingHistory','toggleTrainingHistoryDetail','getSessionWellnessSnapshot','addPlayerRpeByCoach']:
              js = remove_function(js, fn)

          js, n = re.subn(r'\n?window\.toggleTrainingHistoryDetail\s*=\s*toggleTrainingHistoryDetail;\s*', '\n', js, count=1)
          if n != 1: raise SystemExit(f'toggle export replacements={n}')
          js, n = re.subn(r'\n?window\.addPlayerRpeByCoach\s*=\s*addPlayerRpeByCoach;\s*', '\n', js, count=1)
          if n != 1: raise SystemExit(f'legacy addPlayer export replacements={n}')

          # The old coach-attendance view was removed; these refreshes are unreachable work.
          js, n1 = re.subn(r'\s*try \{ renderCoachAttendanceList\(\); \} catch \(_\) \{\}', '', js, count=1)
          js, n2 = re.subn(r'\s*else if \(activeViewId === "view-coach-attendance"\) renderCoachAttendanceList\(\);', '', js, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'dead coach refresh replacements={n1},{n2}')

          app.write_text(js, encoding='utf-8')

          corr = Path('app-corrections-20260809.js')
          cjs = corr.read_text(encoding='utf-8')
          cjs = cjs.replace('  let rpeSyncBusy = false;\n', '', 1)
          for fn in ['syncRpe','saveRpe','saveManualPlayerRpe']:
              cjs = remove_function(cjs, fn)

          start = cjs.find('    const baseSetRpe=window.setTrainingRPE;')
          end = cjs.find('    const baseSessionRender=window.renderSessionCenterDetail;', start)
          if start < 0 or end < 0:
              raise SystemExit('Duplicate RPE wrapper block boundaries not found')
          cjs = cjs[:start] + cjs[end:]

          old_open = "window.openSessionCenter=function(eventId,returnTarget){const r=baseOpenSession.call(this,eventId,returnTarget);Promise.all([syncRpe(),hydrateSessionFeedback(eventId)]).then(()=>window.renderSessionCenterDetail());return r;};"
          new_open = "window.openSessionCenter=function(eventId,returnTarget){const r=baseOpenSession.call(this,eventId,returnTarget);Promise.resolve(hydrateSessionFeedback(eventId)).then(()=>window.renderSessionCenterDetail());return r;};"
          if old_open not in cjs: raise SystemExit('Session hydrate wrapper not found')
          cjs = cjs.replace(old_open, new_open, 1)

          old_boot = "    syncRpe().then(()=>{try{renderTraining();}catch(_){}});syncWellness().then(()=>{try{if(document.getElementById('view-wellness')?.classList.contains('active'))window.renderWellness();}catch(_){}});"
          new_boot = "    syncWellness().then(()=>{try{if(document.getElementById('view-wellness')?.classList.contains('active'))window.renderWellness();}catch(_){}});"
          if old_boot not in cjs: raise SystemExit('Duplicate RPE boot sync not found')
          cjs = cjs.replace(old_boot, new_boot, 1)
          cjs = cjs.replace("console.info('[AppCorrections] Correcciones de sesión, RPE, bienestar, carga y lectura del plan activadas.');", "console.info('[AppCorrections] Correcciones de sesión, bienestar, carga y lectura del plan activadas.');", 1)
          corr.write_text(cjs, encoding='utf-8')

          cfg = Path('supabase-config.js')
          cfg_text = cfg.read_text(encoding='utf-8')
          if "window.VOLLEY_ASSET_VERSION = '20260812i';" not in cfg_text:
              raise SystemExit('Expected cache i not found')
          cfg_text = cfg_text.replace("window.VOLLEY_ASSET_VERSION = '20260812i';", "window.VOLLEY_ASSET_VERSION = '20260812j';", 1)
          if 'app-corrections-20260809.js?v=20260811p' not in cfg_text:
              raise SystemExit('app-corrections cache token not found')
          cfg_text = cfg_text.replace('app-corrections-20260809.js?v=20260811p', 'app-corrections-20260809.js?v=20260812j', 1)
          cfg.write_text(cfg_text, encoding='utf-8')

          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          for name in ['styles.css','supabase-config.js','supabase-client.js','data.js','app.js']:
              html = html.replace(f'{name}?v=20260812i', f'{name}?v=20260812j')
          idx.write_text(html, encoding='utf-8')
          PY

      - name: Validate canonical training architecture
        run: |
          node --check app.js
          node --check app-corrections-20260809.js
          node --check rpe-authoritative-20260810.js
          ! grep -q "function renderTrainingCard" app.js
          ! grep -q "function renderTrainingHistory" app.js
          ! grep -q "function toggleTrainingHistoryDetail" app.js
          ! grep -q "function getSessionWellnessSnapshot" app.js
          ! grep -q "function addPlayerRpeByCoach" app.js
          ! grep -q "async function syncRpe" app-corrections-20260809.js
          ! grep -q "baseSetRpe=window.setTrainingRPE" app-corrections-20260809.js
          grep -q "function renderNextTrainingSession" app.js
          grep -q "function renderCompletedTrainingSessions" app.js
          grep -q "function renderSessionCenterDetail" app.js
          grep -q "window.addPlayerRpeByCoach=saveForPlayer" rpe-authoritative-20260810.js
          grep -q "playerWindowOpen" rpe-authoritative-20260810.js
          ! grep -q 'id="view-coach-attendance"' index.html
          grep -q "VOLLEY_ASSET_VERSION = '20260812j'" supabase-config.js
          grep -q "app.js?v=20260812j" index.html

      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-dead-training-code-20260812.yml
          git add app.js app-corrections-20260809.js supabase-config.js index.html
          git commit -m "Remove dead training and duplicate RPE code"
          git push
