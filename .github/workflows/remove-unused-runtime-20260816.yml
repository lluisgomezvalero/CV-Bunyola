name: Remove unused runtime files
on:
  push:
    paths:
      - '.github/workflows/remove-unused-runtime-20260816.yml'
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove confirmed unreferenced files
        run: |
          git rm app.original_before_auth_fix.js
          git rm attendance-batch-save-20260809.js
          git rm reset-training-state-20260809.js
          git rm roll-call-status-ui-20260809.js
          git rm rpe-pending-ui-20260810.js
      - name: Confirm runtime references remain clean
        run: |
          node --check app.js
          node --check supabase-config.js
          test ! -e app.original_before_auth_fix.js
          test ! -e attendance-batch-save-20260809.js
          test ! -e reset-training-state-20260809.js
          test ! -e roll-call-status-ui-20260809.js
          test ! -e rpe-pending-ui-20260810.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove unused legacy runtime files"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/remove-unused-runtime-20260816.yml
          git commit -m "Remove temporary unused runtime cleanup workflow"
          git push
