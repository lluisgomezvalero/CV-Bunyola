name: Publish match opponent persistence fix

on:
  push:
    paths:
      - '.github/workflows/publish-match-opponent-persistence-20260814.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh app cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260814n';","window.VOLLEY_ASSET_VERSION = '20260814o';")
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          for name in ['supabase-config.js','supabase-client.js','data.js','app.js']:
              s=s.replace(f'{name}?v=20260814n',f'{name}?v=20260814o')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check match-opponent-persistence-20260814.js
          node --check game-plan-opponent-hero-fix-20260814.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish opponent persistence fix"
            git push
          fi
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-match-opponent-persistence-20260814.yml
          git commit -m "Remove temporary opponent persistence workflow"
          git push
