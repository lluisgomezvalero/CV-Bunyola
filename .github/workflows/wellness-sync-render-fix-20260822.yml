name: Wellness sync render fix

on:
  push:
    paths:
      - '.github/workflows/wellness-sync-render-fix-20260822.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch delayed wellness rerender
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app-corrections-20260809.js')
          s = p.read_text()
          old = "window.renderWellness=function(){const r=baseWellness.apply(this,arguments);removeCoachSleepAverageColumn();renderCoachWellnessInspector();if(!wellnessSyncBusy)syncWellness().then(()=>{baseWellness();removeCoachSleepAverageColumn();renderCoachWellnessInspector();});return r;};"
          new = "window.renderWellness=function(){const r=baseWellness.apply(this,arguments);removeCoachSleepAverageColumn();renderCoachWellnessInspector();if(!wellnessSyncBusy)syncWellness().then(()=>{if(!document.getElementById('view-wellness')?.classList.contains('active'))return;try{typeof renderBorgMatrix==='function'&&renderBorgMatrix();}catch(_){}removeCoachSleepAverageColumn();renderCoachWellnessInspector();requestAnimationFrame(()=>{try{typeof window.renderWellnessCharts==='function'&&window.renderWellnessCharts();}catch(e){console.warn('[Corrections] wellness chart refresh',e);}});});return r;};"
          if old not in s:
              raise SystemExit('Expected wellness wrapper not found; refusing to patch')
          p.write_text(s.replace(old, new, 1))
          PY
          sed -i "s/window.VOLLEY_ASSET_VERSION = '20260822a'/window.VOLLEY_ASSET_VERSION = '20260822b'/g" supabase-config.js
          sed -i 's/app-corrections-20260809.js?v=20260812j/app-corrections-20260809.js?v=20260822a/g' supabase-config.js
          sed -i 's/supabase-config.js?v=20260822safe56/supabase-config.js?v=20260822safe57/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-corrections-20260809.js supabase-config.js index.html
          git commit -m "Avoid delayed full wellness rerender after sync"
          git push
