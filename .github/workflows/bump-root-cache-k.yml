name: Bump root cache to 20260811k
on:
  push:
    paths:
      - '.github/workflows/bump-root-cache-k.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update root asset version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('supabase-config.js?v=20260811j','supabase-config.js?v=20260811k')
          s=s.replace('supabase-client.js?v=20260811j','supabase-client.js?v=20260811k')
          s=s.replace('data.js?v=20260811j','data.js?v=20260811k')
          s=s.replace('app.js?v=20260811j','app.js?v=20260811k')
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/bump-root-cache-k.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/bump-root-cache-k.yml
          git commit -m 'Bump root cache to 20260811k'
          git push