name: Apply wellness chart compositing fix

on:
  push:
    paths:
      - '.github/workflows/wellness-chart-compositing-cache-20260821.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump wellness chart assets
        run: |
          sed -i "s/window.VOLLEY_ASSET_VERSION = '20260821c'/window.VOLLEY_ASSET_VERSION = '20260821d'/" supabase-config.js
          sed -i 's/wellness-chart-stability-20260821.js?v=20260821a/wellness-chart-stability-20260821.js?v=20260821b/' supabase-config.js
          sed -i 's/supabase-config.js?v=20260821safe53/supabase-config.js?v=20260821safe54/' index.html
          rm .github/workflows/wellness-chart-compositing-cache-20260821.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html supabase-config.js .github/workflows/wellness-chart-compositing-cache-20260821.yml
          git commit -m "Force fresh wellness chart compositing fix"
          git push
