name: Publish stable game plan action bar

on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-action-bar-20260816.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Load authoritative action bar and refresh cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cfg = Path('supabase-config.js')
          s = cfg.read_text()
          s = re.sub(r"window\.VOLLEY_ASSET_VERSION = '[^']+';", "window.VOLLEY_ASSET_VERSION = '20260816a';", s, count=1)
          new_script = "'game-plan-action-bar-authoritative-20260816.js?v=20260816a'"
          if new_script not in s:
              anchor = "'game-plan-player-relevance-20260815.js?v=20260815d'"
              if anchor not in s:
                  raise SystemExit('Could not find game-plan patch tail anchor')
              s = s.replace(anchor, anchor + ',' + new_script, 1)
          cfg.write_text(s)

          idx = Path('index.html')
          html = idx.read_text()
          for filename in ['supabase-config.js','supabase-client.js','data.js','app.js']:
              html = re.sub(rf"({re.escape(filename)}\?v=)[^\"']+", rf"\g<1>20260816a", html)
          idx.write_text(html)
          PY

      - name: Validate JavaScript
        run: |
          node --check game-plan-action-bar-authoritative-20260816.js
          node --check supabase-config.js

      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Publish stable game plan action bar"
          git push origin main

      - name: Remove workflow
        run: |
          git pull --rebase origin main
          git rm .github/workflows/publish-game-plan-action-bar-20260816.yml
          git commit -m "Remove temporary game plan action bar workflow"
          git push origin main
