name: Publish live attack preview
on:
  push:
    paths:
      - '.github/workflows/publish-live-attack-preview-20260816.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump runtime cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          cfg=Path('supabase-config.js')
          text=cfg.read_text()
          text=re.sub(r"window\.VOLLEY_ASSET_VERSION = '20260816[a-z]';", "window.VOLLEY_ASSET_VERSION = '20260816r';", text)
          text=re.sub(r"game-plan-attack-live-draft-20260816\.js\?v=20260816[a-z]", "game-plan-attack-live-draft-20260816.js?v=20260816r", text)
          cfg.write_text(text)
          idx=Path('index.html')
          html=idx.read_text()
          html=re.sub(r"supabase-config\.js\?v=20260816[a-z]", "supabase-config.js?v=20260816r", html)
          idx.write_text(html)
          PY
      - name: Validate
        run: |
          node --check game-plan-attack-live-draft-20260816.js
          node --check game-plan-coach-attack-tabs-20260816.js
          grep -q "game-plan-coach-attack-tabs-20260816.js?v=20260816q" supabase-config.js
          grep -q "game-plan-attack-live-draft-20260816.js?v=20260816r" supabase-config.js
          grep -q "supabase-config.js?v=20260816r" index.html
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Publish live attack court preview"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-live-attack-preview-20260816.yml
          git commit -m "Remove temporary live attack preview workflow"
          git push
