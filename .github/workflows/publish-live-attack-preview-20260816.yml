name: Publish live attack preview
on:
  push:
    paths:
      - '.github/workflows/publish-live-attack-preview-20260816.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump runtime cache
        run: |
          python - <<'PY'
          from pathlib import Path
          cfg=Path('supabase-config.js')
          text=cfg.read_text()
          text=text.replace("window.VOLLEY_ASSET_VERSION = '20260816q';", "window.VOLLEY_ASSET_VERSION = '20260816r';")
          text=text.replace("'game-plan-attack-live-draft-20260816.js?v=20260816e'", "'game-plan-attack-live-draft-20260816.js?v=20260816r'")
          cfg.write_text(text)
          idx=Path('index.html')
          html=idx.read_text()
          html=html.replace('supabase-config.js?v=20260816p','supabase-config.js?v=20260816r')
          idx.write_text(html)
          PY
      - name: Validate
        run: |
          node --check game-plan-attack-live-draft-20260816.js
          node --check game-plan-coach-attack-tabs-20260816.js
          grep -q "game-plan-coach-attack-tabs-20260816.js?v=20260816q" supabase-config.js
          ! grep -q "game-plan-attack-tabs-20260814.js" supabase-config.js
          ! grep -q "game-plan-coach-attack-tabs-final-20260816.js" supabase-config.js
          grep -q "game-plan-attack-live-draft-20260816.js?v=20260816r" supabase-config.js
          grep -q "supabase-config.js?v=20260816r" index.html
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Publish live attack court preview"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-live-attack-preview-20260816.yml
          git commit -m "Remove temporary live attack preview workflow"
          git push
