name: Clean dead training control refreshes

on:
  push:
    paths:
      - '.github/workflows/cleanup-dead-training-control-refreshes.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove dead renderer calls
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_checked(path, old, new='', count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrences, found {found}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace_checked('attendance-authoritative-20260809.js', "if(includeCoachList||activeViewId==='view-coach-attendance')call('renderCoachAttendanceList');")
          replace_checked('roll-call-effective-minutes-20260811.js', "    try{renderCoachAttendanceList();}catch(_){}\n")
          replace_checked('attendance-late-count-20260811.js', "  try{if(typeof renderCoachAttendanceList==='function')renderCoachAttendanceList();}catch(_){}\n")
          replace_checked('supabase-event-recovery.js', "        else if(activeViewId==='view-coach-attendance')renderCoachAttendanceList();\n")
          replace_checked('supabase-roster-sync.js', "      try{renderCoachAttendanceList()}catch(_){}\n")
          replace_checked('coach-training-windows-20260810.js', "  try { if(typeof renderCoachAttendanceList==='function') renderCoachAttendanceList(); } catch(_){}\n")

          p = Path('coach-dashboard-compact-summary-20260810.js')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'\nfunction teamAttendance\(\)\{.*?\n\}\n\n(?=function compactHomeSummary)', '\n', text, count=1, flags=re.S)
          text = re.sub(r'\nfunction addAttendanceToTrainingControl\(\)\{.*?\n\}\n\n(?=function injectCss)', '\n', text, count=1, flags=re.S)
          text = text.replace('  const attendanceBase=window.renderCoachAttendanceList;\n', '', 1)
          text = text.replace("  if(typeof homeBase!=='function'||typeof attendanceBase!=='function'){", "  if(typeof homeBase!=='function'){")
          text = re.sub(r'\n  const attendanceWrapped=function\(\)\{.*?\n  \};', '', text, count=1, flags=re.S)
          text = text.replace('  window.renderCoachAttendanceList=attendanceWrapped;\n', '', 1)
          text = text.replace('  try { attendanceWrapped(); } catch(_){}\n', '', 1)
          if 'attendanceBase' in text or 'attendanceWrapped' in text or 'addAttendanceToTrainingControl' in text:
              raise SystemExit('coach-dashboard-compact-summary: legacy attendance wrapper remains')
          p.write_text(text, encoding='utf-8')

          cfg = Path('supabase-config.js')
          c = cfg.read_text(encoding='utf-8')
          old_global = "window.VOLLEY_ASSET_VERSION = '20260812e';"
          if old_global not in c:
              raise SystemExit('Expected global cache 20260812e not found')
          c = c.replace(old_global, "window.VOLLEY_ASSET_VERSION = '20260812f';", 1)
          replacements = {
              'supabase-event-recovery.js?v=20260812d': 'supabase-event-recovery.js?v=20260812f',
              'supabase-roster-sync.js?v=20260810n': 'supabase-roster-sync.js?v=20260812f',
              'attendance-authoritative-20260809.js?v=20260812d': 'attendance-authoritative-20260809.js?v=20260812f',
              'roll-call-effective-minutes-20260811.js?v=20260811c': 'roll-call-effective-minutes-20260811.js?v=20260812f',
              'attendance-late-count-20260811.js?v=20260811e': 'attendance-late-count-20260811.js?v=20260812f',
              'coach-training-windows-20260810.js?v=20260811h': 'coach-training-windows-20260810.js?v=20260812f',
              'coach-dashboard-compact-summary-20260810.js?v=20260811e': 'coach-dashboard-compact-summary-20260810.js?v=20260812f',
          }
          for old, new in replacements.items():
              if old not in c:
                  raise SystemExit(f'supabase-config token not found: {old}')
              c = c.replace(old, new, 1)
          cfg.write_text(c, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          for name in ['styles.css','supabase-config.js','supabase-client.js','data.js','app.js']:
              old = f'{name}?v=20260812e'
              if old not in h:
                  raise SystemExit(f'index cache token not found: {old}')
              h = h.replace(old, f'{name}?v=20260812f', 1)
          index.write_text(h, encoding='utf-8')
          PY

      - name: Validate changed JavaScript
        run: |
          node --check attendance-authoritative-20260809.js
          node --check roll-call-effective-minutes-20260811.js
          node --check attendance-late-count-20260811.js
          node --check supabase-event-recovery.js
          node --check supabase-roster-sync.js
          node --check coach-training-windows-20260810.js
          node --check coach-dashboard-compact-summary-20260810.js
          grep -q "VOLLEY_ASSET_VERSION = '20260812f'" supabase-config.js
          grep -q "app.js?v=20260812f" index.html

      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-dead-training-control-refreshes.yml
          git add attendance-authoritative-20260809.js roll-call-effective-minutes-20260811.js attendance-late-count-20260811.js supabase-event-recovery.js supabase-roster-sync.js coach-training-windows-20260810.js coach-dashboard-compact-summary-20260810.js supabase-config.js index.html
          git commit -m "Remove dead training control refreshes"
          git push
