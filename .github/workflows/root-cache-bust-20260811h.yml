name: root-cache-bust-20260811h
on:
  push:
    paths:
      - '.github/workflows/root-cache-bust-20260811h.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump root asset query
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='?v=20260811g'
          new='?v=20260811h'
          targets=['supabase-config.js','supabase-client.js','data.js','app.js']
          for t in targets:
              a=f'{t}{old}'
              b=f'{t}{new}'
              if a not in s:
                  raise SystemExit(f'Missing expected root cache target: {a}')
              s=s.replace(a,b,1)
          p.write_text(s)
          PY
          rm .github/workflows/root-cache-bust-20260811h.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/root-cache-bust-20260811h.yml
          git commit -m 'Bump root cache to 20260811h'
          git push origin main
