name: Publish safe game plan save
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-safe-save-20260816.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add safe save and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          cfg=Path('supabase-config.js')
          text=cfg.read_text()
          if 'game-plan-safe-save-20260816.js' not in text:
              marker="'game-plan-attack-live-draft-20260816.js?v=20260816e'"
              if marker not in text:
                  raise SystemExit('attack live draft marker not found')
              text=text.replace(marker, marker+",'game-plan-safe-save-20260816.js?v=20260816h'")
          else:
              text=re.sub(r"game-plan-safe-save-20260816\.js\?v=[^']+","game-plan-safe-save-20260816.js?v=20260816h",text)
          text=re.sub(r"window\.VOLLEY_ASSET_VERSION = '[^']+';","window.VOLLEY_ASSET_VERSION = '20260816h';",text,count=1)
          cfg.write_text(text)

          idx=Path('index.html')
          html=idx.read_text()
          for name in ['supabase-config.js','supabase-client.js','data.js','app.js']:
              html=re.sub(rf'{re.escape(name)}\?v=[^\"\']+',f'{name}?v=20260816h',html)
          idx.write_text(html)
          PY
      - name: Validate JavaScript and load order
        run: |
          node --check game-plan-safe-save-20260816.js
          node --check supabase-config.js
          grep -q "VOLLEY_ASSET_VERSION = '20260816h'" supabase-config.js
          grep -q "game-plan-safe-save-20260816.js?v=20260816h" supabase-config.js
          python - <<'PY'
          from pathlib import Path
          text=Path('supabase-config.js').read_text()
          assert text.rfind('game-plan-safe-save-20260816.js') > text.rfind('game-plan-attack-live-draft-20260816.js')
          PY
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Publish non-destructive game plan save 20260816h"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-safe-save-20260816.yml
          git commit -m "Remove temporary safe game plan save workflow"
          git push
