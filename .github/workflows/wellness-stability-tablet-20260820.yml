name: Wellness stability and tablet refresh
on:
  push:
    paths:
      - '.github/workflows/wellness-stability-tablet-20260820.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stabilize unified wellness and tablet view
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('wellness-unified-mobile-20260820.js')
          s=p.read_text()

          s=s.replace('@media(max-width:760px){', '@media(max-width:760px), (max-width:1366px) and (any-pointer:coarse){', 1)

          marker="function mean(values){const v=values.filter(Number.isFinite);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}"
          add="""function mean(values){const v=values.filter(Number.isFinite);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}\nfunction unifiedViewport(){try{return window.matchMedia('(max-width:760px), (max-width:1366px) and (any-pointer:coarse)').matches;}catch(_){return window.innerWidth<=1366;}}\nfunction markWellnessPending(){document.documentElement.classList.remove('wellness-unified-ready');}\nfunction markWellnessReady(){document.documentElement.classList.add('wellness-unified-ready');}\nfunction closePlayerDetailIfOpen(){const modal=document.getElementById('modal-player-detail');if(!modal?.classList.contains('active'))return;const close=modal.querySelector('.modal-close,.modal-close-btn,[data-action=close]');if(close){try{close.click();return;}catch(_){}}modal.classList.remove('active');document.body.classList.remove('modal-open','profile-modal-open','player-detail-modal-open');}"""
          if marker not in s:
              raise SystemExit('mean marker not found')
          s=s.replace(marker,add,1)

          old="function decorateCoach(root){root.classList.add('wellness-role-coach');root.classList.remove('wellness-role-player');root.querySelector('.player-wellness-app')?.remove();const card=mainCard(root);if(!card)return;const t=root.querySelector('#wellness-chart-title');if(t)t.textContent='Bienestar del equipo';const p=root.querySelector('#wellness-chart-description');if(p)p.textContent='Fatiga media semanal del equipo y registros individuales de las jugadoras.';root.querySelector('#borg-legend-inline')?.setAttribute('hidden','');chartSection(root,card);ensureWeeklyToggle(root,card);ensureCoachQuick(root,card);ensureRpeCard(root,card);decorateInspector(root);polishChart(root);}"
          new="function decorateCoach(root){root.classList.add('wellness-role-coach');root.classList.remove('wellness-role-player');root.querySelector('.player-wellness-app')?.remove();const card=mainCard(root);if(!card)return;const t=root.querySelector('#wellness-chart-title');if(t)t.textContent='Bienestar del equipo';const p=root.querySelector('#wellness-chart-description');if(p)p.textContent='Fatiga media semanal del equipo y registros individuales de las jugadoras.';root.querySelector('#borg-legend-inline')?.setAttribute('hidden','');chartSection(root,card);ensureWeeklyToggle(root,card);ensureCoachQuick(root,card);ensureRpeCard(root,card);decorateInspector(root);polishChart(root);setTimeout(()=>polishChart(root),90);setTimeout(()=>polishChart(root),240);markWellnessReady();}"
          if old not in s:
              raise SystemExit('decorateCoach marker not found')
          s=s.replace(old,new,1)

          old2="function decoratePlayer(root){root.classList.add('wellness-role-player');root.classList.remove('wellness-role-coach');root.querySelector('.wellness-team-quick')?.remove();"
          new2="function decoratePlayer(root){root.classList.add('wellness-role-player');root.classList.remove('wellness-role-coach');root.querySelector('.wellness-team-quick')?.remove();"
          if old2 not in s:
              raise SystemExit('decoratePlayer start marker not found')

          old3="try{window.lucide?.createIcons?.();}catch(_){}void refreshPlayerLoad(root);}"
          new3="try{window.lucide?.createIcons?.();}catch(_){}void refreshPlayerLoad(root);markWellnessReady();}"
          if old3 not in s:
              raise SystemExit('decoratePlayer end marker not found')
          s=s.replace(old3,new3,1)

          old4="function decorate(){if(rendering)return;const root=document.getElementById('view-wellness');if(!root)return;rendering=true;try{ensureStyles();mainCard(root);if(coach())decorateCoach(root);else if(player())decoratePlayer(root);}finally{rendering=false;}}"
          new4="function decorate(){if(rendering)return;const root=document.getElementById('view-wellness');if(!root)return;if(!unifiedViewport()){markWellnessReady();return;}rendering=true;try{ensureStyles();closePlayerDetailIfOpen();mainCard(root);if(coach())decorateCoach(root);else if(player())decoratePlayer(root);}finally{rendering=false;}}"
          if old4 not in s:
              raise SystemExit('decorate marker not found')
          s=s.replace(old4,new4,1)

          old5="function install(){ensureStyles();decorate();setTimeout(decorate,180);setTimeout(decorate,700);const root=document.getElementById('view-wellness');if(root&&!root.dataset.wellnessUnifiedObserved){root.dataset.wellnessUnifiedObserved='1';new MutationObserver(()=>{if(root.classList.contains('active'))schedule();}).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});}}"
          new5="function install(){ensureStyles();decorate();setTimeout(decorate,180);setTimeout(decorate,700);const root=document.getElementById('view-wellness');if(root&&!root.dataset.wellnessUnifiedObserved){root.dataset.wellnessUnifiedObserved='1';let wasActive=root.classList.contains('active');if(!wasActive)markWellnessPending();new MutationObserver(()=>{const active=root.classList.contains('active');if(active!==wasActive){wasActive=active;markWellnessPending();if(active){closePlayerDetailIfOpen();schedule();}return;}if(active)schedule();}).observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});}}"
          if old5 not in s:
              raise SystemExit('install marker not found')
          s=s.replace(old5,new5,1)
          p.write_text(s)

          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260820zd';", "window.VOLLEY_ASSET_VERSION = '20260820ze';")
          s=s.replace("'wellness-unified-mobile-20260820.js?v=20260820b'", "'wellness-unified-mobile-20260820.js?v=20260820c'")
          anchor="(function loadVolleySyncPatches(){const scripts=["
          prime="""(function primeWellnessUnifiedState(){\n  document.documentElement.classList.remove('wellness-unified-ready');\n  if(!document.getElementById('wellness-unified-preload-css')){\n    const style=document.createElement('style');\n    style.id='wellness-unified-preload-css';\n    style.textContent=`html:not(.wellness-unified-ready) #view-wellness.active{visibility:hidden!important;opacity:0!important;pointer-events:none!important}`;\n    document.head.appendChild(style);\n  }\n})();\n"""
          if prime not in s:
              if anchor not in s:
                  raise SystemExit('config anchor not found')
              s=s.replace(anchor,prime+anchor,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text().replace('supabase-config.js?v=20260820safe45','supabase-config.js?v=20260820safe46')
          p.write_text(s)
          PY
      - name: Commit refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wellness-unified-mobile-20260820.js supabase-config.js index.html
          git diff --cached --quiet || git commit -m 'Stabilize wellness rendering and tablet layout'
          git push
