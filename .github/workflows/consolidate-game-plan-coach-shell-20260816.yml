name: Consolidate game plan coach shell
on:
  push:
    paths:
      - '.github/workflows/consolidate-game-plan-coach-shell-20260816.yml'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch coach shell modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          cfg=Path('supabase-config.js')
          text=cfg.read_text()
          text=re.sub(r"window\.VOLLEY_ASSET_VERSION = '[^']+';", "window.VOLLEY_ASSET_VERSION = '20260816t';", text, count=1)
          old=[
            "  'game-plan-coach-board-20260814.js?v=20260814k',\n",
            "  'game-plan-coach-top-compact-20260814.js?v=20260814l',\n",
            "  'game-plan-opponent-hero-fix-20260814.js?v=20260814n',\n",
            "  'game-plan-read-tracker-compact-20260814.js?v=20260814q',\n",
          ]
          anchor=old[0]
          if anchor not in text:
              raise SystemExit('coach board anchor not found')
          text=text.replace(anchor,"  'game-plan-coach-shell-20260816.js?v=20260816t',\n",1)
          for line in old[1:]:
              if line not in text:
                  raise SystemExit(f'module line not found: {line.strip()}')
              text=text.replace(line,'',1)
          cfg.write_text(text)
          idx=Path('index.html')
          html=idx.read_text()
          html=re.sub(r'supabase-config\.js\?v=[A-Za-z0-9]+','supabase-config.js?v=20260816t',html,count=1)
          idx.write_text(html)
          PY
      - name: Validate consolidated shell
        run: |
          node --check game-plan-coach-shell-20260816.js
          node --check supabase-config.js
          grep -q "game-plan-coach-shell-20260816.js?v=20260816t" supabase-config.js
          ! grep -q "game-plan-coach-board-20260814.js" supabase-config.js
          ! grep -q "game-plan-coach-top-compact-20260814.js" supabase-config.js
          ! grep -q "game-plan-opponent-hero-fix-20260814.js" supabase-config.js
          ! grep -q "game-plan-read-tracker-compact-20260814.js" supabase-config.js
          grep -q "supabase-config.js?v=20260816t" index.html
      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Consolidate game plan coach shell"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/consolidate-game-plan-coach-shell-20260816.yml
          git commit -m "Remove temporary coach shell workflow"
          git push
