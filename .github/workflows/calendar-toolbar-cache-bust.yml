name: Publish calendar toolbar polish

on:
  push:
    paths:
      - '.github/workflows/calendar-toolbar-cache-bust.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh calendar toolbar cache
        run: |
          sed -i 's/supabase-config.js?v=20260820safe30/supabase-config.js?v=20260820safe31/g' index.html
          rm -f .github/workflows/calendar-toolbar-cache-bust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/calendar-toolbar-cache-bust.yml
          git commit -m "Publish calendar toolbar polish"
          git push
