name: Publish roster final polish

on:
  push:
    paths:
      - '.github/workflows/roster-final-polish-cache-bust.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh roster final polish
        run: |
          sed -i "s/window.VOLLEY_ASSET_VERSION = '20260820r'/window.VOLLEY_ASSET_VERSION = '20260820s'/g" supabase-config.js
          sed -i 's/roster-mobile-app-ux-20260820.js?v=20260820a/roster-mobile-app-ux-20260820.js?v=20260820b/g' supabase-config.js
          sed -i 's/supabase-config.js?v=20260820safe33/supabase-config.js?v=20260820safe34/g' index.html
          rm -f .github/workflows/roster-final-polish-cache-bust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html .github/workflows/roster-final-polish-cache-bust.yml
          git commit -m "Publish roster final polish"
          git push