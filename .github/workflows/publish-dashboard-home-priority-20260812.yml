name: Publish dashboard home priority

on:
  push:
    paths:
      - '.github/workflows/publish-dashboard-home-priority-20260812.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register dashboard priority patch and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path

          cfg = Path('supabase-config.js')
          text = cfg.read_text(encoding='utf-8')
          if "window.VOLLEY_ASSET_VERSION = '20260812n';" not in text:
              raise SystemExit('Expected cache version 20260812n not found in supabase-config.js')
          text = text.replace("window.VOLLEY_ASSET_VERSION = '20260812n';", "window.VOLLEY_ASSET_VERSION = '20260812o';", 1)
          marker = "'dashboard-ux-20260811.js?v=20260811j'"
          if "dashboard-home-priority-20260812.js" not in text:
              if marker not in text:
                  raise SystemExit('dashboard-ux marker not found')
              text = text.replace(marker, marker + ",'dashboard-home-priority-20260812.js?v=20260812o'", 1)
          cfg.write_text(text, encoding='utf-8')

          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          if '20260812n' not in html:
              raise SystemExit('Expected cache version 20260812n not found in index.html')
          html = html.replace('20260812n', '20260812o')
          idx.write_text(html, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check dashboard-home-priority-20260812.js
          node --check supabase-config.js

      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-home-priority-20260812.js supabase-config.js index.html
          git commit -m "Publish prioritized coach home dashboard"
          git push
          git rm .github/workflows/publish-dashboard-home-priority-20260812.yml
          git commit -m "Remove dashboard priority workflow"
          git push
