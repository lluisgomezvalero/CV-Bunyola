name: Restore plan UI
on:
  push:
    paths:
      - '.github/workflows/restore-plan-ui-20260816.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update loader and cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('supabase-config.js')
          s=p.read_text()
          s=re.sub(r"window\.VOLLEY_ASSET_VERSION = '[^']+';", "window.VOLLEY_ASSET_VERSION = '20260816o';", s)
          old="  'game-plan-safe-save-20260816.js?v=20260816h',\n  'game-plan-coach-attack-tabs-final-20260816.js?v=20260816k',"
          new="  'game-plan-safe-save-20260816.js?v=20260816h',\n  'game-plan-attack-tabs-20260814.js?v=20260816o',\n  'game-plan-coach-attack-tabs-final-20260816.js?v=20260816k',\n  'game-plan-player-rival-serve-20260816.js?v=20260816o',"
          if old not in s:
              raise SystemExit('Expected loader tail not found')
          s=s.replace(old,new)
          p.write_text(s)
          html=Path('index.html')
          h=html.read_text()
          for name in ['supabase-config.js','supabase-client.js','data.js','app.js']:
              h=re.sub(rf'({re.escape(name)}\?v=)[^"\']+', rf'\g<1>20260816o', h)
          html.write_text(h)
          PY
      - name: Validate JavaScript
        run: |
          node --check game-plan-attack-tabs-20260814.js
          node --check game-plan-player-rival-serve-20260816.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html game-plan-attack-tabs-20260814.js game-plan-player-rival-serve-20260816.js
          git commit -m "Restore plan tabs and modernize player rival serve" || true
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/restore-plan-ui-20260816.yml
          git commit -m "Remove temporary plan UI workflow"
          git push
