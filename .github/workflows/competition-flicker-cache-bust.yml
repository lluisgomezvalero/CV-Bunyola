name: Refresh competition flicker fix

on:
  push:
    paths:
      - '.github/workflows/competition-flicker-cache-bust.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish fresh competition assets
        run: |
          sed -i 's/supabase-config.js?v=20260820safe22/supabase-config.js?v=20260820safe23/g' index.html
          rm -f .github/workflows/competition-flicker-cache-bust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/competition-flicker-cache-bust.yml
          git commit -m "Publish competition flicker fix"
          git push
