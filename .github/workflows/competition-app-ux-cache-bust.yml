name: Refresh competition app UX

on:
  push:
    paths:
      - '.github/workflows/competition-app-ux-cache-bust.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh competition app UX assets
        run: |
          sed -i 's/supabase-config.js?v=20260820safe16/supabase-config.js?v=20260820safe17/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No cache change needed"
          else
            git commit -m "Refresh competition app UX assets"
            git push
          fi
