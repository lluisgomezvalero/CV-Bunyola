name: Validate session detail v3
on:
  push:
    paths:
      - '.github/workflows/validate-session-detail-v3.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check session structure and cache
        shell: bash
        run: |
          grep -q 'session-phase-step' app.js
          grep -q 'SESSION DETAIL V3' styles.css
          grep -q "VOLLEY_ASSET_VERSION = '20260812a'" supabase-config.js
          grep -q 'app.js?v=20260812a' index.html
          grep -q 'styles.css?v=20260812a' index.html
