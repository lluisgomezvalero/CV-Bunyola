name: Polish wellness player modal

on:
  push:
    paths:
      - '.github/workflows/polish-wellness-player-modal-20260822.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply modal polish
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('wellness-individual-tracking-20260822.js')
          s = path.read_text()

          old = """  if(Math.abs(delta)<.25)return{delta,label:'Fatiga estable',tone:'neutral'};\n  if(delta>0)return{delta,label:`Fatiga +${delta.toFixed(1)}`,tone:delta>=1?'attn':'warm'};\n  return{delta,label:`Fatiga ${delta.toFixed(1)}`,tone:'good'};"""
          new = """  if(Math.abs(delta)<.25)return{delta,label:'→ estable',tone:'neutral'};\n  const shown=Math.abs(delta).toFixed(1).replace('.',',');\n  if(delta>0)return{delta,label:`↑ ${shown} · aumentando`,tone:delta>=1?'attn':'warm'};\n  return{delta,label:`↓ ${shown} · mejorando`,tone:'good'};"""
          if old not in s: raise SystemExit('trend block not found')
          s = s.replace(old, new, 1)

          anchor = "function fatigueTone(value){return value==null?'neutral':value>=4?'attn':value>=3?'warm':'good';}\n"
          addition = anchor + """function statusFor(item){\n  if(!item?.latest)return{label:'Sin datos',tone:'neutral'};\n  const f=item.latestFatigue,s=item.latestSleep,d=item.discomfort;\n  const attention=(f!=null&&f>=4)||(s!=null&&s<=2)||(d?.tone==='attn');\n  if(attention)return{label:'Atención',tone:'attn'};\n  const watch=(f!=null&&f>=3)||(s!=null&&s<=3)||(d?.tone==='warm');\n  if(watch)return{label:'Vigilar',tone:'warm'};\n  return{label:'Buen estado',tone:'good'};\n}\n"""
          if anchor not in s: raise SystemExit('status anchor not found')
          s = s.replace(anchor, addition, 1)

          old_css = """    .wellness-player-tracking-modal .modal-content{width:min(94vw,620px)!important;max-height:min(86vh,760px)!important;overflow:hidden!important;border-radius:20px!important}\n    .wellness-player-tracking-modal .modal-header{align-items:flex-start!important}.wellness-player-tracking-modal .modal-header h3{margin:0 0 .16rem!important;color:#253044!important;font-size:1.05rem!important}.wellness-player-tracking-modal .modal-header small{color:#7d8998!important;font-size:.62rem!important}\n"""
          new_css = """    .wellness-player-tracking-modal{z-index:120000!important}\n    .wellness-player-tracking-modal .modal-content{width:min(94vw,620px)!important;max-height:min(86vh,760px)!important;overflow:hidden!important;border-radius:20px!important}\n    .wellness-player-tracking-modal .modal-header{align-items:flex-start!important}.wellness-player-tracking-modal .modal-header h3{margin:0 0 .16rem!important;color:#253044!important;font-size:1.05rem!important}.wellness-player-tracking-modal .modal-header small{color:#7d8998!important;font-size:.62rem!important}\n    .wellness-player-modal-meta{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}.wellness-player-status{display:inline-flex;align-items:center;padding:.2rem .38rem;border-radius:999px;background:#f1f5f9;color:#64748b;font-size:.52rem;font-weight:850}.wellness-player-status.good{background:#ecfdf5;color:#047857}.wellness-player-status.warm{background:#fff7ed;color:#b45309}.wellness-player-status.attn{background:#fff1f2;color:#be123c}\n"""
          if old_css not in s: raise SystemExit('modal css block not found')
          s = s.replace(old_css, new_css, 1)

          old_spark_css = ".wellness-player-spark{display:block;width:100%;height:82px}"
          new_spark_css = ".wellness-player-spark{display:block;width:100%;height:100px}"
          if old_spark_css not in s: raise SystemExit('spark css not found')
          s = s.replace(old_spark_css, new_spark_css, 1)

          old_spark = """  const width=320,height=82,left=8,right=8,top=8,bottom=12,plotW=width-left-right,plotH=height-top-bottom;\n  const x=index=>left+(values.length===1?plotW/2:index*(plotW/(values.length-1)));\n  const y=value=>top+((5-Math.max(0,Math.min(5,value)))/5)*plotH;\n  const points=values.map((point,index)=>`${x(index).toFixed(1)},${y(point.value).toFixed(1)}`).join(' ');\n  const circles=values.map((point,index)=>`<circle cx=\"${x(index).toFixed(1)}\" cy=\"${y(point.value).toFixed(1)}\" r=\"3.2\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.6\"><title>${esc(shortDate(point.date))}: ${point.value}/5</title></circle>`).join('');\n  return `<svg class=\"wellness-player-spark\" viewBox=\"0 0 ${width} ${height}\" preserveAspectRatio=\"none\" role=\"img\" aria-label=\"Evolución reciente de fatiga\"><line x1=\"${left}\" y1=\"${y(3).toFixed(1)}\" x2=\"${width-right}\" y2=\"${y(3).toFixed(1)}\" stroke=\"#e8edf2\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/><polyline points=\"${points}\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>${circles}</svg>`;"""
          new_spark = """  const width=320,height=100,left=10,right=10,top=8,bottom=26,plotW=width-left-right,plotH=height-top-bottom;\n  const x=index=>left+(values.length===1?plotW/2:index*(plotW/(values.length-1)));\n  const y=value=>top+((5-Math.max(0,Math.min(5,value)))/5)*plotH;\n  const points=values.map((point,index)=>`${x(index).toFixed(1)},${y(point.value).toFixed(1)}`).join(' ');\n  const circles=values.map((point,index)=>`<circle cx=\"${x(index).toFixed(1)}\" cy=\"${y(point.value).toFixed(1)}\" r=\"3.2\" fill=\"#ffffff\" stroke=\"#64748b\" stroke-width=\"1.6\"><title>${esc(shortDate(point.date))}: ${point.value}/5</title></circle>`).join('');\n  const labels=values.map((point,index)=>`<text x=\"${x(index).toFixed(1)}\" y=\"${height-5}\" text-anchor=\"middle\" font-size=\"7.5\" fill=\"#94a3b8\">${esc(shortDate(point.date))}</text>`).join('');\n  return `<svg class=\"wellness-player-spark\" viewBox=\"0 0 ${width} ${height}\" preserveAspectRatio=\"none\" role=\"img\" aria-label=\"Evolución reciente de fatiga\"><line x1=\"${left}\" y1=\"${y(3).toFixed(1)}\" x2=\"${width-right}\" y2=\"${y(3).toFixed(1)}\" stroke=\"#e8edf2\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/><polyline points=\"${points}\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>${circles}${labels}</svg>`;"""
          if old_spark not in s: raise SystemExit('spark block not found')
          s = s.replace(old_spark, new_spark, 1)

          old_modal = """  const item=summary(player),latest=item.latest,disc=item.discomfort;\n  document.querySelector('.wellness-player-tracking-modal')?.remove();\n  const modal=document.createElement('div');\n  modal.className='modal-backdrop active wellness-player-tracking-modal';\n  const lastLabel=item.lastDate?`Último bienestar: ${longDate(item.lastDate)}`:'Sin respuestas de bienestar';"""
          new_modal = """  const item=summary(player),latest=item.latest,disc=item.discomfort,status=statusFor(item);\n  document.querySelector('.wellness-player-tracking-modal')?.remove();\n  const modal=document.createElement('div');\n  modal.className='modal-backdrop active wellness-player-tracking-modal';\n  const lastLabel=item.lastDate?`Último bienestar: ${longDate(item.lastDate)}`:'Sin respuestas de bienestar';"""
          if old_modal not in s: raise SystemExit('modal setup not found')
          s = s.replace(old_modal, new_modal, 1)

          old_header = """  modal.innerHTML=`<div class=\"modal-content\"><div class=\"modal-header\"><div><h3>${esc(player.name||'Jugadora')}</h3><small>${esc(lastLabel)}</small></div><button type=\"button\" class=\"modal-close\" aria-label=\"Cerrar\">&times;</button></div><div class=\"modal-body\">"""
          new_header = """  modal.innerHTML=`<div class=\"modal-content\"><div class=\"modal-header\"><div><h3>${esc(player.name||'Jugadora')}</h3><div class=\"wellness-player-modal-meta\"><small>${esc(lastLabel)}</small><span class=\"wellness-player-status ${status.tone}\">${esc(status.label)}</span></div></div><button type=\"button\" class=\"modal-close\" aria-label=\"Cerrar\">&times;</button></div><div class=\"modal-body\">"""
          if old_header not in s: raise SystemExit('modal header not found')
          s = s.replace(old_header, new_header, 1)

          path.write_text(s)

          config = Path('supabase-config.js')
          s = config.read_text()
          pairs = [
            ("window.VOLLEY_ASSET_VERSION = '20260822f';", "window.VOLLEY_ASSET_VERSION = '20260822g';"),
            ("'wellness-individual-tracking-20260822.js?v=20260822a'", "'wellness-individual-tracking-20260822.js?v=20260822b'"),
          ]
          for old, new in pairs:
            if old not in s: raise SystemExit(f'config token missing: {old}')
            s = s.replace(old, new, 1)
          config.write_text(s)

          index = Path('index.html')
          s = index.read_text()
          old='supabase-config.js?v=20260822safe61'
          new='supabase-config.js?v=20260822safe62'
          if old not in s: raise SystemExit('index cache token missing')
          index.write_text(s.replace(old,new,1))
          PY

          node --check wellness-individual-tracking-20260822.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wellness-individual-tracking-20260822.js supabase-config.js index.html
          git commit -m "Polish wellness player detail modal"
          git push

          git rm .github/workflows/polish-wellness-player-modal-20260822.yml
          git commit -m "Remove one-time player modal polish workflow"
          git push
