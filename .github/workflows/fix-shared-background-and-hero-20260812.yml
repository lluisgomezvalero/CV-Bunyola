name: Fix shared background and hero

on:
  push:
    paths:
      - '.github/workflows/fix-shared-background-and-hero-20260812.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch shell polish
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate
        run: |
          node --check app-shell-polish-20260812.js
          grep -q 'canManageBackground' app-shell-polish-20260812.js
          ! grep -q 'function isAdmin' app-shell-polish-20260812.js
          grep -q '#dashboard-hero.dashboard-motion-ready' app-shell-polish-20260812.js
          grep -q "VOLLEY_ASSET_VERSION = '20260812m'" supabase-config.js
          grep -q 'app-shell-polish-20260812.js?v=20260812m' supabase-config.js
          grep -q 'app.js?v=20260812m' index.html
      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-shared-background-and-hero-20260812.yml
          git add app-shell-polish-20260812.js supabase-config.js index.html
          git commit -m "Fix shared background upload and home hero"
          git push
