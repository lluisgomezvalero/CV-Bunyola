name: Publish player passport cleanup
on:
  push:
    paths:
      - 'player-passport-priority-20260813.js'
      - '.github/workflows/publish-player-passport-20260813.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loader and cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cfg=Path('supabase-config.js')
          s=cfg.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260813c';","window.VOLLEY_ASSET_VERSION = '20260813d';")
          needle="'mobile-menu-greeting-20260813.js?v=20260813c'"
          add=needle+",'player-passport-priority-20260813.js?v=20260813d'"
          if "player-passport-priority-20260813.js" not in s:
              if needle not in s: raise SystemExit('loader anchor not found')
              s=s.replace(needle,add)
          cfg.write_text(s)
          idx=Path('index.html')
          html=idx.read_text().replace('20260813c','20260813d')
          idx.write_text(html)
          PY
      - name: Validate
        run: |
          node --check player-passport-priority-20260813.js
          node --check supabase-config.js
          grep -q "player-passport-priority-20260813.js?v=20260813d" supabase-config.js
          grep -q "app.js?v=20260813d" index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Publish player passport cleanup" || true
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/publish-player-passport-20260813.yml
          git commit -m "Remove player passport publish workflow"
          git push
