name: Polish canonical plan controls
on:
  push:
    paths:
      - '.github/workflows/polish-canonical-plan-controls-20260817.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused UI fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game-plan-canonical-20260817.js')
          s=p.read_text()
          old='''<header><div><small>${esc(meta.role)}</small><input data-gp2-attacker-name="${key}" value="${esc(a.name)}" placeholder="Nombre o dorsal"></div><label><input type="checkbox" data-gp2-attacker-visible="${key}" ${a.visibleToPlayers?'checked':''}><span>Visible</span></label></header>'''
          new='''<header><div><small>${esc(meta.role)}</small><input data-gp2-attacker-name="${key}" value="${esc(a.name)}" placeholder="Nombre o dorsal"></div><label class="gp2-visible-toggle"><input type="checkbox" data-gp2-attacker-visible="${key}" ${a.visibleToPlayers?'checked':''}><span>Visible para jugadoras</span></label></header>'''
          if old not in s:
              raise SystemExit('attack header target not found')
          s=s.replace(old,new,1)
          old2='''    <div class="gp2-target-tabs">${opts.map(([k,v])=>`<button type="button" data-gp2-target="${esc(v)}" class="${target===v||target===k?'active':''}">${k}</button>`).join('')}<button type="button" data-gp2-target-other class="${target&&!known?'active':''}">Otro</button></div>\n    <input class="gp2-target-input" data-gp2-target-input value="${esc(target&&!known?target:'')}" placeholder="Nombre o dorsal" ${target&&!known?'':'hidden'}>'''
          new2='''    <div class="gp2-target-tabs">${opts.map(([k,v])=>`<button type="button" data-gp2-target="${esc(v)}" class="${target===v||target===k?'active':''}">${k}</button>`).join('')}</div>'''
          if old2 not in s:
              raise SystemExit('other target UI not found')
          s=s.replace(old2,new2,1)
          s=s.replace(".gp2-attack-card>header,.gp2-player-attack>header{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.72rem", ".gp2-attack-card>header,.gp2-player-attack>header{width:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr);align-items:stretch;gap:.48rem;padding:.72rem",1)
          s=s.replace(".gp2-attack-card>header label{display:flex;align-items:center;gap:.3rem;font-size:.6rem;font-weight:850;white-space:nowrap}", ".gp2-attack-card>header label{display:flex;align-items:center;gap:.32rem;justify-self:start;width:max-content;max-width:100%;font-size:.6rem;font-weight:850;white-space:nowrap}.gp2-visible-toggle{padding:.28rem .42rem;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(255,255,255,.08)}",1)
          s=s.replace(".gp2-target-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem;margin-bottom:.4rem}", ".gp2-target-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.3rem;margin-bottom:.4rem}",1)
          p.write_text(s)

          cfg=Path('supabase-config.js')
          c=cfg.read_text()
          import re
          c=re.sub(r"window\.VOLLEY_ASSET_VERSION = '[^']+';","window.VOLLEY_ASSET_VERSION = '20260817f';",c,count=1)
          c=re.sub(r"game-plan-canonical-20260817\.js\?v=[^'\"]+","game-plan-canonical-20260817.js?v=20260817f",c,count=1)
          cfg.write_text(c)

          idx=Path('index.html')
          h=idx.read_text()
          h=re.sub(r"supabase-config\.js\?v=[^\"]+","supabase-config.js?v=20260817f",h,count=1)
          idx.write_text(h)
          PY
      - name: Validate
        run: |
          node --check game-plan-canonical-20260817.js
          grep -q "grid-template-columns:repeat(3" game-plan-canonical-20260817.js
          ! grep -q "data-gp2-target-other" <(python - <<'PY'
          from pathlib import Path
          s=Path('game-plan-canonical-20260817.js').read_text()
          start=s.index('function ourServeEditor()')
          end=s.index('function receiversEditor()',start)
          print(s[start:end])
          PY
          )
          grep -q "20260817f" supabase-config.js
          grep -q "20260817f" index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-plan-canonical-20260817.js supabase-config.js index.html
          git commit -m "Polish canonical game plan controls"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/polish-canonical-plan-controls-20260817.yml
          git commit -m "Remove temporary plan controls workflow"
          git push