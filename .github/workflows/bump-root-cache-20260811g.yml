name: Bump root cache 20260811g

on:
  push:
    paths:
      - '.github/workflows/bump-root-cache-20260811g.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update root asset cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'fix_attendance_and_event_sync_v2'
          # The previous root version may already be the current explicit cache key.
          for previous in (old, '20260811f'):
              text = text.replace(f'supabase-config.js?v={previous}', 'supabase-config.js?v=20260811g')
              text = text.replace(f'supabase-client.js?v={previous}', 'supabase-client.js?v=20260811g')
              text = text.replace(f'data.js?v={previous}', 'data.js?v=20260811g')
              text = text.replace(f'app.js?v={previous}', 'app.js?v=20260811g')
          required = [
              'supabase-config.js?v=20260811g',
              'supabase-client.js?v=20260811g',
              'data.js?v=20260811g',
              'app.js?v=20260811g',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing expected replacements: {missing}')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bump-root-cache-20260811g.yml
          git add index.html
          git commit -m "Bump root asset cache to 20260811g"
          git push
