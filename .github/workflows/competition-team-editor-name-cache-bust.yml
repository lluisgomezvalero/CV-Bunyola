name: Publish rival editor name spacing

on:
  push:
    paths:
      - '.github/workflows/competition-team-editor-name-cache-bust.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh rival editor assets
        run: |
          sed -i "s/window.VOLLEY_ASSET_VERSION = '20260820k'/window.VOLLEY_ASSET_VERSION = '20260820l'/g" supabase-config.js
          sed -i 's/competition-team-editor-ux-20260820.js?v=20260820a/competition-team-editor-ux-20260820.js?v=20260820b/g' supabase-config.js
          sed -i 's/supabase-config.js?v=20260820safe26/supabase-config.js?v=20260820safe27/g' index.html
          rm -f .github/workflows/competition-team-editor-name-cache-bust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html .github/workflows/competition-team-editor-name-cache-bust.yml
          git commit -m "Publish rival editor name spacing"
          git push
