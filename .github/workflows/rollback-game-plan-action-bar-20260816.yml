name: Rollback freezing game plan action bar
on:
  push:
    paths:
      - '.github/workflows/rollback-game-plan-action-bar-20260816.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove freezing layer and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260816a';", "window.VOLLEY_ASSET_VERSION = '20260816b';")
          s=s.replace(", 'game-plan-action-bar-authoritative-20260816.js?v=20260816a'", "")
          s=s.replace(",'game-plan-action-bar-authoritative-20260816.js?v=20260816a'", "")
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('20260816a','20260816b')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check supabase-config.js
          grep -q "VOLLEY_ASSET_VERSION = '20260816b'" supabase-config.js
          ! grep -q "game-plan-action-bar-authoritative-20260816.js" supabase-config.js
      - name: Commit rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Rollback freezing game plan action bar"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/rollback-game-plan-action-bar-20260816.yml
          git commit -m "Remove temporary rollback workflow"
          git push
