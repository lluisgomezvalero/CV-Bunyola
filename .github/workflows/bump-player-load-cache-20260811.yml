name: Bump player load root cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-player-load-cache-20260811.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update root cache and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'supabase-config.js?v=20260811i':'supabase-config.js?v=20260811j',
            'supabase-client.js?v=20260811i':'supabase-client.js?v=20260811j',
            'data.js?v=20260811i':'data.js?v=20260811j',
            'app.js?v=20260811i':'app.js?v=20260811j',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected cache token: {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/bump-player-load-cache-20260811.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/bump-player-load-cache-20260811.yml
          git commit -m 'Bump root cache to 20260811j'
          git push
