name: Fix canonical attack origins
on:
  push:
    paths:
      - '.github/workflows/fix-canonical-attack-origins-20260817.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix AR and OP origins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game-plan-canonical-20260817.js')
          s=p.read_text()
          old=[
            "z4a:{short:'AR1',role:'Atacante receptora 1',origin:[17,8]",
            "z4b:{short:'AR2',role:'Atacante receptora 2',origin:[17,8]",
            "z2:{short:'OP',role:'Opuesta',origin:[83,8]",
          ]
          for x in old:
              assert x in s, f'Expected mapping not found: {x}'
          s=s.replace("z4a:{short:'AR1',role:'Atacante receptora 1',origin:[17,8]", "z4a:{short:'AR1',role:'Atacante receptora 1',origin:[83,8]", 1)
          s=s.replace("z4b:{short:'AR2',role:'Atacante receptora 2',origin:[17,8]", "z4b:{short:'AR2',role:'Atacante receptora 2',origin:[83,8]", 1)
          s=s.replace("z2:{short:'OP',role:'Opuesta',origin:[83,8]", "z2:{short:'OP',role:'Opuesta',origin:[17,8]", 1)
          p.write_text(s)

          p=Path('supabase-config.js')
          s=p.read_text().replace("window.VOLLEY_ASSET_VERSION = '20260817d';", "window.VOLLEY_ASSET_VERSION = '20260817e';")
          s=s.replace('game-plan-canonical-20260817.js?v=20260817d','game-plan-canonical-20260817.js?v=20260817e')
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text().replace('supabase-config.js?v=20260817d','supabase-config.js?v=20260817e')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check game-plan-canonical-20260817.js
          node --check supabase-config.js
          grep -F "z4a:{short:'AR1',role:'Atacante receptora 1',origin:[83,8]" game-plan-canonical-20260817.js
          grep -F "z4b:{short:'AR2',role:'Atacante receptora 2',origin:[83,8]" game-plan-canonical-20260817.js
          grep -F "z2:{short:'OP',role:'Opuesta',origin:[17,8]" game-plan-canonical-20260817.js
          grep -F "game-plan-canonical-20260817.js?v=20260817e" supabase-config.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-plan-canonical-20260817.js supabase-config.js index.html
          git commit -m "Fix canonical attack origins" || exit 0
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/fix-canonical-attack-origins-20260817.yml
          git commit -m "Remove temporary attack origin workflow"
          git push
