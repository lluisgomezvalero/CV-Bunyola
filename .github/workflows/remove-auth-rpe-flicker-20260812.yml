name: Remove auth and RPE flicker

on:
  push:
    paths:
      - '.github/workflows/remove-auth-rpe-flicker-20260812.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch hydration states
        run: |
          python - <<'PY'
          from pathlib import Path

          app=Path('app.js')
          js=app.read_text(encoding='utf-8')

          # Do not render a provisional RPE control until the authoritative first read finishes.
          marker="function renderRpeScale(eventId, selectedValue, mode) {\n"
          insert="function renderRpeScale(eventId, selectedValue, mode) {\n  if (window.__rpeAuthoritativeReady !== true) {\n    return `<div class=\"training-rpe-loading\"><span class=\"training-rpe-loading-dot\"></span><span>Actualizando RPE…</span></div>`;\n  }\n"
          if marker not in js: raise SystemExit('renderRpeScale marker not found')
          if 'training-rpe-loading-dot' not in js:
              js=js.replace(marker,insert,1)

          # Resolve auth before showing either login or the portal.
          old="  const currentUser = await restoreSupabaseSession();\n  const isAuthenticated = Boolean(currentUser && currentUser.username);"
          new="  let currentUser = null;\n  try {\n    currentUser = await restoreSupabaseSession();\n  } catch (error) {\n    console.error('[VolleyCoach] No se pudo restaurar la sesión:', error);\n  }\n  const isAuthenticated = Boolean(currentUser && currentUser.username);"
          if old not in js: raise SystemExit('auth restore block not found')
          js=js.replace(old,new,1)

          old="    safeInit(\"recordatorio de bienestar semanal\", maybeOpenWeeklyWellnessPrompt);\n  }\n\n  ["
          new="    safeInit(\"recordatorio de bienestar semanal\", maybeOpenWeeklyWellnessPrompt);\n  }\n\n  document.documentElement.classList.add('auth-ready');\n\n  ["
          if old not in js: raise SystemExit('auth ready insertion point not found')
          js=js.replace(old,new,1)
          app.write_text(js,encoding='utf-8')

          # Authoritative RPE readiness flag. First successful/attempted load reveals the real state.
          rp=Path('rpe-authoritative-20260810.js')
          rjs=rp.read_text(encoding='utf-8')
          if "'use strict';\nwindow.__rpeAuthoritativeReady=false;" not in rjs:
              rjs=rjs.replace("'use strict';\n","'use strict';\nwindow.__rpeAuthoritativeReady=false;\n",1)
          old="}finally{loading=false;}}"
          new="}finally{loading=false;const firstReady=window.__rpeAuthoritativeReady!==true;window.__rpeAuthoritativeReady=true;if(firstReady)call('renderSessionCenterDetail');}}"
          if old not in rjs: raise SystemExit('RPE load finally block not found')
          rjs=rjs.replace(old,new,1)
          rp.write_text(rjs,encoding='utf-8')

          # Initial boot gate: never flash login while Supabase restores an existing session.
          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          boot_style='''\n  <style id="auth-boot-style">\n    html:not(.auth-ready) #view-login,\n    html:not(.auth-ready) .app-portal-wrapper{visibility:hidden!important}\n    #app-boot-screen{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a}\n    #app-boot-screen .app-boot-inner{display:flex;flex-direction:column;align-items:center;gap:.8rem;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}\n    #app-boot-screen strong{font-size:1rem;letter-spacing:.01em}\n    #app-boot-screen small{font-size:.78rem;color:#64748b}\n    #app-boot-screen .app-boot-spinner{width:28px;height:28px;border:3px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:appBootSpin .7s linear infinite}\n    html.auth-ready #app-boot-screen{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,visibility .16s ease}\n    .training-rpe-loading{display:flex;align-items:center;gap:.55rem;padding:.85rem 1rem;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;color:#64748b;font-size:.86rem}\n    .training-rpe-loading-dot{width:8px;height:8px;border-radius:50%;background:#3b82f6;animation:rpeLoadingPulse .9s ease-in-out infinite alternate}\n    @keyframes appBootSpin{to{transform:rotate(360deg)}}\n    @keyframes rpeLoadingPulse{to{opacity:.25;transform:scale(.8)}}\n  </style>\n'''
          if 'id="auth-boot-style"' not in h:
              needle='  <title>CV BUNYOLA - Hub del Equipo</title>\n'
              if needle not in h: raise SystemExit('index title marker not found')
              h=h.replace(needle,needle+boot_style,1)
          boot='''\n  <div id="app-boot-screen" aria-live="polite">\n    <div class="app-boot-inner">\n      <span class="app-boot-spinner" aria-hidden="true"></span>\n      <strong>VolleyCoach HUB</strong>\n      <small>Preparando tu sesión…</small>\n    </div>\n  </div>\n'''
          if 'id="app-boot-screen"' not in h:
              if '<body>\n' not in h: raise SystemExit('body marker not found')
              h=h.replace('<body>\n','<body>\n'+boot,1)

          # Cache bust.
          cfg=Path('supabase-config.js')
          c=cfg.read_text(encoding='utf-8')
          if "window.VOLLEY_ASSET_VERSION = '20260812h';" not in c: raise SystemExit('cache h not found')
          c=c.replace("window.VOLLEY_ASSET_VERSION = '20260812h';","window.VOLLEY_ASSET_VERSION = '20260812i';",1)
          if 'rpe-authoritative-20260810.js?v=20260812h' not in c: raise SystemExit('RPE h token not found')
          c=c.replace('rpe-authoritative-20260810.js?v=20260812h','rpe-authoritative-20260810.js?v=20260812i',1)
          cfg.write_text(c,encoding='utf-8')

          h=h.replace('?v=20260812h','?v=20260812i')
          idx.write_text(h,encoding='utf-8')
          PY

      - name: Validate JavaScript and boot gate
        run: |
          node --check app.js
          node --check rpe-authoritative-20260810.js
          grep -q "__rpeAuthoritativeReady" app.js
          grep -q "__rpeAuthoritativeReady=true" rpe-authoritative-20260810.js
          grep -q "auth-ready" app.js
          grep -q 'id="app-boot-screen"' index.html
          grep -q "VOLLEY_ASSET_VERSION = '20260812i'" supabase-config.js
          grep -q "app.js?v=20260812i" index.html

      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-auth-rpe-flicker-20260812.yml
          git add app.js rpe-authoritative-20260810.js supabase-config.js index.html
          git commit -m "Avoid auth and RPE hydration flicker"
          git push
