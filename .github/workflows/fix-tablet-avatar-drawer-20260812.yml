name: Fix tablet avatar sync and drawer repaint
on:
  push:
    paths:
      - '.github/workflows/fix-tablet-avatar-drawer-20260812.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/fix_tablet_avatar_drawer_20260812.py
      - name: Validate
        run: |
          node --check player-avatar-authoritative-20260812.js
          node --check app-shell-polish-20260812.js
          node --check supabase-config.js
          python3 - <<'PY'
          from pathlib import Path
          av=Path('player-avatar-authoritative-20260812.js').read_text()
          sh=Path('app-shell-polish-20260812.js').read_text()
          cfg=Path('supabase-config.js').read_text()
          idx=Path('index.html').read_text()
          assert 'async function backfillLocalAvatars()' in av
          assert 'preparedDataUrl' in av
          assert 'Android/Tablet: evita fallos de repintado' in sh
          assert "VOLLEY_ASSET_VERSION = '20260812w'" in cfg
          assert 'player-avatar-authoritative-20260812.js?v=20260812w' in cfg
          assert 'app-shell-polish-20260812.js?v=20260812w' in cfg
          assert 'app.js?v=20260812w' in idx
          PY
          git diff --check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-avatar-authoritative-20260812.js app-shell-polish-20260812.js supabase-config.js index.html
          git commit -m "Stabilize tablet avatar sync and mobile drawer"
          git push
      - name: Remove patch helpers
        if: success()
        run: |
          git pull --rebase
          git rm .github/workflows/fix-tablet-avatar-drawer-20260812.yml .github/scripts/fix_tablet_avatar_drawer_20260812.py
          git commit -m "Remove tablet stability patch helpers"
          git push
