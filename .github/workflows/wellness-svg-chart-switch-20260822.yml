name: Switch wellness mobile chart to SVG

on:
  push:
    paths:
      - '.github/workflows/wellness-svg-chart-switch-20260822.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace mobile wellness canvas with SVG renderer
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path('supabase-config.js')
          s = config.read_text()
          replacements = [
              ("window.VOLLEY_ASSET_VERSION = '20260822c';", "window.VOLLEY_ASSET_VERSION = '20260822d';"),
              ("  'wellness-chart-stability-20260821.js?v=20260822a',", "  'wellness-svg-chart-20260822.js?v=20260822a',"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected config string not found: {old}')
              s = s.replace(old, new, 1)
          config.write_text(s)

          index = Path('index.html')
          s = index.read_text()
          old = 'supabase-config.js?v=20260822safe58'
          new = 'supabase-config.js?v=20260822safe59'
          if old not in s:
              raise SystemExit('Expected index cache key not found')
          index.write_text(s.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Switch mobile wellness chart to SVG"
          git push

          git rm .github/workflows/wellness-svg-chart-switch-20260822.yml
          git commit -m "Remove one-time wellness SVG workflow"
          git push
