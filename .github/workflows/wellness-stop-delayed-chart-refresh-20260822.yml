name: Stop delayed wellness chart refresh

on:
  push:
    paths:
      - '.github/workflows/wellness-stop-delayed-chart-refresh-20260822.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove destructive delayed chart refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app-corrections-20260809.js')
          s = p.read_text()
          old = "window.renderWellness=function(){const r=baseWellness.apply(this,arguments);removeCoachSleepAverageColumn();renderCoachWellnessInspector();if(!wellnessSyncBusy)syncWellness().then(()=>{if(!document.getElementById('view-wellness')?.classList.contains('active'))return;try{typeof renderBorgMatrix==='function'&&renderBorgMatrix();}catch(_){}removeCoachSleepAverageColumn();renderCoachWellnessInspector();requestAnimationFrame(()=>{try{typeof window.renderWellnessCharts==='function'&&window.renderWellnessCharts();}catch(e){console.warn('[Corrections] wellness chart refresh',e);}});});return r;};"
          new = "window.renderWellness=function(){const r=baseWellness.apply(this,arguments);removeCoachSleepAverageColumn();renderCoachWellnessInspector();if(!wellnessSyncBusy)syncWellness().then(()=>{if(!document.getElementById('view-wellness')?.classList.contains('active'))return;try{typeof renderBorgMatrix==='function'&&renderBorgMatrix();}catch(_){}removeCoachSleepAverageColumn();renderCoachWellnessInspector();});return r;};"
          if old not in s:
              raise SystemExit('Expected delayed chart refresh wrapper not found; refusing to patch')
          p.write_text(s.replace(old, new, 1))
          PY
          sed -i "s/window.VOLLEY_ASSET_VERSION = '20260822b'/window.VOLLEY_ASSET_VERSION = '20260822c'/g" supabase-config.js
          sed -i 's/app-corrections-20260809.js?v=20260822a/app-corrections-20260809.js?v=20260822b/g' supabase-config.js
          sed -i 's/supabase-config.js?v=20260822safe57/supabase-config.js?v=20260822safe58/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-corrections-20260809.js supabase-config.js index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Keep wellness chart alive after sync"
            git push
          fi
