name: Publish attack live draft persistence
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-attack-live-draft-20260816.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load attack live draft and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260816d';", "window.VOLLEY_ASSET_VERSION = '20260816e';")
          needle="'game-plan-player-attack-tabs-20260816.js?v=20260816d'"
          replacement=needle+",'game-plan-attack-live-draft-20260816.js?v=20260816e'"
          if 'game-plan-attack-live-draft-20260816.js' not in s:
              s=s.replace(needle,replacement)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text().replace('20260816d','20260816e')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check game-plan-attack-live-draft-20260816.js
          node --check supabase-config.js
          grep -q "VOLLEY_ASSET_VERSION = '20260816e'" supabase-config.js
          grep -q "game-plan-attack-live-draft-20260816.js?v=20260816e" supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Publish attack live draft persistence"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-attack-live-draft-20260816.yml
          git commit -m "Remove temporary attack live draft workflow"
          git push
