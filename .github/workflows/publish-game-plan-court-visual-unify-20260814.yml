name: Publish unified tactical court visuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-game-plan-court-visual-unify-20260814.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load unified court visuals and refresh cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cfg = Path('supabase-config.js')
          text = cfg.read_text()
          text = text.replace("window.VOLLEY_ASSET_VERSION = '20260814t';", "window.VOLLEY_ASSET_VERSION = '20260814u';")
          needle = "'game-plan-our-serve-board-20260814.js?v=20260814t'"
          add = needle + ",'game-plan-court-visual-unify-20260814.js?v=20260814u'"
          if 'game-plan-court-visual-unify-20260814.js' not in text:
              text = text.replace(needle, add)
          cfg.write_text(text)

          idx = Path('index.html')
          html = idx.read_text()
          for name in ['supabase-config.js','supabase-client.js','data.js','app.js']:
              html = re.sub(rf'{re.escape(name)}\?v=[^"\']+', f'{name}?v=20260814u', html)
          idx.write_text(html)
          PY

      - name: Validate JavaScript
        run: |
          node --check game-plan-court-visual-unify-20260814.js
          node --check supabase-config.js

      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Publish unified tactical court visuals"
          git push

      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-court-visual-unify-20260814.yml
          git commit -m "Remove temporary court visual publish workflow"
          git push
