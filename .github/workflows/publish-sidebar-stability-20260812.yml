name: Publish sidebar stability
on:
  push:
    paths:
      - 'sidebar-viewport-stability-20260812.js'
      - '.github/workflows/publish-sidebar-stability-20260812.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch config and cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260812x';", "window.VOLLEY_ASSET_VERSION = '20260812y';")
          old="'app-shell-polish-20260812.js?v=20260812w'"
          new="'app-shell-polish-20260812.js?v=20260812w','sidebar-viewport-stability-20260812.js?v=20260812y'"
          if 'sidebar-viewport-stability-20260812.js' not in s:
              if old not in s:
                  raise SystemExit('Could not find app-shell-polish loader anchor')
              s=s.replace(old,new)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text().replace('20260812x','20260812y')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check sidebar-viewport-stability-20260812.js
          grep -q "VOLLEY_ASSET_VERSION = '20260812y'" supabase-config.js
          grep -q "sidebar-viewport-stability-20260812.js?v=20260812y" supabase-config.js
          grep -q "supabase-config.js?v=20260812y" index.html
          git diff --check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Publish sidebar viewport stability" || true
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-sidebar-stability-20260812.yml
          git commit -m "Remove sidebar stability workflow"
          git push
