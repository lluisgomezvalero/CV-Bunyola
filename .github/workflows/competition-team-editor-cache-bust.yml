name: Publish competition team editor UX

on:
  push:
    paths:
      - '.github/workflows/competition-team-editor-cache-bust.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load competition editor UX and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          needle="  'competition-admin-reset-guard-20260820.js?v=20260820b',\n"
          line="  'competition-team-editor-ux-20260820.js?v=20260820a',\n"
          if line not in s:
              s=s.replace(needle, needle+line)
          p.write_text(s)
          PY
          sed -i 's/supabase-config.js?v=20260820safe25/supabase-config.js?v=20260820safe26/g' index.html
          rm -f .github/workflows/competition-team-editor-cache-bust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html .github/workflows/competition-team-editor-cache-bust.yml
          git commit -m "Publish competition rival editor UX"
          git push