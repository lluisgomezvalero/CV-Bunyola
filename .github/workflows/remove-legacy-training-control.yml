name: Remove legacy training control

on:
  push:
    paths:
      - '.github/workflows/remove-legacy-training-control.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate training control route and view
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          legacy_label = 'VIEW: CONTROL DE ENTRENOS (ADMIN/COACH)'
          next_label = 'MÓDULO: OBJETIVOS SEMANALES'
          legacy_pos = html.find(legacy_label)
          next_pos = html.find(next_label, legacy_pos + 1)
          if legacy_pos < 0 or next_pos < 0:
              raise SystemExit('Could not locate legacy attendance view boundaries')
          start = html.rfind('<!--', 0, legacy_pos)
          end = html.rfind('<!--', 0, next_pos)
          if start < 0 or end <= start:
              raise SystemExit('Invalid legacy attendance view boundaries')

          html_new = html[:start] + html[end:]
          html_new = html_new.replace('styles.css?v=20260812d', 'styles.css?v=20260812e')
          html_new = html_new.replace('supabase-config.js?v=20260812d', 'supabase-config.js?v=20260812e')
          html_new = html_new.replace('supabase-client.js?v=20260812d', 'supabase-client.js?v=20260812e')
          html_new = html_new.replace('data.js?v=20260812d', 'data.js?v=20260812e')
          html_new = html_new.replace('app.js?v=20260812d', 'app.js?v=20260812e')
          index.write_text(html_new, encoding='utf-8')

          app = Path('app.js')
          js = app.read_text(encoding='utf-8')
          js = js.replace('  "coach-attendance":"Asistencia", goals:"Objetivos", planning:"Planificación", fitness:"Rendimiento"',
                          '  goals:"Objetivos", planning:"Planificación", fitness:"Rendimiento"')
          old_guard = '  const coachOnlyModules = new Set(["users", "fitness", "coach-attendance", "planning"]);'
          new_guard = '  if (moduleName === "coach-attendance") moduleName = "training";\n  const coachOnlyModules = new Set(["users", "fitness", "planning"]);'
          if old_guard not in js:
              raise SystemExit('Could not locate coach module guard')
          js = js.replace(old_guard, new_guard, 1)
          old_route = '  } else if (moduleName === "coach-attendance") {\n    renderCoachAttendanceList();'
          if old_route not in js:
              raise SystemExit('Could not locate legacy coach attendance route')
          js = js.replace(old_route, '', 1)
          js = re.sub(r'\n\s*setMeta\("coach-attendance",[^\n]+\);', '', js, count=1)
          app.write_text(js, encoding='utf-8')

          config = Path('supabase-config.js')
          cfg = config.read_text(encoding='utf-8')
          old_version = "window.VOLLEY_ASSET_VERSION = '20260812d';"
          if old_version not in cfg:
              raise SystemExit('Expected cache version 20260812d not found')
          cfg = cfg.replace(old_version, "window.VOLLEY_ASSET_VERSION = '20260812e';", 1)
          config.write_text(cfg, encoding='utf-8')

          if 'id="view-coach-attendance"' in html_new:
              raise SystemExit('Legacy coach attendance view still exists')
          if 'setMeta("coach-attendance"' in js:
              raise SystemExit('Legacy coach attendance metadata still exists')
          if 'else if (moduleName === "coach-attendance")' in js:
              raise SystemExit('Legacy coach attendance render route still exists')
          if 'if (moduleName === "coach-attendance") moduleName = "training";' not in js:
              raise SystemExit('Compatibility redirect is missing')
          PY

      - name: Validate JavaScript and cache version
        run: |
          node --check app.js
          grep -q "VOLLEY_ASSET_VERSION = '20260812e'" supabase-config.js
          grep -q "app.js?v=20260812e" index.html
          ! grep -q 'id="view-coach-attendance"' index.html

      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-legacy-training-control.yml
          git add index.html app.js supabase-config.js
          git commit -m "Retire duplicate training control screen"
          git push
