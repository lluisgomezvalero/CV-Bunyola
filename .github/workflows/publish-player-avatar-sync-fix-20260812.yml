name: Publish player avatar sync fix
on:
  push:
    paths:
      - '.github/workflows/publish-player-avatar-sync-fix-20260812.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump avatar sync cache
        run: |
          python - <<'PY'
          from pathlib import Path
          cfg=Path('supabase-config.js')
          s=cfg.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260812s';","window.VOLLEY_ASSET_VERSION = '20260812t';")
          s=s.replace('player-avatar-authoritative-20260812.js?v=20260812s','player-avatar-authoritative-20260812.js?v=20260812t')
          cfg.write_text(s)
          idx=Path('index.html')
          t=idx.read_text()
          t=t.replace('?v=20260812s','?v=20260812t')
          idx.write_text(t)
          PY
      - name: Validate
        run: |
          node --check player-avatar-authoritative-20260812.js
          node --check app.js
          grep -q "VOLLEY_ASSET_VERSION = '20260812t'" supabase-config.js
          grep -q 'player-avatar-authoritative-20260812.js?v=20260812t' supabase-config.js
          grep -q 'styles.css?v=20260812t' index.html
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-player-avatar-sync-fix-20260812.yml
          git add supabase-config.js index.html player-avatar-authoritative-20260812.js
          git commit -m 'Fix synchronized roster avatar uploads' || exit 0
          git push
