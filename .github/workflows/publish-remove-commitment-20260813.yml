name: Publish player passport commitment cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-remove-commitment-20260813.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loader and cache
        run: |
          python - <<'PY'
          from pathlib import Path
          cfg = Path('supabase-config.js')
          text = cfg.read_text()
          text = text.replace("window.VOLLEY_ASSET_VERSION = '20260813e';", "window.VOLLEY_ASSET_VERSION = '20260813f';")
          needle = "'player-wellness-summary-20260813.js?v=20260813e'"
          addition = needle + ", 'player-passport-remove-commitment-20260813.js?v=20260813f'"
          if 'player-passport-remove-commitment-20260813.js' not in text:
              if needle not in text:
                  raise SystemExit('Loader anchor not found')
              text = text.replace(needle, addition)
          cfg.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('v=20260813e', 'v=20260813f')
          index.write_text(html)
          PY
      - name: Validate
        run: |
          node --check player-passport-remove-commitment-20260813.js
          node --check supabase-config.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Publish player passport commitment cleanup"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-remove-commitment-20260813.yml
          git commit -m "Remove player passport commitment workflow"
          git push
