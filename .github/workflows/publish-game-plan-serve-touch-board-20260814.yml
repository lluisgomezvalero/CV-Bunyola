name: Publish mobile serve touch board
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-serve-touch-board-20260814.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load touch board and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260814r';", "window.VOLLEY_ASSET_VERSION = '20260814s';")
          entry="'game-plan-serve-touch-board-20260814.js?v=20260814s'"
          if entry not in s:
              s=s.replace("];scripts.forEach", ","+entry+"];scripts.forEach")
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          for name in ['supabase-config.js','supabase-client.js','data.js','app.js']:
              s=s.replace(f'{name}?v=20260814r', f'{name}?v=20260814s')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check game-plan-serve-touch-board-20260814.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Load mobile serve touch board"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-serve-touch-board-20260814.yml
          git commit -m "Remove temporary serve touch publish workflow"
          git push
