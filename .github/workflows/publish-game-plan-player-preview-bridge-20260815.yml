name: Publish game plan player preview bridge
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-player-preview-bridge-20260815.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load bridge and refresh cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260815a';","window.VOLLEY_ASSET_VERSION = '20260815b';")
          needle="'game-plan-player-our-serve-view-20260815.js?v=20260815a'"
          repl=needle+",'game-plan-player-preview-bridge-20260815.js?v=20260815b'"
          if 'game-plan-player-preview-bridge-20260815.js' not in s:
              s=s.replace(needle,repl)
          p.write_text(s)
          i=Path('index.html')
          x=i.read_text()
          for f in ['supabase-config.js','supabase-client.js','data.js','app.js']:
              import re
              x=re.sub(rf'({re.escape(f)}\?v=)[^"\']+',rf'\g<1>20260815b',x)
          i.write_text(x)
          PY
      - name: Validate JavaScript
        run: |
          node --check game-plan-player-preview-bridge-20260815.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Load player preview bridge"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-player-preview-bridge-20260815.yml
          git commit -m "Remove temporary player preview publish workflow"
          git push
