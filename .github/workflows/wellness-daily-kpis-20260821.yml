name: Apply daily wellness KPI labels

on:
  push:
    paths:
      - '.github/workflows/wellness-daily-kpis-20260821.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update coach wellness KPIs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('wellness-unified-mobile-20260820.js')
          text = path.read_text()
          old = "function coachQuickData(){const rows=logs();const week=rows.filter(r=>inCurrentWeek(dateKey(r)));const fatigue=mean(week.map(fatigueValue));const rpe=latestTeamRpe();const alerts=document.querySelectorAll('#view-wellness .load-alert').length;return{fatigue,rpe,responses:week.length,alerts};}"
          new = "function coachQuickData(){const rows=logs();const today=typeof getLocalDateKey==='function'?getLocalDateKey():new Date().toLocaleDateString('en-CA');const daily=rows.filter(r=>dateKey(r)===today);const fatigue=mean(daily.map(fatigueValue));const rpe=latestTeamRpe();const alerts=document.querySelectorAll('#view-wellness .load-alert').length;return{fatigue,rpe,responses:daily.length,alerts};}"
          if old not in text:
              raise SystemExit('coachQuickData pattern not found')
          text = text.replace(old, new, 1)
          old2 = "['heart-pulse','Fatiga media',d.fatigue==null?'—':`${d.fatigue.toFixed(1)}/5`,d.fatigue!=null&&d.fatigue>=4?'attn':d.fatigue!=null&&d.fatigue>=3?'warm':'good'],['activity','Último RPE',d.rpe==null?'—':d.rpe.toFixed(1),d.rpe!=null&&d.rpe>=8?'attn':d.rpe!=null&&d.rpe>=6?'warm':''],['users','Respuestas',String(d.responses),''],['shield-check','Alertas',String(d.alerts),d.alerts?'attn':'good']"
          new2 = "['heart-pulse','Fatiga hoy',d.fatigue==null?'—':`${d.fatigue.toFixed(1)}/5`,d.fatigue!=null&&d.fatigue>=4?'attn':d.fatigue!=null&&d.fatigue>=3?'warm':'good'],['activity','Último RPE',d.rpe==null?'—':d.rpe.toFixed(1),d.rpe!=null&&d.rpe>=8?'attn':d.rpe!=null&&d.rpe>=6?'warm':''],['users','Respuestas hoy',String(d.responses),''],['shield-check','Alertas carga',String(d.alerts),d.alerts?'attn':'good']"
          if old2 not in text:
              raise SystemExit('KPI labels pattern not found')
          text = text.replace(old2, new2, 1)
          path.write_text(text)

          cfg = Path('supabase-config.js')
          c = cfg.read_text()
          c = c.replace("window.VOLLEY_ASSET_VERSION = '20260821a';", "window.VOLLEY_ASSET_VERSION = '20260821b';", 1)
          c = c.replace("wellness-unified-mobile-20260820.js?v=20260821a", "wellness-unified-mobile-20260820.js?v=20260821b", 1)
          cfg.write_text(c)

          idx = Path('index.html')
          i = idx.read_text()
          i = i.replace('supabase-config.js?v=20260821a', 'supabase-config.js?v=20260821b', 1)
          idx.write_text(i)
          PY
          rm .github/workflows/wellness-daily-kpis-20260821.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wellness-unified-mobile-20260820.js supabase-config.js index.html .github/workflows/wellness-daily-kpis-20260821.yml
          git commit -m "Show daily wellness KPIs"
          git push
