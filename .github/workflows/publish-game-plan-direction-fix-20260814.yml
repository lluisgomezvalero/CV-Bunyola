name: Publish game plan direction correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-game-plan-direction-fix-20260814.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh page cache version
        run: |
          sed -i 's/20260814f/20260814g/g' index.html
      - name: Validate JavaScript
        run: |
          node --check game-plan-direction-input-fix-20260814.js
          node --check game-plan-visual-simplify-20260814.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish corrected attack directions' || true
      - name: Remove workflow
        run: |
          git rm .github/workflows/publish-game-plan-direction-fix-20260814.yml
          git commit -m 'Remove temporary game plan direction workflow'
          git push
