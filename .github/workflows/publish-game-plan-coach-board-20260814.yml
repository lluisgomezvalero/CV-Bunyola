name: Publish coach tactical board UX
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-coach-board-20260814.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh page cache version
        run: |
          sed -i 's/?v=20260814j/?v=20260814k/g' index.html
      - name: Validate JavaScript
        run: |
          node --check game-plan-coach-board-20260814.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh cache for coach tactical board UX"
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/publish-game-plan-coach-board-20260814.yml
          git commit -m "Remove temporary coach board publish workflow"
          git push
