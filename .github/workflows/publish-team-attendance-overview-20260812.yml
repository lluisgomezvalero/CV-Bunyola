name: Publish team attendance overview

on:
  push:
    paths:
      - '.github/workflows/publish-team-attendance-overview-20260812.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate attendance overview
        run: |
          node --check team-attendance-overview-20260812.js
          grep -q "team-attendance-overview-20260812.js?v=20260812p" supabase-config.js
      - name: Bump root cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '20260812o' not in s:
              raise SystemExit('index cache marker 20260812o not found')
          s=s.replace('20260812o','20260812p')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and self-remove
        run: |
          rm .github/workflows/publish-team-attendance-overview-20260812.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html supabase-config.js team-attendance-overview-20260812.js .github/workflows/publish-team-attendance-overview-20260812.yml
          git commit -m "Publish team attendance overview"
          git push
