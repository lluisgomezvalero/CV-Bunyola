name: Publish game plan UX improvements
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-ux-20260814.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh page cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          for name in ('supabase-config.js','supabase-client.js','data.js','app.js'):
              s=s.replace(f'{name}?v=20260814c', f'{name}?v=20260814d')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check game-plan-ux-20260814.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh game plan UX cache"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-ux-20260814.yml
          git commit -m "Remove game plan UX publish workflow"
          git push
