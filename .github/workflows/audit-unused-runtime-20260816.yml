name: Audit unused runtime files
on:
  push:
    paths:
      - '.github/workflows/audit-unused-runtime-20260816.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Find unreferenced root JS and CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          source_ext = {'.html','.js','.css'}
          sources = [p for p in root.iterdir() if p.is_file() and p.suffix in source_ext]
          candidates = [p for p in root.iterdir() if p.is_file() and p.suffix in {'.js','.css'}]

          print('=== UNREFERENCED ROOT RUNTIME CANDIDATES ===')
          for candidate in sorted(candidates, key=lambda p: p.name):
              refs = []
              for source in sources:
                  if source == candidate:
                      continue
                  try:
                      text = source.read_text(errors='ignore')
                  except Exception:
                      continue
                  if candidate.name in text:
                      refs.append(source.name)
              if not refs:
                  print(f'{candidate.name}\t{candidate.stat().st_size} bytes')

          print('\n=== CURRENT DYNAMIC LOADER ===')
          cfg = Path('supabase-config.js').read_text(errors='ignore')
          start = cfg.find("const scripts=[")
          end = cfg.find("];scripts.forEach", start)
          print(cfg[start:end+1] if start >= 0 and end >= 0 else 'loader not found')
          PY
      - name: Remove audit workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-unused-runtime-20260816.yml
          git commit -m "Remove temporary runtime audit workflow"
          git push
