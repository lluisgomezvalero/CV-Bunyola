name: Publish game plan read compact
on:
  push:
    branches: [main]
    paths:
      - 'game-plan-read-tracker-compact-20260814.js'
      - '.github/workflows/publish-game-plan-read-compact-20260814.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh app cache and load compact tracker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260814p';", "window.VOLLEY_ASSET_VERSION = '20260814q';")
          needle="'match-opponent-legacy-repair-20260814.js?v=20260814p'"
          addition=needle+",'game-plan-read-tracker-compact-20260814.js?v=20260814q'"
          if "game-plan-read-tracker-compact-20260814.js" not in s:
              s=s.replace(needle,addition)
          p.write_text(s)
          ip=Path('index.html')
          if ip.exists():
              t=ip.read_text().replace('20260814p','20260814q')
              ip.write_text(t)
          PY
      - name: Validate JavaScript
        run: |
          node --check game-plan-read-tracker-compact-20260814.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Publish compact game plan read tracker"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-read-compact-20260814.yml
          git commit -m "Remove temporary compact read tracker workflow"
          git push
