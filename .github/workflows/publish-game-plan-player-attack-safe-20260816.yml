name: Publish safe player attack view
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-player-attack-safe-20260816.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load player attack CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          link='  <link rel="stylesheet" href="game-plan-player-attack-safe-20260816.css?v=20260816d">\n'
          if 'game-plan-player-attack-safe-20260816.css' not in s:
              marker='  <link rel="stylesheet" href="game-plan-actions-safe-20260816.css?v=20260816d">\n'
              if marker not in s:
                  raise SystemExit('safe actions CSS marker not found')
              s=s.replace(marker, marker+link)
          p.write_text(s)
          PY
      - name: Validate publish
        run: |
          test -s game-plan-player-attack-safe-20260816.css
          grep -q 'game-plan-player-attack-safe-20260816.css?v=20260816d' index.html
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html game-plan-player-attack-safe-20260816.css
          git diff --cached --quiet || git commit -m "Publish safe player attack view"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-player-attack-safe-20260816.yml
          git commit -m "Remove temporary player attack workflow"
          git push
