name: Publish home callup status cache refresh

on:
  push:
    paths:
      - '.github/workflows/publish-home-callup-status-20260814.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh page cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          for old in ['20260813s','20260814a']:
              s = s.replace(f'supabase-config.js?v={old}', 'supabase-config.js?v=20260814b')
              s = s.replace(f'supabase-client.js?v={old}', 'supabase-client.js?v=20260814b')
              s = s.replace(f'data.js?v={old}', 'data.js?v=20260814b')
              s = s.replace(f'app.js?v={old}', 'app.js?v=20260814b')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check match-callup-card-status-20260814.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "lluisgomezvalero"
          git config user.email "lluisgomez5@gmail.com"
          git add index.html supabase-config.js match-callup-card-status-20260814.js
          git rm .github/workflows/publish-home-callup-status-20260814.yml
          git commit -m "Show callup status on home match card" || true
          git push