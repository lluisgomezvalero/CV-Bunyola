name: Publish mobile training app polish

on:
  push:
    paths:
      - '.github/workflows/training-mobile-app-cache-bust.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load training polish and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          needle="  'team-attendance-overview-20260812.js?v=20260812p',\n"
          line="  'training-mobile-app-ux-20260820.js?v=20260820a',\n"
          if line not in s:
              s=s.replace(needle, needle+line)
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260820s'", "window.VOLLEY_ASSET_VERSION = '20260820t'")
          p.write_text(s)
          PY
          sed -i 's/supabase-config.js?v=20260820safe34/supabase-config.js?v=20260820safe35/g' index.html
          rm -f .github/workflows/training-mobile-app-cache-bust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html .github/workflows/training-mobile-app-cache-bust.yml
          git commit -m "Publish mobile training app polish"
          git push
