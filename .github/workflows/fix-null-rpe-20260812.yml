name: Fix null RPE rendering
on:
  push:
    paths:
      - '.github/workflows/fix-null-rpe-20260812.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch null RPE handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app.js')
          text=app.read_text()
          old="  const hasValue = Number.isFinite(Number(selectedValue));"
          new="  const hasValue = selectedValue !== null && selectedValue !== undefined && String(selectedValue).trim() !== '' && Number.isFinite(Number(selectedValue));"
          if text.count(old)!=1:
              raise SystemExit(f'Unexpected hasValue count: {text.count(old)}')
          app.write_text(text.replace(old,new,1))

          cfg=Path('supabase-config.js')
          c=cfg.read_text()
          if "window.VOLLEY_ASSET_VERSION = '20260812u';" not in c:
              raise SystemExit('Expected cache u not found')
          c=c.replace("window.VOLLEY_ASSET_VERSION = '20260812u';","window.VOLLEY_ASSET_VERSION = '20260812v';",1)
          cfg.write_text(c)

          idx=Path('index.html')
          i=idx.read_text()
          for name in ['styles.css','supabase-config.js','supabase-client.js','data.js','app.js']:
              i=i.replace(f'{name}?v=20260812u',f'{name}?v=20260812v')
          idx.write_text(i)
          PY
      - name: Validate
        run: |
          node --check app.js
          node --check supabase-config.js
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text()
          cfg=Path('supabase-config.js').read_text()
          idx=Path('index.html').read_text()
          assert "selectedValue !== null && selectedValue !== undefined" in app
          assert "20260812v" in cfg
          assert "app.js?v=20260812v" in idx
          PY
          git diff --check
      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js supabase-config.js index.html
          git commit -m "Keep same-day unanswered RPE open"
          git rm .github/workflows/fix-null-rpe-20260812.yml
          git commit -m "Remove null RPE fix workflow"
          git push
