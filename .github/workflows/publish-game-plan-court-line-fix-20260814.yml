name: Publish game plan court line fix
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-court-line-fix-20260814.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh page cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('?v=20260814i','?v=20260814j')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check game-plan-court-line-fix-20260814.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh game plan court line fix cache"
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/publish-game-plan-court-line-fix-20260814.yml
          git commit -m "Remove temporary court line publish workflow"
          git push
