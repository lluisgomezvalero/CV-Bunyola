name: One-time wellness chart layout cache bump
on:
  push:
    branches:
      - fix/wellness-chart-initial-layout
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wellness-chart-initial-layout
      - name: Bump wellness chart assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260821d';","window.VOLLEY_ASSET_VERSION = '20260821e';")
          s=s.replace("wellness-chart-stability-20260821.js?v=20260821b","wellness-chart-stability-20260821.js?v=20260821c")
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text().replace('supabase-config.js?v=20260821safe54','supabase-config.js?v=20260821safe55')
          p.write_text(s)
          Path('.github/workflows/one-time-wellness-chart-layout.yml').unlink()
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply wellness chart stable-layout cache bump"
          git push origin HEAD:fix/wellness-chart-initial-layout
