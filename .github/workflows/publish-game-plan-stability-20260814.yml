name: Publish stable game plan sync
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-stability-20260814.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh game plan asset version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260814b';", "window.VOLLEY_ASSET_VERSION = '20260814c';")
          s=s.replace("game-plan-authoritative-20260809.js?v=20260810n", "game-plan-authoritative-20260809.js?v=20260814c")
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          for name in ('supabase-config.js','supabase-client.js','data.js','app.js'):
              s=s.replace(f'{name}?v=20260814b', f'{name}?v=20260814c')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check game-plan-authoritative-20260809.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Refresh game plan sync cache"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-stability-20260814.yml
          git commit -m "Remove game plan publish workflow"
          git push
