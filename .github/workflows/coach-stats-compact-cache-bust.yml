name: Refresh compact coach statistics

on:
  push:
    paths:
      - '.github/workflows/coach-stats-compact-cache-bust.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh compact coach statistics assets
        run: |
          sed -i "s/window.VOLLEY_ASSET_VERSION = '20260819l'/window.VOLLEY_ASSET_VERSION = '20260819m'/g" supabase-config.js
          sed -i "s/match-statistics-coach-app-ux-20260819.js?v=20260819a/match-statistics-coach-app-ux-20260819.js?v=20260819b/g" supabase-config.js
          sed -i 's/supabase-config.js?v=20260819safe10/supabase-config.js?v=20260819safe11/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          if git diff --cached --quiet; then
            echo "No cache change needed"
          else
            git commit -m "Refresh compact coach statistics assets"
            git push
          fi
