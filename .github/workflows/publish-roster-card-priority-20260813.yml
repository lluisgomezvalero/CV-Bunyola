name: Publish roster card priority
on:
  push:
    paths:
      - '.github/workflows/publish-roster-card-priority-20260813.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch config and cache version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path('supabase-config.js')
          text = config.read_text()
          old = "window.VOLLEY_ASSET_VERSION = '20260812y';"
          new = "window.VOLLEY_ASSET_VERSION = '20260813a';"
          if old not in text:
              raise SystemExit('Expected asset version 20260812y not found')
          text = text.replace(old, new, 1)

          anchor = "'player-avatar-authoritative-20260812.js?v=20260812x','attendance-authoritative-20260809.js?v=20260812f'"
          replacement = "'player-avatar-authoritative-20260812.js?v=20260812x','roster-card-priority-20260813.js?v=20260813a','attendance-authoritative-20260809.js?v=20260812f'"
          if anchor not in text:
              raise SystemExit('Roster script insertion anchor not found')
          text = text.replace(anchor, replacement, 1)
          config.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          if '?v=20260812y' not in html:
              raise SystemExit('Expected root cache version 20260812y not found in index.html')
          html = html.replace('?v=20260812y', '?v=20260813a')
          index.write_text(html)
          PY
      - name: Validate
        run: |
          node --check roster-card-priority-20260813.js
          git diff --check
          grep -q "roster-card-priority-20260813.js?v=20260813a" supabase-config.js
          grep -q "supabase-config.js?v=20260813a" index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Publish roster card priority" || true
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-roster-card-priority-20260813.yml
          git commit -m "Remove roster card publish workflow"
          git push
