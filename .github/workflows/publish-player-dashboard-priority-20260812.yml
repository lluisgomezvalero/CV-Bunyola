name: Publish player dashboard priority

on:
  push:
    paths:
      - '.github/workflows/publish-player-dashboard-priority-20260812.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate player dashboard
        run: node --check player-dashboard-priority-20260812.js
      - name: Publish cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          cfg=Path('supabase-config.js')
          s=cfg.read_text(encoding='utf-8')
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260812p';","window.VOLLEY_ASSET_VERSION = '20260812q';",1)
          needle="'dashboard-home-priority-20260812.js?v=20260812o','wellness-v2-20260811.js?v=20260811n'"
          repl="'dashboard-home-priority-20260812.js?v=20260812o','player-dashboard-priority-20260812.js?v=20260812q','wellness-v2-20260811.js?v=20260811n'"
          if needle not in s:
              raise SystemExit('script insertion marker not found')
          s=s.replace(needle,repl,1)
          cfg.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('?v=20260812p','?v=20260812q')
          idx.write_text(h,encoding='utf-8')
          PY
          node --check supabase-config.js
      - name: Commit and self-remove
        run: |
          rm .github/workflows/publish-player-dashboard-priority-20260812.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-dashboard-priority-20260812.js supabase-config.js index.html .github/workflows/publish-player-dashboard-priority-20260812.yml
          git commit -m "Simplify player home dashboard"
          git push
