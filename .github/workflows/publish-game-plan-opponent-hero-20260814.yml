name: Publish selected opponent game plan header
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-opponent-hero-20260814.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh game plan cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260814m';","window.VOLLEY_ASSET_VERSION = '20260814n';")
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          for name in ['supabase-config.js','supabase-client.js','data.js','app.js']:
              s=s.replace(f'{name}?v=20260814m',f'{name}?v=20260814n')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check game-plan-opponent-hero-fix-20260814.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html supabase-config.js
          git diff --cached --quiet || git commit -m "Publish selected opponent game plan header"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-opponent-hero-20260814.yml
          git commit -m "Remove temporary opponent header publish workflow"
          git push
