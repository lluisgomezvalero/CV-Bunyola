name: Publish admin reset visibility fix

on:
  push:
    paths:
      - '.github/workflows/competition-admin-reset-visibility-cache-bust.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh admin reset guard assets
        run: |
          sed -i "s/window.VOLLEY_ASSET_VERSION = '20260820j'/window.VOLLEY_ASSET_VERSION = '20260820k'/g" supabase-config.js
          sed -i 's/competition-admin-reset-guard-20260820.js?v=20260820a/competition-admin-reset-guard-20260820.js?v=20260820b/g' supabase-config.js
          sed -i 's/supabase-config.js?v=20260820safe24/supabase-config.js?v=20260820safe25/g' index.html
          rm -f .github/workflows/competition-admin-reset-visibility-cache-bust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html .github/workflows/competition-admin-reset-visibility-cache-bust.yml
          git commit -m "Publish administrator reset visibility fix"
          git push
