name: Validate canonical game plan
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-canonical-game-plan-20260817.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh cache and validate
        run: |
          set -euo pipefail
          sed -E -i 's#supabase-config\.js\?v=[A-Za-z0-9_-]+#supabase-config.js?v=20260817d#g' index.html
          node --check game-plan-canonical-20260817.js
          node --check supabase-config.js
          test "$(grep -oE "game-plan-[^']+\.js" supabase-config.js | wc -l)" -eq 1
          grep -q "game-plan-canonical-20260817.js?v=20260817d" supabase-config.js
          ! grep -q "game-plan-authoritative-20260809.js" supabase-config.js
          ! grep -q "game-plan-coach-attack-tabs-20260816.js" supabase-config.js
      - name: Commit cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Activate canonical game plan runtime"
            git push
          fi
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/validate-canonical-game-plan-20260817.yml
          git commit -m "Remove temporary canonical game plan workflow"
          git push
