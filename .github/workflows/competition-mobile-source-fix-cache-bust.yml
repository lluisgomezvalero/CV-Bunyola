name: Refresh competition mobile source fix

on:
  push:
    paths:
      - '.github/workflows/competition-mobile-source-fix-cache-bust.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh competition mobile source fix assets
        run: |
          sed -i "s/window.VOLLEY_ASSET_VERSION = '20260820d'/window.VOLLEY_ASSET_VERSION = '20260820e'/g" supabase-config.js
          sed -i "/competition-app-ux-20260820.js?v=20260820a/a\\  'competition-mobile-list-source-fix-20260820.js?v=20260820a'," supabase-config.js
          sed -i 's/supabase-config.js?v=20260820safe17/supabase-config.js?v=20260820safe18/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          if git diff --cached --quiet; then
            echo "No cache change needed"
          else
            git commit -m "Refresh competition mobile source fix assets"
            git push
          fi
