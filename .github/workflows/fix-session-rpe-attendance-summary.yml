name: Fix session RPE and attendance summary

on:
  push:
    paths:
      - '.github/workflows/fix-session-rpe-attendance-summary.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch session summaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          js = app.read_text(encoding='utf-8')

          rpe_pattern = re.compile(r"function getTrainingRpeSummary\(eventId\) \{.*?\n\}\n\n(?=function renderRpeScale)", re.S)
          rpe_new = '''function getTrainingRpeSummary(eventId) {
            const matchesEvent = record => [
              record?.eventId,
              record?.eventIdLegacy,
              record?.supabaseEventId,
              record?.event_id,
              record?.trainingId,
              record?.sessionId
            ].filter(Boolean).some(id => isSameEventId(id, eventId));
            const records = (appState.trainingRPEs || []).filter(record =>
              matchesEvent(record) && Number.isFinite(Number(record?.rpeVal))
            );
            const average = records.length ? records.reduce((sum, record) => sum + Number(record.rpeVal), 0) / records.length : null;
            return { records, average, count: records.length };
          }

          '''
          js, count = rpe_pattern.subn(rpe_new, js, count=1)
          if count != 1:
              raise SystemExit(f'Expected one getTrainingRpeSummary block, changed {count}')

          att_pattern = re.compile(r"function getSessionAttendanceSummary\(eventId\) \{.*?\n\}\n\n(?=function escapeSessionText)", re.S)
          att_new = '''function getSessionAttendanceSummary(eventId) {
            const matchesEvent = record => [
              record?.eventId,
              record?.eventIdLegacy,
              record?.supabaseEventId,
              record?.event_id
            ].filter(Boolean).some(id => isSameEventId(id, eventId));
            const confirmations = (appState.trainingConfirmations || []).filter(matchesEvent);
            const actual = (appState.attendanceData || []).filter(matchesEvent);
            return {
              confirmations,
              yes: confirmations.filter(c=>c.status==='yes').length,
              no: confirmations.filter(c=>c.status==='no').length,
              pending: Math.max(0, (appState.players || []).length - confirmations.length),
              actual
            };
          }

          '''
          js, count = att_pattern.subn(att_new, js, count=1)
          if count != 1:
              raise SystemExit(f'Expected one getSessionAttendanceSummary block, changed {count}')

          old_card = '''  } else {
            const yes=confirmations.filter(c=>c.status==='yes').length, no=confirmations.filter(c=>c.status==='no').length;
            attendance=`<div class="training-coach-actions"><span><strong>${yes}</strong> sí · <strong>${no}</strong> bajas</span><button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); openVerifyAttendanceModal('${tr.id}')"><i data-lucide="clipboard-check"></i> Pasar lista</button></div>`;
          }'''
          new_card = '''  } else {
            const attendanceSummary=getSessionAttendanceSummary(tr.id);
            const official=attendanceSummary.actual||[];
            const officialPresent=official.filter(row=>['present','attended','late'].includes(String(row.status||'').toLowerCase())).length;
            const officialAbsent=official.filter(row=>['justified','unjustified','absent','missed'].includes(String(row.status||'').toLowerCase())).length;
            if(official.length){
              attendance=`<div class="training-coach-actions"><span><strong>${officialPresent}</strong> presentes · <strong>${officialAbsent}</strong> ausencias · <strong>${official.length}</strong> validadas</span><button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); openVerifyAttendanceModal('${tr.id}')"><i data-lucide="clipboard-check"></i> Revisar lista</button></div>`;
            } else {
              const yes=attendanceSummary.yes, no=attendanceSummary.no;
              attendance=`<div class="training-coach-actions"><span><strong>${yes}</strong> sí · <strong>${no}</strong> bajas</span><button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); openVerifyAttendanceModal('${tr.id}')"><i data-lucide="clipboard-check"></i> Pasar lista</button></div>`;
            }
          }'''
          if old_card not in js:
              raise SystemExit('Training card coach attendance block not found')
          js = js.replace(old_card, new_card, 1)

          old_dashboard_vars = '''  const confirmations = (appState.trainingConfirmations || []).filter(c => nextTraining && isSameEventId(c.eventId, nextTraining.id));
            const yes = confirmations.filter(c => c.status === "yes").length;
            const no = confirmations.filter(c => c.status === "no").length;
            const pending = Math.max(0, (appState.players || []).length - yes - no);'''
          if old_dashboard_vars not in js:
              old_dashboard_vars = '''  const confirmations = (appState.trainingConfirmations || []).filter(c => nextTraining && isSameEventId(c.eventId, nextTraining.id));
          const yes = confirmations.filter(c => c.status === "yes").length;
          const no = confirmations.filter(c => c.status === "no").length;
          const pending = Math.max(0, (appState.players || []).length - yes - no);'''
          new_dashboard_vars = '''  const nextAttendanceSummary = nextTraining ? getSessionAttendanceSummary(nextTraining.id) : {confirmations:[],actual:[],yes:0,no:0,pending:(appState.players||[]).length};
          const confirmations = nextAttendanceSummary.confirmations || [];
          const yes = nextAttendanceSummary.yes || 0;
          const no = nextAttendanceSummary.no || 0;
          const pending = nextAttendanceSummary.pending ?? Math.max(0, (appState.players || []).length - yes - no);
          const officialNext = nextAttendanceSummary.actual || [];
          const officialNextPresent = officialNext.filter(row=>['present','attended','late'].includes(String(row.status||'').toLowerCase())).length;
          const officialNextAbsent = officialNext.filter(row=>['justified','unjustified','absent','missed'].includes(String(row.status||'').toLowerCase())).length;'''
          if old_dashboard_vars not in js:
              raise SystemExit('Dashboard attendance variables block not found')
          js = js.replace(old_dashboard_vars, new_dashboard_vars, 1)

          old_metrics = '''${coach && nextTraining ? `<div class="dashboard-metrics"><span><b>${yes}</b> confirmadas</span><span><b>${no}</b> bajas</span><span><b>${pending}</b> pendientes</span></div>` : ''}'''
          new_metrics = '''${coach && nextTraining ? (officialNext.length
            ? `<div class="dashboard-metrics"><span><b>${officialNextPresent}</b> presentes</span><span><b>${officialNextAbsent}</b> ausencias</span><span><b>${officialNext.length}</b> validadas</span></div>`
            : `<div class="dashboard-metrics"><span><b>${yes}</b> confirmadas</span><span><b>${no}</b> bajas</span><span><b>${pending}</b> pendientes</span></div>`) : ''}'''
          if old_metrics not in js:
              raise SystemExit('Dashboard metrics template not found')
          js = js.replace(old_metrics, new_metrics, 1)

          old_participation_end = '''      <button class="btn btn-outline btn-sm btn-block" onclick="openVerifyAttendanceModal('${session.id}')"><i data-lucide="clipboard-check"></i> ${finished?'Revisar asistencia':active?'Pasar lista':'Gestionar asistencia'}</button>
            </section>`;
          } else if (playerId) {'''
          new_participation_end = '''      <button class="btn btn-outline btn-sm btn-block" onclick="openVerifyAttendanceModal('${session.id}')"><i data-lucide="clipboard-check"></i> ${finished?'Revisar asistencia':active?'Pasar lista':'Gestionar asistencia'}</button>
            </section>`;
            if (!finished) {
              participationHtml += `<section class="session-panel session-panel-wide"><div class="session-panel-title"><i data-lucide="activity"></i><div><span>Control del entrenador</span><h3>RPE del entrenador</h3></div></div><div class="training-rpe-panel"><div class="training-rpe-heading"><div><span>Tu exigencia prevista/percibida</span><strong>${coachRpe===null?'Sin valorar':coachRpe+'/10'}</strong></div><div><span>Media jugadoras</span><strong>${rpe.average===null?'Sin respuestas':rpe.average.toFixed(1)+'/10'}</strong><small>${rpe.count} respuesta${rpe.count===1?'':'s'}</small></div></div>${renderRpeScale(session.id,coachRpe,'coach')}</div></section>`;
            }
          } else if (playerId) {'''
          if old_participation_end not in js:
              raise SystemExit('Coach participation end block not found')
          js = js.replace(old_participation_end, new_participation_end, 1)

          app.write_text(js, encoding='utf-8')

          rpe = Path('rpe-authoritative-20260810.js')
          rjs = rpe.read_text(encoding='utf-8')
          rjs = rjs.replace("if(!opts.silent){call('renderTraining');call('renderHomeDashboard');call('renderTeamRpeSummary');}", "if(!opts.silent){call('renderTraining');call('renderHomeDashboard');call('renderTeamRpeSummary');call('renderSessionCenterDetail');}", 1)
          rjs = rjs.replace("await load({silent:true});call('renderTraining');call('renderHomeDashboard');setTimeout(paintPendingNotice,0);", "await load({silent:true});call('renderTraining');call('renderHomeDashboard');call('renderSessionCenterDetail');setTimeout(paintPendingNotice,0);", 1)
          rjs = rjs.replace("await load({silent:true});call('renderTraining');call('renderHomeDashboard');showToast?.(`Valoración registrada: ${score}/10`);", "await load({silent:true});call('renderTraining');call('renderHomeDashboard');call('renderSessionCenterDetail');showToast?.(`Valoración registrada: ${score}/10`);", 1)
          rjs = rjs.replace("await load({silent:true});call('renderTraining');call('renderTeamRpeSummary');showToast?.('RPE añadido correctamente.');", "await load({silent:true});call('renderTraining');call('renderTeamRpeSummary');call('renderSessionCenterDetail');showToast?.('RPE añadido correctamente.');", 1)
          rpe.write_text(rjs, encoding='utf-8')

          cfg = Path('supabase-config.js')
          c = cfg.read_text(encoding='utf-8')
          if "window.VOLLEY_ASSET_VERSION = '20260812f';" not in c:
              raise SystemExit('Expected cache version 20260812f not found')
          c = c.replace("window.VOLLEY_ASSET_VERSION = '20260812f';", "window.VOLLEY_ASSET_VERSION = '20260812g';", 1)
          if 'rpe-authoritative-20260810.js?v=20260810o' not in c:
              raise SystemExit('RPE authoritative cache token not found')
          c = c.replace('rpe-authoritative-20260810.js?v=20260810o','rpe-authoritative-20260810.js?v=20260812g',1)
          cfg.write_text(c, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          for name in ['styles.css','supabase-config.js','supabase-client.js','data.js','app.js']:
              h = h.replace(f'{name}?v=20260812f', f'{name}?v=20260812g')
          index.write_text(h, encoding='utf-8')
          PY

      - name: Validate fix
        run: |
          node --check app.js
          node --check rpe-authoritative-20260810.js
          grep -q "VOLLEY_ASSET_VERSION = '20260812g'" supabase-config.js
          grep -q "app.js?v=20260812g" index.html
          grep -q "RPE del entrenador" app.js
          grep -q "officialNextPresent" app.js

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-session-rpe-attendance-summary.yml
          git add app.js rpe-authoritative-20260810.js supabase-config.js index.html
          git commit -m "Fix session RPE and official attendance summaries"
          git push
