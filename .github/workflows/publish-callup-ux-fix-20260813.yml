name: Publish callup UX cache refresh

on:
  push:
    paths:
      - '.github/workflows/publish-callup-ux-fix-20260813.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate callup JavaScript
        run: node --check match-callup-20260813.js

      - name: Refresh page cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          for old in ('20260813p','20260813q'):
              text = text.replace(old, '20260813r')
          p.write_text(text)
          PY

      - name: Commit cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish match callup UX fix" || true
          git push

      - name: Remove workflow
        run: |
          git rm .github/workflows/publish-callup-ux-fix-20260813.yml
          git commit -m "Remove callup UX publish workflow"
          git push
