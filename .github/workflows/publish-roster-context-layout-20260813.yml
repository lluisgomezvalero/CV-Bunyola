name: Publish roster contextual layout

on:
  push:
    paths:
      - '.github/workflows/publish-roster-context-layout-20260813.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch loader and root cache
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cfg = Path('supabase-config.js')
          text = cfg.read_text()
          if "window.VOLLEY_ASSET_VERSION = '20260813f';" not in text:
              raise SystemExit('Expected asset version 20260813f not found')
          text = text.replace("window.VOLLEY_ASSET_VERSION = '20260813f';", "window.VOLLEY_ASSET_VERSION = '20260813g';", 1)
          needle = "'player-passport-remove-commitment-20260813.js?v=20260813f'];scripts.forEach"
          replacement = "'player-passport-remove-commitment-20260813.js?v=20260813f','roster-context-layout-20260813.js?v=20260813g'];scripts.forEach"
          if needle not in text:
              raise SystemExit('Could not find runtime loader insertion point')
          text = text.replace(needle, replacement, 1)
          cfg.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          if '?v=20260813f' not in html:
              raise SystemExit('Expected root cache version 20260813f not found')
          html = html.replace('?v=20260813f', '?v=20260813g')
          index.write_text(html)
          PY

      - name: Validate
        run: |
          node --check roster-context-layout-20260813.js
          node --check supabase-config.js
          grep -q "VOLLEY_ASSET_VERSION = '20260813g'" supabase-config.js
          grep -q "roster-context-layout-20260813.js?v=20260813g" supabase-config.js
          grep -q "styles.css?v=20260813g" index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Publish contextual roster layout" || true
          git push

      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-roster-context-layout-20260813.yml
          git commit -m "Remove roster layout publish workflow"
          git push
