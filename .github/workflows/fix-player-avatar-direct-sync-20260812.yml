name: Fix player avatar direct sync

on:
  push:
    paths:
      - '.github/workflows/fix-player-avatar-direct-sync-20260812.yml'
      - '.github/scripts/fix_player_avatar_direct_sync.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 .github/scripts/fix_player_avatar_direct_sync.py

      - name: Validate
        run: |
          node --check app.js
          node --check player-avatar-authoritative-20260812.js
          grep -q "syncPlayerAvatarToSupabase(player, file, previousAvatar)" app.js
          grep -q "VOLLEY_ASSET_VERSION = '20260812t'" supabase-config.js
          grep -q "player-avatar-authoritative-20260812.js?v=20260812t" supabase-config.js
          grep -q "app.js?v=20260812t" index.html
          git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js player-avatar-authoritative-20260812.js supabase-config.js index.html
          git commit -m "Fix direct player avatar Supabase sync"

      - name: Remove patch helpers
        run: |
          git rm .github/workflows/fix-player-avatar-direct-sync-20260812.yml .github/scripts/fix_player_avatar_direct_sync.py
          git commit -m "Remove avatar sync patch helpers"
          git push
