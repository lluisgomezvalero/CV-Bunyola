name: Publish final coach attack tabs
on:
  push:
    paths:
      - '.github/workflows/publish-coach-attack-tabs-final-20260816.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Load final coach tabs and refresh cache
        run: |
          python -c "from pathlib import Path; import re; p=Path('supabase-config.js'); s=p.read_text(); s=re.sub(r\"window\\.VOLLEY_ASSET_VERSION = '[^']+';\",\"window.VOLLEY_ASSET_VERSION = '20260816k';\",s,count=1); marker=\"'game-plan-safe-save-20260816.js?v=20260816h'\"; add=marker+\",'game-plan-coach-attack-tabs-final-20260816.js?v=20260816k'\"; s=s.replace(marker,add,1) if 'game-plan-coach-attack-tabs-final-20260816.js' not in s else s; p.write_text(s)"
          for name in supabase-config.js supabase-client.js data.js app.js; do
            sed -E -i "s#${name}\\?v=[^\"']+#${name}?v=20260816k#g" index.html
          done
      - name: Validate JavaScript and load order
        run: |
          node --check game-plan-coach-attack-tabs-final-20260816.js
          node --check supabase-config.js
          grep -q "VOLLEY_ASSET_VERSION = '20260816k'" supabase-config.js
          grep -q "game-plan-coach-attack-tabs-final-20260816.js?v=20260816k" supabase-config.js
          python -c "from pathlib import Path; s=Path('supabase-config.js').read_text(); assert s.index('game-plan-coach-attack-tabs-final-20260816.js') > s.index('game-plan-safe-save-20260816.js')"
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Publish final coach attack tabs 20260816k"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-coach-attack-tabs-final-20260816.yml
          git commit -m "Remove temporary coach tabs workflow"
          git push
