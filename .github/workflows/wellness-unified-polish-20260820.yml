name: Unified wellness polish
on:
  push:
    paths:
      - '.github/workflows/wellness-unified-polish-20260820.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish unified wellness view
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('wellness-unified-mobile-20260820.js')
          s=p.read_text()
          s=s.replace("['users','Respuestas semana',String(d.responses),'']", "['users','Respuestas',String(d.responses),'']")
          s=s.replace("['shield-check','Alertas de carga',String(d.alerts),d.alerts?'attn':'good']", "['shield-check','Alertas',String(d.alerts),d.alerts?'attn':'good']")
          old="function polishChart(root){const canvas=root.querySelector('#chart-wellness-weekly');if(!canvas||!window.Chart)return;try{const chart=window.Chart.getChart(canvas);if(!chart)return;chart.options=chart.options||{};chart.options.plugins=chart.options.plugins||{};chart.options.plugins.legend=chart.options.plugins.legend||{};chart.options.plugins.legend.display=false;const first=(chart.data?.datasets||[])[0];if(first){first.barPercentage=.94;first.categoryPercentage=.96;first.maxBarThickness=72;first.borderRadius=8;}chart.update('none');}catch(_){}}"
          new="function polishChart(root){const canvas=root.querySelector('#chart-wellness-weekly');if(!canvas||!window.Chart)return;try{let chart=null;try{chart=typeof window.Chart.getChart==='function'?window.Chart.getChart(canvas):null;}catch(_){}if(!chart){try{chart=typeof activeChartTrend!=='undefined'?activeChartTrend:null;}catch(_){}}if(!chart)return;chart.options=chart.options||{};chart.options.plugins=chart.options.plugins||{};chart.options.plugins.legend=chart.options.plugins.legend||{};chart.options.plugins.legend.display=false;if(chart.options.legend)chart.options.legend.display=false;const first=(chart.data?.datasets||[])[0];if(first){first.barPercentage=.98;first.categoryPercentage=.98;first.maxBarThickness=78;first.borderRadius=8;}try{chart.update('none');}catch(_){chart.update();}}catch(_){}}"
          if old not in s:
              raise SystemExit('polishChart marker not found')
          s=s.replace(old,new)
          marker="  #view-wellness .player-wellness-history{display:flex;gap:.48rem;overflow-x:auto;scrollbar-width:none;padding:.05rem 0 .12rem}.player-wellness-history::-webkit-scrollbar{display:none}.player-wellness-day{flex:0 0 112px;padding:.68rem;border:1px solid #e7ebef;border-radius:14px;background:#fbfcfd}.player-wellness-day>strong{display:block;color:#344155;font-size:.7rem;margin-bottom:.45rem}.player-day-values{display:grid;gap:.32rem}.player-day-value{display:flex;align-items:center;justify-content:space-between;gap:.35rem;color:#7d8998;font-size:.56rem}.player-day-value b{color:#344155;font-size:.65rem}\n"
          extra="""  #view-wellness.wellness-role-player .player-wellness-app,#view-wellness.wellness-role-player .player-wellness-hero,#view-wellness.wellness-role-player .player-wellness-card{width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important}\n  #view-wellness.wellness-role-player .player-wellness-hero-top,#view-wellness.wellness-role-player .player-wellness-hero-top>div{min-width:0!important;max-width:100%!important}\n  #view-wellness.wellness-role-player .player-wellness-hero p{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;overflow-wrap:anywhere!important;max-width:100%!important}\n  #view-wellness.wellness-role-player .player-wellness-metrics{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;width:100%!important;max-width:100%!important;min-width:0!important;overflow:visible!important}\n  #view-wellness.wellness-role-player .player-wellness-metric{width:auto!important;max-width:none!important;min-width:0!important;flex:none!important;padding:.62rem .35rem!important}\n  #view-wellness.wellness-role-player .player-wellness-metric strong{font-size:.9rem!important}\n  #view-wellness.wellness-role-player .player-wellness-metric small{font-size:.54rem!important;white-space:normal!important}\n"""
          if extra not in s:
              if marker not in s:
                  raise SystemExit('player history marker not found')
              s=s.replace(marker,marker+extra)
          p.write_text(s)

          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260820zc';", "window.VOLLEY_ASSET_VERSION = '20260820zd';")
          s=s.replace("'wellness-unified-mobile-20260820.js?v=20260820a'", "'wellness-unified-mobile-20260820.js?v=20260820b'")
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text().replace('supabase-config.js?v=20260820safe44','supabase-config.js?v=20260820safe45')
          p.write_text(s)
          PY
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wellness-unified-mobile-20260820.js supabase-config.js index.html
          git diff --cached --quiet || git commit -m 'Polish unified wellness cards and chart'
          git push
