name: Refresh player stats cache

on:
  push:
    paths:
      - '.github/workflows/player-stats-cache-bust.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh config cache key
        run: |
          sed -i 's/supabase-config.js?v=20260819safe2/supabase-config.js?v=20260819safe3/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No cache change needed"
          else
            git commit -m "Refresh player statistics assets"
            git push
          fi
