name: Publish mobile modal balance

on:
  push:
    paths:
      - '.github/workflows/publish-mobile-modal-balance-20260813.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch loader and root cache
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path('supabase-config.js')
          text = config.read_text()
          text = text.replace("window.VOLLEY_ASSET_VERSION = '20260813h';", "window.VOLLEY_ASSET_VERSION = '20260813i';")
          needle = "'global-context-shell-20260813.js?v=20260813h'"
          addition = needle + ",'mobile-modal-balance-20260813.js?v=20260813i'"
          if 'mobile-modal-balance-20260813.js' not in text:
              text = text.replace(needle, addition)
          config.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('?v=20260813h', '?v=20260813i')
          index.write_text(html)
          PY

      - name: Validate
        run: |
          node --check mobile-modal-balance-20260813.js
          grep -q "VOLLEY_ASSET_VERSION = '20260813i'" supabase-config.js
          grep -q "mobile-modal-balance-20260813.js?v=20260813i" supabase-config.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Enable balanced mobile modal spacing"
          git push

      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-mobile-modal-balance-20260813.yml
          git commit -m "Remove mobile modal balance publish workflow"
          git push
