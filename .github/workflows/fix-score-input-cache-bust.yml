name: Refresh score input fix

on:
  push:
    paths:
      - '.github/workflows/fix-score-input-cache-bust.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh score input assets
        run: |
          sed -i "s/window.VOLLEY_ASSET_VERSION = '20260819h'/window.VOLLEY_ASSET_VERSION = '20260819i'/g" supabase-config.js
          sed -i 's/match-result-persistence-20260819.js?v=20260819c/match-result-persistence-20260819.js?v=20260819d/g' supabase-config.js
          sed -i 's/supabase-config.js?v=20260819safe6/supabase-config.js?v=20260819safe7/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          if git diff --cached --quiet; then
            echo "No cache change needed"
          else
            git commit -m "Refresh score input fix assets"
            git push
          fi
