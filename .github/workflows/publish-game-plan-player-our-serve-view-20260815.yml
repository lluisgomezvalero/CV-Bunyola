name: Publish player our-serve tactical view

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-game-plan-player-our-serve-view-20260815.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load player serve view and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          cfg = Path('supabase-config.js')
          text = cfg.read_text()
          text = re.sub(r"window\.VOLLEY_ASSET_VERSION = '[^']+';", "window.VOLLEY_ASSET_VERSION = '20260815a';", text, count=1)
          asset = "'game-plan-player-our-serve-view-20260815.js?v=20260815a'"
          if asset not in text:
              needle = "'game-plan-court-visual-unify-20260814.js?v=20260814u'"
              if needle not in text:
                  raise SystemExit('Could not find final game-plan asset anchor')
              text = text.replace(needle, needle + ',' + asset, 1)
          cfg.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          for filename in ('supabase-config.js','supabase-client.js','data.js','app.js'):
              html, count = re.subn(re.escape(filename) + r'\?v=[^"\']+', filename + '?v=20260815a', html)
              if count == 0:
                  print(f'Warning: no cache query found for {filename}')
          index.write_text(html)
          PY

      - name: Validate JavaScript
        run: |
          node --check game-plan-player-our-serve-view-20260815.js
          node --check supabase-config.js

      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Publish player our-serve tactical view"
          git push

      - name: Remove workflow
        run: |
          git rm .github/workflows/publish-game-plan-player-our-serve-view-20260815.yml
          git commit -m "Remove temporary player serve publish workflow"
          git push
