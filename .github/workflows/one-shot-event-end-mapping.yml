name: One-shot training end mapping

on:
  push:
    paths:
      - '.github/workflows/one-shot-event-end-mapping.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve training timing in frontend events
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('supabase-client.js')
          s = p.read_text(encoding='utf-8')
          old = """      stats: payload.stats || null,\n      rawPayload: payload"""
          new = """      stats: payload.stats || null,\n      starts_at: row.starts_at || null,\n      startsAt: row.starts_at || null,\n      ends_at: row.ends_at || null,\n      endsAt: row.ends_at || null,\n      duration: (Number.isFinite(Number(payload.duration)) && Number(payload.duration) > 0)\n        ? Number(payload.duration)\n        : (row.starts_at && row.ends_at ? Math.max(0, Math.round((new Date(row.ends_at) - new Date(row.starts_at)) / 60000)) : null),\n      durationMinutes: (Number.isFinite(Number(payload.duration)) && Number(payload.duration) > 0)\n        ? Number(payload.duration)\n        : (row.starts_at && row.ends_at ? Math.max(0, Math.round((new Date(row.ends_at) - new Date(row.starts_at)) / 60000)) : null),\n      rawPayload: payload"""
          if old not in s:
              raise SystemExit('Expected supabaseToFrontendEvent block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          for name in ('supabase-config.js','supabase-client.js','data.js','app.js'):
              h = h.replace(f'{name}?v=20260811h', f'{name}?v=20260811i')
          idx.write_text(h, encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-event-end-mapping.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase-client.js index.html .github/workflows/one-shot-event-end-mapping.yml
          git commit -m 'Preserve training end time in frontend events'
          git push
