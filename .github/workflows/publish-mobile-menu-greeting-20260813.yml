name: Publish mobile menu and greeting
on:
  push:
    paths:
      - '.github/workflows/publish-mobile-menu-greeting-20260813.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loader and cache
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cfg = Path('supabase-config.js')
          text = cfg.read_text()
          old_version = "window.VOLLEY_ASSET_VERSION = '20260813b';"
          new_version = "window.VOLLEY_ASSET_VERSION = '20260813c';"
          if old_version not in text:
              raise SystemExit('Expected asset version not found')
          text = text.replace(old_version, new_version, 1)

          old_tail = "'sidebar-viewport-stability-20260812.js?v=20260812y'];"
          new_tail = "'sidebar-viewport-stability-20260812.js?v=20260812y','mobile-menu-greeting-20260813.js?v=20260813c'];"
          if old_tail not in text:
              raise SystemExit('Expected script-list tail not found')
          text = text.replace(old_tail, new_tail, 1)
          cfg.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          if '?v=20260813b' not in html:
              raise SystemExit('Expected index cache version not found')
          index.write_text(html.replace('?v=20260813b', '?v=20260813c'))
          PY
      - name: Validate
        run: |
          node --check mobile-menu-greeting-20260813.js
          node --check supabase-config.js
          node --check app.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Publish mobile menu-only header and night greeting" || true
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-mobile-menu-greeting-20260813.yml
          git commit -m "Remove mobile menu greeting workflow"
          git push
