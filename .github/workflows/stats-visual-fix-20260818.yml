name: Statistics visual fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stats-visual-fix-20260818.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visual fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('match-statistics-priority-ux-20260818.js')
          s = p.read_text()
          s = s.replace(
            "#stats-priority-grid .stats-summary-icon{flex:0 0 auto}",
            "#stats-priority-grid .stats-summary-icon{display:none!important}"
          )
          s = s.replace(
            "#stats-priority-grid span:not(.stats-summary-icon){font-size:.72rem!important;line-height:1.2}",
            "#stats-priority-grid span:not(.stats-summary-icon){font-size:.72rem!important;line-height:1.2;white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important;min-width:0!important}"
          )
          s = s.replace(
            "#stats-priority-grid span:not(.stats-summary-icon){font-size:.66rem!important}",
            "#stats-priority-grid span:not(.stats-summary-icon){font-size:.66rem!important;white-space:normal!important;overflow-wrap:anywhere!important}"
          )
          marker = "  ['stats-avg-rec-perfect','stats-avg-rec-error','stats-avg-attack-efficiency'].forEach(id=>{\n"
          insert = "  const serveErrorIcon=document.getElementById('stats-total-serve-errors')?.closest('.stats-summary-item')?.querySelector('.stats-summary-icon');\n  if(serveErrorIcon)serveErrorIcon.textContent='❌';\n\n"
          if insert not in s:
              if marker not in s: raise SystemExit('priority marker missing')
              s = s.replace(marker, insert + marker)
          p.write_text(s)

          p = Path('supabase-config.js')
          s = p.read_text()
          s = s.replace("window.VOLLEY_ASSET_VERSION = '20260818a';", "window.VOLLEY_ASSET_VERSION = '20260818b';")
          s = s.replace("match-statistics-priority-ux-20260818.js?v=20260818a", "match-statistics-priority-ux-20260818.js?v=20260818b")
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          import re
          s, n = re.subn(r'supabase-config\.js\?v=[A-Za-z0-9_-]+', 'supabase-config.js?v=20260818b', s)
          if n != 1: raise SystemExit(f'expected 1 config reference, got {n}')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          set -euo pipefail
          node --check match-statistics-priority-ux-20260818.js
          node --check match-statistics-authoritative-20260817.js
          grep -F "serveErrorIcon.textContent='❌'" match-statistics-priority-ux-20260818.js
          grep -F "match-statistics-priority-ux-20260818.js?v=20260818b" supabase-config.js
          grep -F "game-plan-canonical-20260817.js?v=20260817g" supabase-config.js
          grep -F "supabase-config.js?v=20260818b" index.html
      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add match-statistics-priority-ux-20260818.js supabase-config.js index.html
          git commit -m "Polish key statistics cards" || true
          git push
      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git pull --rebase
          git rm .github/workflows/stats-visual-fix-20260818.yml
          git commit -m "Remove temporary statistics visual fix workflow"
          git push
