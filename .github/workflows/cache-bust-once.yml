name: One-time root cache refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-once.yml'

permissions:
  contents: write

jobs:
  refresh-cache-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update root asset versions
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'fix_attendance_and_event_sync_v2'
          new = '20260811f'
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'Expected exactly 4 root asset versions, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit isolated cache fix and remove workflow
        shell: bash
        run: |
          rm .github/workflows/cache-bust-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/cache-bust-once.yml
          git commit -m "Refresh root asset cache version"
          git push origin HEAD:main
