name: Publish calendar add button polish

on:
  push:
    paths:
      - '.github/workflows/calendar-add-button-cache-bust.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load add button polish and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          needle="  'calendar-toolbar-polish-20260820.js?v=20260820a',\n"
          line="  'calendar-add-button-polish-20260820.js?v=20260820a',\n"
          if line not in s:
              s=s.replace(needle, needle+line)
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260820p'", "window.VOLLEY_ASSET_VERSION = '20260820q'")
          p.write_text(s)
          PY
          sed -i 's/supabase-config.js?v=20260820safe31/supabase-config.js?v=20260820safe32/g' index.html
          rm -f .github/workflows/calendar-add-button-cache-bust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html .github/workflows/calendar-add-button-cache-bust.yml
          git commit -m "Publish calendar add button polish"
          git push
