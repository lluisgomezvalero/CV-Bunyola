name: Publish attendance streak label
on:
  push:
    paths:
      - '.github/workflows/publish-attendance-streak-label-20260812.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['supabase-config.js','index.html']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('20260812q','20260812r')
              p.write_text(s)
          PY
          node --check player-dashboard-priority-20260812.js
      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html player-dashboard-priority-20260812.js
          git commit -m "Rename player attendance streak label" || true
          git rm .github/workflows/publish-attendance-streak-label-20260812.yml
          git commit -m "Remove temporary attendance label workflow" || true
          git push
