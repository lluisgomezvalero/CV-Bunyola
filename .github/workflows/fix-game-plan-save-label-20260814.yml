name: Fix game plan save label
on:
  push:
    paths:
      - '.github/workflows/fix-game-plan-save-label-20260814.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix save button label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game-plan-ux-20260814.js')
          s=p.read_text()
          old="""    const text=[...save.childNodes].find(node=>node.nodeType===Node.TEXT_NODE);\n    if(text)text.textContent=' Guardar borrador';\n    else if(!save.querySelector('span'))save.insertAdjacentHTML('beforeend','<span>Guardar borrador</span>');"""
          new="""    save.innerHTML='<i data-lucide=\"save\"></i><span>Guardar borrador</span>';"""
          if old not in s:
              raise SystemExit('Expected save-label block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Validate JavaScript
        run: node --check game-plan-ux-20260814.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-plan-ux-20260814.js
          git commit -m "Fix game plan save label"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/fix-game-plan-save-label-20260814.yml
          git commit -m "Remove game plan save label workflow"
          git push
