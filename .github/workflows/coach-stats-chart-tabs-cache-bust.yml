name: Refresh coach chart tabs

on:
  push:
    paths:
      - '.github/workflows/coach-stats-chart-tabs-cache-bust.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh coach chart tabs assets
        run: |
          sed -i 's/supabase-config.js?v=20260819safe13/supabase-config.js?v=20260820safe14/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No cache change needed"
          else
            git commit -m "Refresh coach statistics chart tabs assets"
            git push
          fi
