name: Publish game plan hydration stability
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-hydration-stability-20260816.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply hydration stability patch
        run: python .github/scripts/patch_game_plan_hydration_20260816.py
      - name: Validate JavaScript and version
        run: |
          node --check game-plan-authoritative-20260809.js
          node --check supabase-config.js
          grep -q "lastHydratedRemoteByMatch" game-plan-authoritative-20260809.js
          grep -q "game-plan-authoritative-20260809.js?v=20260816i" supabase-config.js
          grep -q "VOLLEY_ASSET_VERSION = '20260816i'" supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-plan-authoritative-20260809.js supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Stop repeated game plan hydration renders 20260816i"
          git push
      - name: Remove temporary files
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-hydration-stability-20260816.yml .github/scripts/patch_game_plan_hydration_20260816.py
          git commit -m "Remove temporary hydration stability files"
          git push
