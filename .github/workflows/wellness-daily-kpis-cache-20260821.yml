name: Bust wellness KPI cache

on:
  push:
    paths:
      - '.github/workflows/wellness-daily-kpis-cache-20260821.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh Supabase config
        run: |
          sed -i 's/supabase-config.js?v=20260821safe51/supabase-config.js?v=20260821safe52/g' index.html
          rm .github/workflows/wellness-daily-kpis-cache-20260821.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/wellness-daily-kpis-cache-20260821.yml
          git commit -m "Force fresh daily wellness KPIs"
          git push
