name: Load wellness player modal polish

on:
  push:
    paths:
      - '.github/workflows/load-wellness-player-modal-polish-20260822.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cache keys and validate script
        run: |
          node --check wellness-individual-tracking-20260822.js
          python - <<'PY'
          from pathlib import Path
          config=Path('supabase-config.js')
          s=config.read_text()
          for old,new in [
            ("window.VOLLEY_ASSET_VERSION = '20260822f';","window.VOLLEY_ASSET_VERSION = '20260822g';"),
            ("'wellness-individual-tracking-20260822.js?v=20260822a'","'wellness-individual-tracking-20260822.js?v=20260822b'"),
          ]:
            if old not in s: raise SystemExit(f'missing config token: {old}')
            s=s.replace(old,new,1)
          config.write_text(s)

          index=Path('index.html')
          s=index.read_text()
          old='supabase-config.js?v=20260822safe61'
          new='supabase-config.js?v=20260822safe62'
          if old not in s: raise SystemExit('missing index cache token')
          index.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Load wellness player modal polish"
          git push
          git rm .github/workflows/load-wellness-player-modal-polish-20260822.yml
          git commit -m "Remove one-time modal polish workflow"
          git push
