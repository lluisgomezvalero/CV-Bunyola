name: Publish visual mobile calendar

on:
  push:
    paths:
      - '.github/workflows/calendar-google-style-cache-bust.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh visual calendar assets
        run: |
          sed -i "s/window.VOLLEY_ASSET_VERSION = '20260820n'/window.VOLLEY_ASSET_VERSION = '20260820o'/g" supabase-config.js
          sed -i 's/calendar-mobile-app-ux-20260820.js?v=20260820b/calendar-mobile-app-ux-20260820.js?v=20260820c/g' supabase-config.js
          sed -i 's/supabase-config.js?v=20260820safe29/supabase-config.js?v=20260820safe30/g' index.html
          rm -f .github/workflows/calendar-google-style-cache-bust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html .github/workflows/calendar-google-style-cache-bust.yml
          git commit -m "Publish visual Google-style mobile calendar"
          git push