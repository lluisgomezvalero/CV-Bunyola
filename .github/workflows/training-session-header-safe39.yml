name: Refresh training session header layout

on:
  push:
    paths:
      - '.github/workflows/training-session-header-safe39.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish header layout and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260820w'", "window.VOLLEY_ASSET_VERSION = '20260820x'")
          s=s.replace("'training-session-header-fix-20260820.js?v=20260820a'", "'training-session-header-fix-20260820.js?v=20260820b'")
          p.write_text(s)
          PY
          sed -i 's/supabase-config.js?v=20260820safe38/supabase-config.js?v=20260820safe39/g' index.html
          rm -f .github/workflows/training-session-header-safe39.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html .github/workflows/training-session-header-safe39.yml
          git commit -m "Publish training session header safe39"
          git push
