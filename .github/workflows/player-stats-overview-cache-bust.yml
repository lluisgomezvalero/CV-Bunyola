name: Refresh player statistics overview

on:
  push:
    paths:
      - '.github/workflows/player-stats-overview-cache-bust.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh player statistics overview assets
        run: |
          sed -i "s/window.VOLLEY_ASSET_VERSION = '20260819n'/window.VOLLEY_ASSET_VERSION = '20260819o'/g" supabase-config.js
          sed -i "/match-statistics-coach-final-polish-20260819.js?v=20260819a/a\\  'match-statistics-player-overview-20260819.js?v=20260819a'," supabase-config.js
          sed -i 's/supabase-config.js?v=20260819safe12/supabase-config.js?v=20260819safe13/g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          if git diff --cached --quiet; then
            echo "No cache change needed"
          else
            git commit -m "Refresh player statistics overview assets"
            git push
          fi
