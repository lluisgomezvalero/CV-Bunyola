name: Cleanup game plan runtime
on:
  push:
    paths:
      - '.github/workflows/cleanup-game-plan-runtime-20260816.yml'
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete game plan layers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          cfg = Path('supabase-config.js')
          text = cfg.read_text()
          obsolete = [
              "'game-plan-sync.js?v=20260810n',",
              "'game-plan-attack-tabs-20260814.js?v=20260814r',",
          ]
          for token in obsolete:
              if token not in text:
                  raise SystemExit(f'missing expected loader entry: {token}')
              text = text.replace(token, '', 1)
          text = re.sub(r"window\.VOLLEY_ASSET_VERSION = '[^']+';", "window.VOLLEY_ASSET_VERSION = '20260816l';", text, count=1)
          cfg.write_text(text)

          idx = Path('index.html')
          html = idx.read_text()
          for name in ['supabase-config.js','supabase-client.js','data.js','app.js']:
              html = re.sub(re.escape(name) + r'\?v=[^"\']+', name + '?v=20260816l', html)
          idx.write_text(html)
          PY
          git rm game-plan-sync.js
          git rm game-plan-attack-tabs-20260814.js
          git rm game-plan-action-bar-authoritative-20260816.js
          git rm game-plan-player-attack-tabs-20260816.js
      - name: Validate clean runtime
        run: |
          node --check supabase-config.js
          grep -q "VOLLEY_ASSET_VERSION = '20260816l'" supabase-config.js
          grep -q "game-plan-coach-attack-tabs-final-20260816.js?v=20260816k" supabase-config.js
          ! grep -q "game-plan-sync.js" supabase-config.js
          ! grep -q "game-plan-attack-tabs-20260814.js" supabase-config.js
          test ! -e game-plan-action-bar-authoritative-20260816.js
          test ! -e game-plan-player-attack-tabs-20260816.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Clean obsolete game plan runtime layers"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/cleanup-game-plan-runtime-20260816.yml
          git commit -m "Remove temporary game plan cleanup workflow"
          git push
