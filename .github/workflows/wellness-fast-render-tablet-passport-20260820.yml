name: Wellness fast render and tablet passport
on:
  push:
    paths:
      - '.github/workflows/wellness-fast-render-tablet-passport-20260820.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fast wellness render and tablet passport fit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase-config.js')
          s=p.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260820zf';", "window.VOLLEY_ASSET_VERSION = '20260820zg';")
          old="""    style.textContent=`html:not(.wellness-unified-ready) #view-wellness.active{visibility:hidden!important;opacity:0!important;pointer-events:none!important}`;\n    window.setTimeout(()=>document.documentElement.classList.add('wellness-unified-ready'),5000);"""
          new="""    style.textContent=`\nhtml:not(.wellness-unified-ready) #view-wellness.active{visibility:visible!important;opacity:1!important;pointer-events:none!important;position:relative!important;min-height:420px!important}\nhtml:not(.wellness-unified-ready) #view-wellness.active>*{visibility:hidden!important}\nhtml:not(.wellness-unified-ready) #view-wellness.active::before{content:'Preparando bienestar…';visibility:visible!important;position:absolute!important;left:0!important;right:0!important;top:.35rem!important;height:150px!important;border:1px solid #e4e9ef!important;border-radius:20px!important;background:linear-gradient(110deg,#fff 20%,#f4f7fa 38%,#fff 56%)!important;background-size:220% 100%!important;animation:wellnessPrep 1.1s linear infinite!important;display:flex!important;align-items:center!important;justify-content:center!important;color:#7b8798!important;font:800 .78rem/1.2 Inter,system-ui,sans-serif!important;box-shadow:0 5px 16px rgba(15,23,42,.03)!important}\n@keyframes wellnessPrep{to{background-position-x:-220%}}\n`;"""
          if old not in s:
              raise SystemExit('wellness preload marker not found')
          s=s.replace(old,new,1)
          marker="  'wellness-v2-20260811.js?v=20260811n',"
          controller="  'wellness-render-controller-20260820.js?v=20260820a',"
          if controller not in s:
              s=s.replace(marker,marker+'\n'+controller,1)
          marker2="  'player-passport-priority-20260813.js?v=20260813d',"
          fit="  'tablet-player-passport-fit-20260820.js?v=20260820a',"
          if fit not in s:
              s=s.replace(marker2,marker2+'\n'+fit,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text().replace('supabase-config.js?v=20260820safe47','supabase-config.js?v=20260820safe48')
          p.write_text(s)
          PY
      - name: Commit refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m 'Speed up wellness render and fit tablet player passport'
          git push
