name: Add match stats blocks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-match-stats-blocks-20260817.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add blocks end-to-end
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1) Form UI: add Bloqueos beside serve errors.
          p=Path('index.html')
          s=p.read_text()
          old='''            <div class="form-group">\n              <label for="stats-serve-errors">Errores de saque</label>\n              <input type="number" id="stats-serve-errors" class="form-control" required min="0" step="1" placeholder="Ej. 5">\n            </div>\n          </div>\n          <div class="form-row">\n            <div class="form-group">\n              <label for="stats-own-errors">Errores nuestros</label>'''
          new='''            <div class="form-group">\n              <label for="stats-serve-errors">Errores de saque</label>\n              <input type="number" id="stats-serve-errors" class="form-control" required min="0" step="1" placeholder="Ej. 5">\n            </div>\n          </div>\n          <div class="form-row">\n            <div class="form-group">\n              <label for="stats-bloqueos">Bloqueos punto</label>\n              <input type="number" id="stats-bloqueos" class="form-control" required min="0" step="1" placeholder="Ej. 4">\n            </div>\n            <div class="form-group">\n              <label for="stats-own-errors">Errores nuestros</label>'''
          if 'id="stats-bloqueos"' not in s:
              if old not in s: raise SystemExit('index form marker missing')
              s=s.replace(old,new,1)
              # Close the newly created row before opponent errors by turning the following pair into its own row.
              old2='''              <small class="form-help">Errores propios que conceden punto, excluyendo recepción y defensa.</small>\n            </div>\n            <div class="form-group">\n              <label for="stats-opponent-errors">Errores del rival</label>'''
              new2='''              <small class="form-help">Errores propios que conceden punto, excluyendo recepción y defensa.</small>\n            </div>\n          </div>\n          <div class="form-row">\n            <div class="form-group">\n              <label for="stats-opponent-errors">Errores del rival</label>'''
              if old2 not in s: raise SystemExit('opponent errors marker missing')
              s=s.replace(old2,new2,1)
          p.write_text(s)

          # 2) Authoritative stats module: save and populate blocks.
          p=Path('match-statistics-authoritative-20260817.js')
          s=p.read_text()
          old="""    serveErrors:formNumber('stats-serve-errors',{integer:true}),\n    ownErrors:formNumber('stats-own-errors',{integer:true}),"""
          new="""    serveErrors:formNumber('stats-serve-errors',{integer:true}),\n    bloqueos:formNumber('stats-bloqueos',{integer:true}),\n    ownErrors:formNumber('stats-own-errors',{integer:true}),"""
          if "bloqueos:formNumber('stats-bloqueos'" not in s:
              if old not in s: raise SystemExit('statsFromForm marker missing')
              s=s.replace(old,new,1)

          # Wrap modal opening once so existing Supabase values populate the new input.
          marker="let baseOpenPlayerMatchStats=null;"
          if 'let baseOpenMatchStatsModal=null;' not in s:
              s=s.replace(marker, marker+'\nlet baseOpenMatchStatsModal=null;',1)

          helper='''\nfunction openCoachModalWithBlocks(matchId){\n  baseOpenMatchStatsModal?.(matchId);\n  const match=matches().find(m=>String(m.id)===String(matchId));\n  const input=document.getElementById('stats-bloqueos');\n  if(input)input.value=match?.stats?.bloqueos??'';\n}\n'''
          anchor='async function openPlayerSafe(matchId){'
          if 'function openCoachModalWithBlocks' not in s:
              if anchor not in s: raise SystemExit('player safe anchor missing')
              s=s.replace(anchor,helper+'\n'+anchor,1)

          old_install="""    const renderFn=window.renderStats||(typeof renderStats==='function'?renderStats:null);\n    const playerFn=window.openPlayerMatchStats||(typeof openPlayerMatchStats==='function'?openPlayerMatchStats:null);\n    if(typeof renderFn==='function'&&typeof playerFn==='function'){\n      clearInterval(timer);installed=true;baseRenderStats=renderFn;baseOpenPlayerMatchStats=playerFn;"""
          new_install="""    const renderFn=window.renderStats||(typeof renderStats==='function'?renderStats:null);\n    const playerFn=window.openPlayerMatchStats||(typeof openPlayerMatchStats==='function'?openPlayerMatchStats:null);\n    const coachModalFn=window.openMatchStatsModal||(typeof openMatchStatsModal==='function'?openMatchStatsModal:null);\n    if(typeof renderFn==='function'&&typeof playerFn==='function'&&typeof coachModalFn==='function'){\n      clearInterval(timer);installed=true;baseRenderStats=renderFn;baseOpenPlayerMatchStats=playerFn;baseOpenMatchStatsModal=coachModalFn;"""
          if 'baseOpenMatchStatsModal=coachModalFn' not in s:
              if old_install not in s: raise SystemExit('install marker missing')
              s=s.replace(old_install,new_install,1)

          old_wrap="""      window.openPlayerMatchStats=function(id){void openPlayerSafe(id);};try{openPlayerMatchStats=window.openPlayerMatchStats;}catch(_){}\n      window.quickPublishMatchStats=function(id){void quickPublish(id);};"""
          new_wrap="""      window.openPlayerMatchStats=function(id){void openPlayerSafe(id);};try{openPlayerMatchStats=window.openPlayerMatchStats;}catch(_){}\n      window.openMatchStatsModal=openCoachModalWithBlocks;try{openMatchStatsModal=openCoachModalWithBlocks;}catch(_){}\n      window.quickPublishMatchStats=function(id){void quickPublish(id);};"""
          if 'window.openMatchStatsModal=openCoachModalWithBlocks' not in s:
              if old_wrap not in s: raise SystemExit('wrapper marker missing')
              s=s.replace(old_wrap,new_wrap,1)
          p.write_text(s)

          # 3) Cache bump only for stats module/config.
          p=Path('supabase-config.js')
          s=p.read_text()
          import re
          s=re.sub(r"window\.VOLLEY_ASSET_VERSION = '[^']+';", "window.VOLLEY_ASSET_VERSION = '20260817j';", s, count=1)
          s=s.replace('match-statistics-authoritative-20260817.js?v=20260817i','match-statistics-authoritative-20260817.js?v=20260817j')
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s,n=re.subn(r'supabase-config\.js\?v=[A-Za-z0-9_-]+','supabase-config.js?v=20260817j',s)
          if n!=1: raise SystemExit(f'expected one config ref, got {n}')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          set -euo pipefail
          node --check match-statistics-authoritative-20260817.js
          grep -F 'id="stats-bloqueos"' index.html
          grep -F "bloqueos:formNumber('stats-bloqueos',{integer:true})" match-statistics-authoritative-20260817.js
          grep -F 'window.openMatchStatsModal=openCoachModalWithBlocks' match-statistics-authoritative-20260817.js
          grep -F 'match-statistics-authoritative-20260817.js?v=20260817j' supabase-config.js
          grep -F 'game-plan-canonical-20260817.js?v=20260817g' supabase-config.js
      - name: Commit change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html match-statistics-authoritative-20260817.js supabase-config.js
          if ! git diff --cached --quiet; then
            git commit -m "Complete blocks metric in match statistics"
            git push
          fi
      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git pull --rebase
          git rm .github/workflows/add-match-stats-blocks-20260817.yml
          git commit -m "Remove temporary blocks metric workflow"
          git push
