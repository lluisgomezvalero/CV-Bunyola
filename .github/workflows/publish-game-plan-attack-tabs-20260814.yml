name: Publish mobile attack tabs
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-attack-tabs-20260814.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh app cache version
        run: |
          sed -i 's/supabase-config.js?v=20260814q/supabase-config.js?v=20260814r/g' index.html
      - name: Validate JavaScript
        run: |
          node --check game-plan-attack-tabs-20260814.js
          node --check supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh cache for mobile attack tabs"
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/publish-game-plan-attack-tabs-20260814.yml
          git commit -m "Remove temporary attack tabs workflow"
          git push
