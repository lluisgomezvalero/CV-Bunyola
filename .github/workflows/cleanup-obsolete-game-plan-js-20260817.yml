name: Cleanup obsolete game plan JS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-obsolete-game-plan-js-20260817.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete game-plan JavaScript
        run: |
          set -euo pipefail
          echo "Removing obsolete game-plan JS files:"
          find . -maxdepth 1 -type f -name 'game-plan-*.js' ! -name 'game-plan-canonical-20260817.js' -print -delete
          node --check game-plan-canonical-20260817.js
          python - <<'PY'
          from pathlib import Path
          cfg = Path('supabase-config.js').read_text()
          active = [line.strip() for line in cfg.splitlines() if "'game-plan-" in line and '.js?' in line]
          assert active == ["'game-plan-canonical-20260817.js?v=20260817g',"], active
          print('Active game-plan JS:', active[0])
          PY
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove obsolete game plan JavaScript"
            git push
          fi
      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git pull --rebase
          git rm .github/workflows/cleanup-obsolete-game-plan-js-20260817.yml
          git commit -m "Remove temporary game plan cleanup workflow"
          git push
