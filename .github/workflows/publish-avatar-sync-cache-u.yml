name: Publish avatar sync cache u

on:
  push:
    paths:
      - '.github/workflows/publish-avatar-sync-cache-u.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache
        run: |
          sed -i "s/VOLLEY_ASSET_VERSION = '20260812t'/VOLLEY_ASSET_VERSION = '20260812u'/" supabase-config.js
          sed -i "s/player-avatar-authoritative-20260812.js?v=20260812t/player-avatar-authoritative-20260812.js?v=20260812u/" supabase-config.js
          sed -i 's/?v=20260812t/?v=20260812u/g' index.html
      - name: Validate
        run: |
          node --check app.js
          node --check player-avatar-authoritative-20260812.js
          grep -q "syncPlayerAvatarToSupabase(player, file, previousAvatar)" app.js
          grep -q "VOLLEY_ASSET_VERSION = '20260812u'" supabase-config.js
          grep -q "player-avatar-authoritative-20260812.js?v=20260812u" supabase-config.js
          grep -q "app.js?v=20260812u" index.html
          git diff --check
      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html supabase-config.js
          git commit -m "Publish avatar sync cache u"
          git rm .github/workflows/publish-avatar-sync-cache-u.yml
          git commit -m "Remove avatar cache publish workflow"
          git push
