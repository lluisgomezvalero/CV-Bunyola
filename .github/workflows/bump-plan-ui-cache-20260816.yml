name: Bump plan UI cache
on:
  push:
    paths:
      - '.github/workflows/bump-plan-ui-cache-20260816.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('supabase-config.js')
          s=p.read_text()
          s=re.sub(r"window\.VOLLEY_ASSET_VERSION = '[^']+';", "window.VOLLEY_ASSET_VERSION = '20260816p';", s)
          s=s.replace("game-plan-player-rival-serve-20260816.js?v=20260816o","game-plan-player-rival-serve-20260816.js?v=20260816p")
          p.write_text(s)
          html=Path('index.html')
          h=html.read_text()
          for name in ['supabase-config.js','supabase-client.js','data.js','app.js']:
              h=re.sub(rf'({re.escape(name)}\?v=)[^"\']+', rf'\g<1>20260816p', h)
          html.write_text(h)
          PY
      - name: Validate
        run: |
          node --check game-plan-player-rival-serve-20260816.js
          node --check game-plan-attack-tabs-20260814.js
          node --check supabase-config.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Bump plan UI cache after fallback cleanup" || true
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/bump-plan-ui-cache-20260816.yml
          git commit -m "Remove temporary plan cache workflow"
          git push
