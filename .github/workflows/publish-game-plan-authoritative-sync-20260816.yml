name: Publish authoritative game plan sync
on:
  push:
    paths:
      - '.github/workflows/publish-game-plan-authoritative-sync-20260816.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Switch renderer and refresh cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          cfg=Path('supabase-config.js')
          text=cfg.read_text()
          old=re.search(r"'game-plan-player-attack-tabs-20260816\.js\?v=[^']+'",text)
          if not old:
              raise SystemExit('old player attack renderer entry not found')
          replacement="'game-plan-player-attack-authoritative-20260816.js?v=20260816g','game-plan-publish-sync-guard-20260816.js?v=20260816g'"
          text=text[:old.start()]+replacement+text[old.end():]
          text=re.sub(r"window\.VOLLEY_ASSET_VERSION = '[^']+';","window.VOLLEY_ASSET_VERSION = '20260816g';",text, count=1)
          cfg.write_text(text)

          idx=Path('index.html')
          html=idx.read_text().replace('20260816f','20260816g')
          for name in ['supabase-config.js','supabase-client.js','data.js','app.js']:
              html=re.sub(rf'{re.escape(name)}\?v=[^\"\']+',f'{name}?v=20260816g',html)
          idx.write_text(html)
          PY
      - name: Validate JavaScript and load order
        run: |
          node --check game-plan-player-attack-authoritative-20260816.js
          node --check game-plan-publish-sync-guard-20260816.js
          node --check supabase-config.js
          grep -q "VOLLEY_ASSET_VERSION = '20260816g'" supabase-config.js
          grep -q "game-plan-player-attack-authoritative-20260816.js?v=20260816g" supabase-config.js
          grep -q "game-plan-publish-sync-guard-20260816.js?v=20260816g" supabase-config.js
          ! grep -q "game-plan-player-attack-tabs-20260816.js" supabase-config.js
      - name: Commit publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git diff --cached --quiet || git commit -m "Publish authoritative game plan sync 20260816g"
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-game-plan-authoritative-sync-20260816.yml
          git commit -m "Remove temporary game plan publish workflow"
          git push
