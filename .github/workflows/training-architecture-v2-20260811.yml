name: Apply training architecture v2
on:
  push:
    paths:
      - '.github/workflows/training-architecture-v2-20260811.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update training architecture
        run: echo '' | base64 -d > /tmp/training_arch.py && python /tmp/training_arch.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/training-architecture-v2-20260811.yml
          git add index.html app.js
          git diff --cached --check
          git commit -m 'feat: simplify training sessions navigation'
          git push
