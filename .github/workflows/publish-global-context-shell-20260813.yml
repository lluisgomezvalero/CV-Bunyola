name: Publish global contextual mobile shell
on:
  push:
    branches: [main]
    paths:
      - 'global-context-shell-20260813.js'
      - '.github/workflows/publish-global-context-shell-20260813.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loader and root cache
        run: |
          python - <<'PY'
          from pathlib import Path
          cfg=Path('supabase-config.js')
          s=cfg.read_text()
          s=s.replace("window.VOLLEY_ASSET_VERSION = '20260813g';","window.VOLLEY_ASSET_VERSION = '20260813h';")
          marker="'roster-context-layout-20260813.js?v=20260813g'"
          addition=marker+",'global-context-shell-20260813.js?v=20260813h'"
          if "global-context-shell-20260813.js" not in s:
              s=s.replace(marker,addition)
          cfg.write_text(s)
          idx=Path('index.html')
          t=idx.read_text().replace('?v=20260813g','?v=20260813h')
          idx.write_text(t)
          PY
      - name: Validate
        run: |
          node --check global-context-shell-20260813.js
          grep -q "VOLLEY_ASSET_VERSION = '20260813h'" supabase-config.js
          grep -q "global-context-shell-20260813.js?v=20260813h" supabase-config.js
          grep -q "styles.css?v=20260813h" index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-config.js index.html
          git commit -m "Enable global contextual mobile shell" || exit 0
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/publish-global-context-shell-20260813.yml
          git commit -m "Remove global shell publish workflow"
          git push
